function byId(list, id, label) {
  const found = list.find((x) => x.id === id);
  assert(!!found, 'KAYIT_YOK', `${label} bulunamadı (${id}).`);
  return found;
}

function warehouseProductStock(st, warehouseId, productId, subProductId = null) {
  let qty = 0n;
  let cost = 0n;
  for (const m of st.stockMovements) {
    if ((!warehouseId || m.warehouseId === warehouseId) &&
        (!productId || m.productId === productId) &&
        (!subProductId || m.subProductId === subProductId)) {
      qty += BigInt(m.qtyGrams);
      cost += BigInt(m.costMinor);
    }
  }
  const avgMicro = qty > 0n ? divRoundHalfAway(cost * 100_000n, qty) : 0n;
  return {
    qtyGrams: qty.toString(),
    costMinor: cost.toString(),
    avgUnitPriceMicro: avgMicro.toString()
  };
}

function tradeAllocatedMinor(st, tradeId) {
  let sum = 0n;
  for (const a of st.allocations) {
    if (a.status === 'active' && a.tradeId === tradeId) {
      sum += BigInt(a.amountMinor);
    }
  }
  return sum.toString();
}

function tradeExpectedSettleMinor(trade) {
  if (trade.status === 'void') return '0';
  return trade.kind === 'sale' ? trade.totalWithVatMinor : trade.netPayableMinor;
}

function tradeOpenMinor(st, trade) {
  if (trade.status === 'void') return '0';
  const expected = BigInt(tradeExpectedSettleMinor(trade));
  const alloc = BigInt(tradeAllocatedMinor(st, trade.id));
  return (expected - alloc).toString();
}

function sourceAllocatedMinor(st, sourceKind, sourceId) {
  let sum = 0n;
  for (const a of st.allocations) {
    if (a.status === 'active' && a.sourceKind === sourceKind && a.sourceId === sourceId) {
      sum += BigInt(a.amountMinor);
    }
  }
  return sum.toString();
}

function partyBalanceMinor(st, partyId) {
  let bal = 0n;
  for (const row of st.partyLedger) {
    if (row.partyId !== partyId) continue;
    if (row.direction === 'DEBIT') bal += BigInt(row.amountMinor);
    else bal -= BigInt(row.amountMinor);
  }
  return bal.toString();
}

function accountBalanceMinor(st, accountId) {
  let bal = 0n;
  for (const c of st.cashMovements) {
    if (c.accountId === accountId) {
      bal += BigInt(c.signedMinor);
    }
  }
  return bal.toString();
}

function computeMarginAndMarkup(salesNetMinor, cogsMinor) {
  const s = BigInt(salesNetMinor);
  const c = BigInt(cogsMinor);
  const grossProfit = s - c;
  const marginBps = s > 0n ? divRoundHalfAway(grossProfit * BPS_SCALE, s).toString() : null;
  const markupBps = c > 0n ? divRoundHalfAway(grossProfit * BPS_SCALE, c).toString() : null;
  return {
    grossProfitMinor: grossProfit.toString(),
    marginBps,
    markupBps
  };
}

function computeAgingSummary(st, asOfDateStr, directionFilter = 'ALL', partyIdFilter = null) {
  const asOf = strictIsoDate(asOfDateStr, 'Baz tarih');
  const asOfMs = Date.parse(asOf + 'T00:00:00Z');
  const DAY_MS = 86400000;

  const buckets = {
    notDueMinor: 0n,
    d0_30Minor: 0n,
    d31_60Minor: 0n,
    d61_90Minor: 0n,
    d90PlusMinor: 0n,
    totalOpenMinor: 0n,
    items: []
  };

  for (const t of st.trades) {
    if (t.status !== 'posted') continue;
    if (partyIdFilter && t.partyId !== partyIdFilter) continue;
    if (directionFilter === 'RECEIVABLE' && t.kind !== 'sale') continue;
    if (directionFilter === 'PAYABLE' && t.kind !== 'purchase') continue;

    const open = BigInt(tradeOpenMinor(st, t));
    if (open <= 0n) continue;

    const dueStr = t.dueDate || t.date;
    const dueMs = Date.parse(dueStr + 'T00:00:00Z');
    const overdueDays = Math.round((asOfMs - dueMs) / DAY_MS);

    if (overdueDays <= 0) buckets.notDueMinor += open;
    else if (overdueDays <= 30) buckets.d0_30Minor += open;
    else if (overdueDays <= 60) buckets.d31_60Minor += open;
    else if (overdueDays <= 90) buckets.d61_90Minor += open;
    else buckets.d90PlusMinor += open;

    buckets.totalOpenMinor += open;
    buckets.items.push({
      kind: 'trade',
      subKind: t.docSubType || (t.kind === 'sale' ? 'Satış Faturası' : 'Müstahsil / Alış'),
      direction: t.kind === 'sale' ? 'RECEIVABLE' : 'PAYABLE',
      id: t.id,
      docNo: t.docNo,
      partyId: t.partyId,
      date: t.date,
      dueDate: dueStr,
      overdueDays,
      totalMinor: tradeExpectedSettleMinor(t),
      openMinor: open.toString()
    });
  }

  return {
    notDueMinor: buckets.notDueMinor.toString(),
    d0_30Minor: buckets.d0_30Minor.toString(),
    d31_60Minor: buckets.d31_60Minor.toString(),
    d61_90Minor: buckets.d61_90Minor.toString(),
    d90PlusMinor: buckets.d90PlusMinor.toString(),
    totalOpenMinor: buckets.totalOpenMinor.toString(),
    items: buckets.items.sort((a, b) => a.dueDate.localeCompare(b.dueDate))
  };
}

function computePortfolioValor(st, referenceDateStr, filterKind = 'ALINAN') {
  const ref = strictIsoDate(referenceDateStr, 'Referans tarihi');
  const refMs = Date.parse(ref + 'T00:00:00Z');
  const DAY_MS = 86400000;

  const openStatuses = filterKind === 'ALINAN' ? ['Portföyde', 'Bankada Tahsilde'] : ['Verildi'];
  const list = st.instruments.filter((ins) => {
    const isRecv = ins.kind === 'Alınan Çek' || ins.kind === 'Alınan Senet';
    if (filterKind === 'ALINAN' && !isRecv) return false;
    if (filterKind === 'VERILEN' && isRecv) return false;
    return openStatuses.includes(ins.status);
  });

  if (list.length === 0) {
    return { count: 0, totalMinor: '0', weightedDays: 0, averageDueDate: '' };
  }

  let total = 0n;
  let weightedSum = 0n;
  for (const ins of list) {
    const amt = BigInt(ins.amountMinor);
    const dueMs = Date.parse(ins.dueDate + 'T00:00:00Z');
    const diffDays = BigInt(Math.round((dueMs - refMs) / DAY_MS));
    total += amt;
    weightedSum += amt * diffDays;
  }

  const roundedDays = Number(divRoundHalfAway(weightedSum, total));
  const avgDate = new Date(refMs + roundedDays * DAY_MS).toISOString().slice(0, 10);
  return {
    count: list.length,
    totalMinor: total.toString(),
    weightedDays: roundedDays,
    averageDueDate: avgDate
  };
}

function computeExecutiveSummary(st) {
  let buyNetMinor = 0n;
  let buyQtyGrams = 0n;
  let deductionTotalMinor = 0n;
  let bagkurTotalMinor = 0n;
  let purchaseVatMinor = 0n;
  let sellNetMinor = 0n;
  let sellQtyGrams = 0n;
  let sellVatMinor = 0n;
  let sellWithheldVatMinor = 0n;
  let cogsMinor = 0n;
  let otherInMinor = 0n;
  let otherOutMinor = 0n;

  for (const t of st.trades) {
    if (t.status !== 'posted') continue;
    if (t.kind === 'purchase') {
      buyNetMinor += BigInt(t.stockCostMinor);
      buyQtyGrams += BigInt(t.qtyGrams);
      deductionTotalMinor += BigInt(t.deductionMinor || '0');
      bagkurTotalMinor += BigInt(t.bagkurMinor || '0');
      purchaseVatMinor += BigInt(t.payableVatMinor || t.vatMinor || '0');
    } else if (t.kind === 'sale') {
      sellNetMinor += BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
      sellQtyGrams += BigInt(t.qtyGrams);
      sellVatMinor += BigInt(t.payableVatMinor ?? t.vatMinor ?? '0');
      sellWithheldVatMinor += BigInt(t.withheldVatMinor || '0');
      cogsMinor += BigInt(t.cogsMinor);
    }
  }

  for (const c of st.cashMovements) {
    if (c.status === 'void' || c.isReversal) continue;
    if (c.kind === 'Gelir') otherInMinor += BigInt(c.amountMinor);
    if (c.kind === 'Gider') otherOutMinor += BigInt(c.amountMinor);
  }

  const stock = warehouseProductStock(st, null, null);
  const stockValueMinor = BigInt(stock.costMinor);
  const inventoryDriftMinor = buyNetMinor - cogsMinor - stockValueMinor;

  let receivableMinor = 0n;
  let payableMinor = 0n;
  for (const p of st.parties) {
    const b = BigInt(partyBalanceMinor(st, p.id));
    if (b > 0n) receivableMinor += b;
    else if (b < 0n) payableMinor += -b;
  }

  let cashTotalMinor = 0n;
  for (const a of st.accounts) {
    cashTotalMinor += BigInt(accountBalanceMinor(st, a.id));
  }

  const grossProfitMinor = sellNetMinor - cogsMinor;
  const operatingResultMinor = grossProfitMinor + otherInMinor - otherOutMinor;

  return {
    buyNetMinor: buyNetMinor.toString(),
    buyQtyGrams: buyQtyGrams.toString(),
    deductionTotalMinor: deductionTotalMinor.toString(),
    bagkurTotalMinor: bagkurTotalMinor.toString(),
    purchaseVatMinor: purchaseVatMinor.toString(),
    sellNetMinor: sellNetMinor.toString(),
    sellQtyGrams: sellQtyGrams.toString(),
    sellVatMinor: sellVatMinor.toString(),
    sellWithheldVatMinor: sellWithheldVatMinor.toString(),
    cogsMinor: cogsMinor.toString(),
    stockQtyGrams: stock.qtyGrams,
    stockValueMinor: stockValueMinor.toString(),
    inventoryDriftMinor: inventoryDriftMinor.toString(),
    receivableMinor: receivableMinor.toString(),
    payableMinor: payableMinor.toString(),
    cashTotalMinor: cashTotalMinor.toString(),
    otherInMinor: otherInMinor.toString(),
    otherOutMinor: otherOutMinor.toString(),
    grossProfitMinor: grossProfitMinor.toString(),
    operatingResultMinor: operatingResultMinor.toString()
  };
}

function validateEnvelope(cmd) {
  assert(cmd && typeof cmd === 'object' && !Array.isArray(cmd), 'KOMUT_ZARFI', 'Komut nesnesi geçersiz.');
  assert(validId(cmd.id), 'KOMUT_ID', 'İşlem kimliği geçersiz.');
  assert(Number.isSafeInteger(cmd.expectedRevision) && cmd.expectedRevision >= 0, 'REVIZYON', 'Beklenen veri sürümü geçersiz.');
  assert(typeof cmd.type === 'string' && cmd.type.length > 0, 'KOMUT_TURU', 'İşlem türü eksik.');
  assert(typeof cmd.at === 'string' && !Number.isNaN(Date.parse(cmd.at)), 'ZAMAN_DAMGASI', 'İşlem zamanı geçersiz.');
  assert(cmd.data && typeof cmd.data === 'object' && !Array.isArray(cmd.data), 'KOMUT_VERISI', 'İşlem verisi eksik.');
}

function resolveOrCreateInlineParty(next, d, cmd, defaultRole) {
  if (d.inlinePartyName && String(d.inlinePartyName).trim() !== '') {
    const cleanName = cleanText(String(d.inlinePartyName), 'Yeni cari unvanı', 2, 120);
    const existingByName = next.parties.find((p) => p.name.toLocaleLowerCase('tr-TR') === cleanName.toLocaleLowerCase('tr-TR'));
    if (existingByName) return existingByName;
    const newId = `pty_in_${cmd.id}`;
    const code = `CR-${String(next.parties.length + 1).padStart(4, '0')}`;
    const created = {
      id: newId,
      code,
      name: cleanName,
      role: d.inlinePartyRole || defaultRole,
      phone: optionalText(d.inlinePartyPhone, 30),
      taxNo: optionalText(d.inlinePartyTaxNo, 20),
      tckn: optionalText(d.inlinePartyTckn, 11),
      iban: '',
      city: 'İzmir',
      note: 'Alış/satış ekranından hızlı açıldı',
      active: true,
      createdAt: cmd.at
    };
    next.parties.push(created);
    return created;
  }
  return byId(next.parties, d.partyId, 'Cari kart');
}

function applyAllocationsInternal(next, { cmdId, at, partyId, sourceKind, sourceId, targetTradeKind, maxAmountMinor, explicitTradeId }) {
  let remaining = BigInt(maxAmountMinor);
  if (remaining <= 0n) return;

  const candidates = explicitTradeId
    ? [byId(next.trades, explicitTradeId, 'Mahsup edilecek belge')]
    : next.trades
        .filter((t) => t.status === 'posted' && t.partyId === partyId && t.kind === targetTradeKind)
        .sort((a, b) => (a.dueDate || a.date).localeCompare(b.dueDate || b.date) || a.createdSeq - b.createdSeq);

  let idx = 0;
  for (const tr of candidates) {
    if (remaining <= 0n) break;
    assert(tr.status === 'posted', 'MAHSUP_DURUM', 'İptal edilmiş belgeye mahsup yapılamaz.');
    assert(tr.partyId === partyId, 'MAHSUP_CARI', 'Mahsup edilecek belgenin carisi uyuşmuyor.');
    assert(tr.kind === targetTradeKind, 'MAHSUP_YON', 'Mahsup belge yönü uyuşmuyor.');
    const open = BigInt(tradeOpenMinor(next, tr));
    if (explicitTradeId) {
      assert(open > 0n, 'BELGE_KAPALI', 'Seçilen belgenin açık bakiyesi kalmamış.');
      assert(remaining <= open, 'FAZLA_MAHSUP', `Belgeye yapılacak mahsup kalan açık tutarı (${formatMoneyMinor(open.toString())}) aşamaz.`);
    }
    if (open <= 0n) continue;
    const take = remaining <= open ? remaining : open;
    idx += 1;
    next.allocations.push({
      id: `alc_${cmdId}_${idx}`,
      partyId,
      tradeId: tr.id,
      sourceKind,
      sourceId,
      amountMinor: take.toString(),
      status: 'active',
      at
    });
    remaining -= take;
  }
}

function execute(st, cmd) {
  validateEnvelope(cmd);
  const existing = st.commands.find((c) => c.id === cmd.id);
  if (existing) {
    assert(
      existing.type === cmd.type && existing.signature === JSON.stringify(cmd.data),
      'IDEMPOTENCY_CAKISMA',
      'Aynı işlem kimliği farklı içerikle yeniden gönderildi.'
    );
    return { state: st, duplicate: true };
  }
  assert(st.schemaVersion === SCHEMA_VERSION, 'SEMA_UYUMSUZ', 'Veritabanı şema sürümü uyuşmuyor.');
  assert(
    st.revision === cmd.expectedRevision,
    'CONFLICT',
    'Veri başka bir sekmede güncellendi. Kayıt ezilmedi; ekran yenilendi, lütfen kontrol edip tekrar deneyin.'
  );

  const next = structuredClone(st);
  const d = cmd.data;
  const seq = next.revision + 1;
  let summary = cmd.type;

  if (cmd.type === 'company.update') {
    next.company = cleanText(d.company, 'İşletme unvanı', 2, 120);
    next.companyMeta = {
      taxOffice: optionalText(d.taxOffice, 80),
      taxNo: optionalText(d.taxNo, 20),
      city: optionalText(d.city, 60) || 'İzmir',
      phone: optionalText(d.phone, 30)
    };
    summary = `İşletme bilgileri güncellendi: ${next.company}`;
  } else if (cmd.type === 'product.create') {
    const id = validId(d.id) ? d.id : `prd_${cmd.id}`;
    assert(!next.products.some((x) => x.id === id), 'MUKERRER_ID', 'Ürün kimliği zaten mevcut.');
    const sku = cleanText(d.sku, 'Stok kodu', 2, 24).toLocaleUpperCase('tr-TR');
    const name = cleanText(d.name, 'Ürün adı', 2, 80);
    assert(
      !next.products.some((x) => x.sku.toLocaleUpperCase('tr-TR') === sku || x.name.toLocaleLowerCase('tr-TR') === name.toLocaleLowerCase('tr-TR')),
      'MUKERRER_URUN',
      'Bu stok kodu veya ürün adı zaten tanımlı.'
    );
    const defaultVatBps = parseRateBps(d.defaultVatBps ?? '1', 'Varsayılan KDV (%)');
    next.products.push({ id, sku, name, unit: 'kg', defaultVatBps, active: true });
    summary = `Yeni ürün kartı açıldı: ${sku} · ${name}`;
    } else if (cmd.type === 'product.subCreate') {
    const prd = byId(next.products, d.productId, 'Ürün');
    prd.subProducts = prd.subProducts || [];
    const subName = cleanText(d.name, 'Alt kırılım adı', 2, 80);
    assert(!prd.subProducts.some((s) => s.name.toLocaleLowerCase('tr-TR') === subName.toLocaleLowerCase('tr-TR')), 'MUKERRER_ALT_KIRILIM', 'Bu alt kırılım adı zaten mevcut.');
    const subId = validId(d.id) ? d.id : `sub_${cmd.id}`;
    const code = d.code ? cleanText(d.code, 'Kod', 1, 20) : `${prd.sku}-${prd.subProducts.length + 1}`;
    const buyPriceTl = d.buyPriceTl ? cleanText(d.buyPriceTl, 'Alış Fiyatı', 1, 20) : '0,00';
    const sellPriceTl = d.sellPriceTl ? cleanText(d.sellPriceTl, 'Satış Fiyatı', 1, 20) : '0,00';
    prd.subProducts.push({ id: subId, code, name: subName, buyPriceTl, sellPriceTl, active: true });
    summary = `${prd.name} için yeni alt kırılım eklendi: ${subName}`;
  } else if (cmd.type === 'product.subUpdate') {
    const prd = byId(next.products, d.productId, 'Ürün');
    prd.subProducts = prd.subProducts || [];
    const sub = prd.subProducts.find((s) => s.id === d.subId);
    assert(!!sub, 'KAYIT_YOK', 'Alt kırılım bulunamadı.');
    if (d.name) {
      const subName = cleanText(d.name, 'Alt kırılım adı', 2, 80);
      assert(!prd.subProducts.some((s) => s.id !== sub.id && s.name.toLocaleLowerCase('tr-TR') === subName.toLocaleLowerCase('tr-TR')), 'MUKERRER_ALT_KIRILIM', 'Bu unvan başka bir alt kırılımda kayıtlı.');
      sub.name = subName;
    }
    if (d.code) sub.code = cleanText(d.code, 'Kod', 1, 20);
    if (d.buyPriceTl !== undefined) sub.buyPriceTl = cleanText(d.buyPriceTl, 'Alış Fiyatı', 1, 20);
    if (d.sellPriceTl !== undefined) sub.sellPriceTl = cleanText(d.sellPriceTl, 'Satış Fiyatı', 1, 20);
    if (d.active !== undefined) sub.active = !!d.active;
    summary = `${prd.name} alt kırılımı güncellendi: ${sub.name}`;
  } else if (cmd.type === 'warehouse.create') {
    const id = validId(d.id) ? d.id : `wh_${cmd.id}`;
    const code = cleanText(d.code, 'Depo kodu', 2, 20).toLocaleUpperCase('tr-TR');
    const name = cleanText(d.name, 'Depo adı', 2, 80);
    assert(
      !next.warehouses.some((w) => w.code.toLocaleUpperCase('tr-TR') === code || w.name.toLocaleLowerCase('tr-TR') === name.toLocaleLowerCase('tr-TR')),
      'MUKERRER_DEPO',
      'Bu depo kodu veya adı zaten kayıtlı.'
    );
    const capacityGrams = d.capacityKg && String(d.capacityKg).trim() ? parseQtyGrams(String(d.capacityKg), 'Depo kapasitesi (kg)', true) : '0';
    next.warehouses.push({ id, code, name, capacityGrams, active: true });
    summary = `Yeni depo tanımlandı: ${code} · ${name}`;
  } else if (cmd.type === 'account.create') {
    const id = validId(d.id) ? d.id : `acc_${cmd.id}`;
    const code = cleanText(d.code, 'Hesap kodu', 2, 20).toLocaleUpperCase('tr-TR');
    const name = cleanText(d.name, 'Hesap adı', 2, 80);
    assert(['Kasa', 'Banka'].includes(d.kind), 'HESAP_TURU', 'Hesap türü Kasa veya Banka olmalıdır.');
    assert(
      !next.accounts.some((a) => a.code.toLocaleUpperCase('tr-TR') === code || a.name.toLocaleLowerCase('tr-TR') === name.toLocaleLowerCase('tr-TR')),
      'MUKERRER_HESAP',
      'Bu kasa/banka kodu veya adı zaten tanımlı.'
    );
    next.accounts.push({ id, code, name, kind: d.kind, iban: optionalText(d.iban, 42), active: true });
    summary = `Yeni ${d.kind} hesabı açıldı: ${name}`;
  } else if (cmd.type === 'party.create') {
    const id = validId(d.id) ? d.id : `pty_${cmd.id}`;
    assert(!next.parties.some((p) => p.id === id), 'MUKERRER_ID', 'Cari kimliği mevcut.');
    const name = cleanText(d.name, 'Cari unvanı', 2, 120);
    assert(
      !next.parties.some((p) => p.name.toLocaleLowerCase('tr-TR') === name.toLocaleLowerCase('tr-TR')),
      'MUKERRER_CARI',
      'Aynı unvana sahip bir cari kart zaten kayıtlı.'
    );
    const validRoles = ['Müşteri', 'Müstahsil', 'Tedarikçi', 'Müşteri / Tedarikçi'];
    const role = validRoles.includes(d.role) ? d.role : 'Müşteri / Tedarikçi';
    const taxNo = optionalText(d.taxNo, 20);
    const tckn = optionalText(d.tckn, 11);
    if (tckn) assert(/^\d{11}$/.test(tckn), 'TCKN_FORMAT', 'T.C. Kimlik Numarası 11 rakamdan oluşmalıdır.');
    const code = d.code && String(d.code).trim()
      ? cleanText(String(d.code), 'Cari kodu', 2, 24).toLocaleUpperCase('tr-TR')
      : `CR-${String(next.parties.length + 1).padStart(4, '0')}`;
    assert(!next.parties.some((p) => p.code === code), 'MUKERRER_CARI_KOD', 'Cari kodu zaten kullanılıyor.');

    const openingDir = ['BORC', 'ALACAK', 'YOK'].includes(d.openingDir) ? d.openingDir : 'YOK';
    const openingMinor = openingDir === 'YOK' ? '0' : parseOptionalMoneyMinor(d.openingAmount, 'Açılış bakiyesi');
    const openingDate = openingMinor !== '0' ? strictIsoDate(d.openingDate || cmd.at.slice(0, 10), 'Açılış tarihi') : '';

    next.parties.push({
      id,
      code,
      name,
      role,
      phone: optionalText(d.phone, 30),
      taxNo,
      tckn,
      iban: optionalText(d.iban, 42),
      bankName: optionalText(d.bankName, 80),
      bankBranch: optionalText(d.bankBranch, 80),
      accountNo: optionalText(d.accountNo, 40),
      taxOffice: optionalText(d.taxOffice, 60),
      cksNo: optionalText(d.cksNo, 40),
      authorizedPerson: optionalText(d.authorizedPerson, 80),
      email: optionalText(d.email, 80),
      address: optionalText(d.address, 200),
      paymentTermDays: optionalText(d.paymentTermDays, 10),
      creditLimitTl: optionalText(d.creditLimitTl, 20),
      city: optionalText(d.city, 60),
      note: optionalText(d.note, 200),
      active: true,
      operatorId: optionalText(d.operatorId, 40) || 'usr_merkez',
      operatorName: optionalText(d.operatorName, 80) || 'Merkez (Yönetici)',
      createdAt: cmd.at
    });

    if (BigInt(openingMinor) > 0n) {
      next.partyLedger.push({
        id: `pl_open_${cmd.id}`,
        partyId: id,
        date: openingDate,
        direction: openingDir === 'BORC' ? 'DEBIT' : 'CREDIT',
        amountMinor: openingMinor,
        sourceKind: 'opening',
        sourceId: id,
        desc: `Açılış bakiyesi (${openingDir === 'BORC' ? 'Alacak' : 'Borç'})`,
        at: cmd.at
      });
    }
    summary = `Cari kart oluşturuldu: ${code} · ${name}`;
  } else if (cmd.type === 'party.update') {
    const p = byId(next.parties, d.partyId, 'Cari kart');
    const name = cleanText(d.name, 'Cari unvanı', 2, 120);
    assert(
      !next.parties.some((x) => x.id !== p.id && x.name.toLocaleLowerCase('tr-TR') === name.toLocaleLowerCase('tr-TR')),
      'MUKERRER_CARI',
      'Bu unvan başka bir cari kartta kullanılıyor.'
    );
    const tckn = optionalText(d.tckn, 11);
    if (tckn) assert(/^\d{11}$/.test(tckn), 'TCKN_FORMAT', 'T.C. Kimlik Numarası 11 rakamdan oluşmalıdır.');
    p.name = name;
    if (['Müşteri', 'Müstahsil', 'Tedarikçi', 'Müşteri / Tedarikçi'].includes(d.role)) p.role = d.role;
    p.phone = optionalText(d.phone, 30);
    p.taxNo = optionalText(d.taxNo, 20);
    p.tckn = tckn;
    p.iban = optionalText(d.iban, 42);
    if (d.bankName !== undefined) p.bankName = optionalText(d.bankName, 80);
    if (d.bankBranch !== undefined) p.bankBranch = optionalText(d.bankBranch, 80);
    if (d.accountNo !== undefined) p.accountNo = optionalText(d.accountNo, 40);
    if (d.taxOffice !== undefined) p.taxOffice = optionalText(d.taxOffice, 60);
    if (d.cksNo !== undefined) p.cksNo = optionalText(d.cksNo, 40);
    if (d.authorizedPerson !== undefined) p.authorizedPerson = optionalText(d.authorizedPerson, 80);
    if (d.email !== undefined) p.email = optionalText(d.email, 80);
    if (d.address !== undefined) p.address = optionalText(d.address, 200);
    if (d.paymentTermDays !== undefined) p.paymentTermDays = optionalText(d.paymentTermDays, 10);
    if (d.creditLimitTl !== undefined) p.creditLimitTl = optionalText(d.creditLimitTl, 20);
    p.city = optionalText(d.city, 60);
    p.note = optionalText(d.note, 200);
    summary = `Cari kart bilgileri güncellendi: ${p.code} · ${p.name}`;
  } else if (cmd.type === 'weigh.create') {
    const id = validId(d.id) ? d.id : `wgh_${cmd.id}`;
    const date = strictIsoDate(d.date, 'Tartım tarihi');
    const ticketNo = cleanText(d.ticketNo, 'Kantar fiş no', 1, 32).toLocaleUpperCase('tr-TR');
    assert(
      !next.weighs.some((w) => w.status !== 'void' && w.ticketNo.toLocaleUpperCase('tr-TR') === ticketNo),
      'MUKERRER_KANTAR',
      `Bu kantar fiş numarası (${ticketNo}) zaten aktif olarak kayıtlı.`
    );
    const plate = cleanText(d.plate, 'Araç plakası', 2, 24).toLocaleUpperCase('tr-TR');
    const prd = byId(next.products, d.productId, 'Ürün');
    const wh = byId(next.warehouses, d.warehouseId, 'Depo');
    const partyId = d.partyId ? byId(next.parties, d.partyId, 'Cari').id : '';
    const grossGrams = parseQtyGrams(String(d.grossKg), 'Brüt ağırlık (kg)');
    const tareGrams = parseQtyGrams(String(d.tareKg), 'Dara ağırlık (kg)', true);
    const net = BigInt(grossGrams) - BigInt(tareGrams);
    assert(net > 0n, 'NET_AGIRLIK', 'Brüt ağırlık daradan büyük olmalı; net ağırlık sıfır veya negatif olamaz.');
    const moistureBps = parseRateBps(d.moisturePct ?? '0', 'Rutubet (%)', 5000n);
    const foreignBps = parseRateBps(d.foreignPct ?? '0', 'Yabancı madde (%)', 5000n);

    const subPrdId = d.subProductId || '';
    const subPrd = subPrdId && prd.subProducts ? prd.subProducts.find((s) => s.id === subPrdId) : null;
    const subPrdNameSnapshot = subPrd ? subPrd.name : (d.subProductNameSnapshot || '');
    const operatorId = optionalText(d.operatorId, 40) || 'usr_merkez';
    const operatorName = optionalText(d.operatorName, 80) || (SYSTEM_USERS.find((u) => u.id === operatorId)?.name || 'Merkez (Yönetici)');

    next.weighs.push({
      id,
      date,
      ticketNo,
      plate,
      driverName: optionalText(d.driverName, 80),
      partyId,
      productId: prd.id,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      grossGrams,
      tareGrams,
      netGrams: net.toString(),
      moistureBps,
      foreignBps,
      note: optionalText(d.note, 200),
      status: 'open',
      linkedTradeId: '',
      operatorId,
      operatorName,
      at: cmd.at
    });
    summary = `Kantar fişi kesildi: #${ticketNo} (${plate} · ${formatQtyGrams(net.toString(), true)} ${prd.name})`;
  } else if (cmd.type === 'weigh.void') {
    const w = byId(next.weighs, d.weighId, 'Kantar fişi');
    assert(w.status === 'open', 'KANTAR_DURUM', w.status === 'linked' ? 'Ticari belgeye bağlanmış kantar fişi iptal edilemez; önce bağlı alış/satış belgesini iptal edin.' : 'Kantar fişi zaten iptal edilmiş.');
    w.status = 'void';
    w.voidedAt = cmd.at;
    w.voidReason = optionalText(d.reason, 160) || 'Kullanıcı iptali';
    summary = `Kantar fişi ters kayıtla iptal edildi: #${w.ticketNo}`;
  } else if (cmd.type === 'trade.purchase') {
    const id = validId(d.id) ? d.id : `trd_${cmd.id}`;
    const date = strictIsoDate(d.date, 'Alış tarihi');
    const dueDate = optionalIsoDate(d.dueDate, 'Vade tarihi') || date;
    assert(dueDate >= date, 'VADE_TARIHI', 'Vade tarihi işlem tarihinden önce olamaz.');

    const pty = resolveOrCreateInlineParty(next, d, cmd, 'Müstahsil');
    assert(pty.active, 'PASIF_CARI', 'Pasif cari karta işlem yapılamaz.');
    const prd = byId(next.products, d.productId, 'Ürün');
    const wh = byId(next.warehouses, d.warehouseId, 'Depo');

    let weigh = null;
    if (d.weighId) {
      weigh = byId(next.weighs, d.weighId, 'Kantar fişi');
      assert(weigh.status === 'open', 'KANTAR_KULLANILMIS', 'Seçilen kantar fişi zaten kullanılmış veya iptal edilmiş.');
      assert(weigh.productId === prd.id, 'KANTAR_URUN_FARKLI', 'Kantar fişindeki ürün ile seçilen ürün uyuşmuyor.');
    }

    const docSubType = d.docSubType === 'Ticari Alış Faturası' ? 'Ticari Alış Faturası' : 'Müstahsil Makbuzu';
    const rawQtyGrams = parseQtyGrams(String(d.qtyKg), 'Tartım / Brüt Mal Miktarı (kg)');
    const fireGrams = parseOptionalQtyGrams(d.fireKg, 'Fire Düşümü (kg)');
    assert(BigInt(fireGrams) < BigInt(rawQtyGrams), 'FIRE_ASIMI', 'Fire miktarı toplam mal miktarından küçük olmalıdır.');
    const qtyGrams = (BigInt(rawQtyGrams) - BigInt(fireGrams)).toString();

    if (wh.capacityGrams !== '0') {
      const curWhQty = BigInt(warehouseProductStock(next, wh.id, null).qtyGrams);
      assert(curWhQty + BigInt(qtyGrams) <= BigInt(wh.capacityGrams), 'DEPO_KAPASITE', `${wh.name} kapasitesi aşılıyor.`);
    }

    const unitPriceMicro = parseUnitPriceMicro(String(d.unitPrice), 'Alış birim fiyatı');
    const discountBps = parseRateBps(d.discountPct ?? '0', 'İskonto (%)');
    const moistureBps = parseRateBps(d.moisturePct ?? '0', 'Rutubet (%)', 5000n);
    const foreignBps = parseRateBps(d.foreignPct ?? '0', 'Yabancı madde (%)', 5000n);

    const grossMinor = calcLineGrossMinor(qtyGrams, unitPriceMicro);
    assert(BigInt(grossMinor) > 0n, 'SIFIR_TUTAR', 'Alış brüt tutarı sıfır olamaz.');
    const discountMinor = calcBpsAmountMinor(grossMinor, discountBps);
    const netGoodsMinor = (BigInt(grossMinor) - BigInt(discountMinor)).toString();
    assert(BigInt(netGoodsMinor) > 0n, 'SIFIR_NET', 'İskonto sonrası tutar sıfırdan büyük olmalıdır.');

    let deductionBps = '0';
    let deductionMinor = '0';
    let bagkurBps = '0';
    let bagkurMinor = '0';
    let vatBps = '0';
    let vatMinor = '0';
    let withholdingCode = 'YOK';
    let withheldVatMinor = '0';
    let payableVatMinor = '0';
    let netPayableMinor = netGoodsMinor;

    if (docSubType === 'Müstahsil Makbuzu') {
      deductionBps = parseRateBps(d.deductionPct ?? '2', 'Müstahsil stopaj kesintisi (%)', 5000n);
      bagkurBps = parseRateBps(d.bagkurPct ?? '0', 'Borsa / Bağ-Kur kesintisi (%)', 5000n);
      deductionMinor = calcBpsAmountMinor(netGoodsMinor, deductionBps);
      bagkurMinor = calcBpsAmountMinor(netGoodsMinor, bagkurBps);
      netPayableMinor = (BigInt(netGoodsMinor) - BigInt(deductionMinor) - BigInt(bagkurMinor)).toString();
      assert(BigInt(netPayableMinor) > 0n, 'KESINTI_ASIMI', 'Kesintiler toplam mal bedelini aşamaz.');
    } else {
      vatBps = parseRateBps(d.vatPct ?? '1', 'Alış KDV (%)');
      withholdingCode = WITHHOLDING_RATES[d.withholdingCode] ? d.withholdingCode : 'YOK';
      vatMinor = calcBpsAmountMinor(netGoodsMinor, vatBps);
      withheldVatMinor = calcWithheldVatMinor(vatMinor, withholdingCode);
      payableVatMinor = (BigInt(vatMinor) - BigInt(withheldVatMinor)).toString();
      netPayableMinor = (BigInt(netGoodsMinor) + BigInt(payableVatMinor)).toString();
    }

    const directExpenseMinor = parseOptionalMoneyMinor(d.directExpense, 'Nakliye / Hammaliye ek maliyeti');
    const stockCostMinor = (BigInt(netGoodsMinor) + BigInt(directExpenseMinor)).toString();

    const docNo = d.docNo && String(d.docNo).trim()
      ? cleanText(String(d.docNo), 'Belge no', 2, 32).toLocaleUpperCase('tr-TR')
      : `AL-${String(next.trades.filter((x) => x.kind === 'purchase').length + 1).padStart(5, '0')}`;
    assert(!next.trades.some((x) => x.docNo === docNo), 'MUKERRER_BELGE', `Belge numarası (${docNo}) zaten mevcut.`);

    const plate = optionalText(d.plate || weigh?.plate || '', 24).toLocaleUpperCase('tr-TR');
    const driverName = optionalText(d.driverName || weigh?.driverName || '', 80);
    const waybillNo = optionalText(d.waybillNo || '', 40);

    const subPrdId = d.subProductId || '';
    const subPrd = subPrdId && prd.subProducts ? prd.subProducts.find((s) => s.id === subPrdId) : null;
    const subPrdNameSnapshot = subPrd ? subPrd.name : (d.subProductNameSnapshot || '');
    const operatorId = optionalText(d.operatorId, 40) || 'usr_merkez';
    const operatorName = optionalText(d.operatorName, 80) || (SYSTEM_USERS.find((u) => u.id === operatorId)?.name || 'Merkez (Yönetici)');

    const lotId = `lot_${cmd.id}`;
    next.lots.push({
      id: lotId,
      tradeId: id,
      productId: prd.id,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      date,
      createdSeq: seq,
      initialGrams: qtyGrams,
      remainingGrams: qtyGrams,
      initialCostMinor: stockCostMinor,
      remainingCostMinor: stockCostMinor,
      status: 'active'
    });

    next.trades.push({
      id,
      createdSeq: seq,
      kind: 'purchase',
      docSubType,
      status: 'posted',
      docNo,
      waybillNo,
      plate,
      driverName,
      date,
      dueDate,
      partyId: pty.id,
      partyNameSnapshot: pty.name,
      productId: prd.id,
      productNameSnapshot: prd.name,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      warehouseNameSnapshot: wh.name,
      weighId: weigh ? weigh.id : '',
      rawQtyGrams,
      fireGrams,
      qtyGrams,
      moistureBps,
      foreignBps,
      unitPriceMicro,
      grossMinor,
      discountBps,
      discountMinor,
      netMinor: netGoodsMinor,
      deductionBps,
      deductionMinor,
      bagkurBps,
      bagkurMinor,
      directExpenseMinor,
      freightChargeMinor: '0',
      stockCostMinor,
      netPayableMinor,
      vatBps,
      vatMinor,
      withholdingCode,
      withheldVatMinor,
      payableVatMinor,
      totalWithVatMinor: netPayableMinor,
      cogsMinor: '0',
      lotId,
      lotConsumptions: [],
      operatorId,
      operatorName,
      note: optionalText(d.note, 220),
      at: cmd.at
    });

    next.stockMovements.push({
      id: `sm_${cmd.id}`,
      date,
      productId: prd.id,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      qtyGrams,
      costMinor: stockCostMinor,
      kind: 'purchase',
      sourceId: id,
      operatorId,
      operatorName,
      at: cmd.at
    });

    next.partyLedger.push({
      id: `pl_${cmd.id}`,
      partyId: pty.id,
      date,
      direction: 'CREDIT',
      amountMinor: netPayableMinor,
      sourceKind: 'trade',
      sourceId: id,
      desc: `${docNo} · ${docSubType} (${prd.name} ${formatQtyGrams(qtyGrams, true)})`,
      at: cmd.at
    });

    if (BigInt(directExpenseMinor) > 0n) {
      assert(!!d.expenseAccountId, 'MASRAF_HESABI_GEREKLI', 'Nakliye/hammaliye ek masrafı için ödeme kasa/banka hesabı seçilmelidir.');
      const acc = byId(next.accounts, d.expenseAccountId, 'Masraf ödeme hesabı');
      if (acc.kind === 'Kasa') {
        assert(BigInt(accountBalanceMinor(next, acc.id)) >= BigInt(directExpenseMinor), 'KASA_YETERSIZ', `${acc.name} bakiyesi nakliye masrafı için yetersiz.`);
      }
      next.cashMovements.push({
        id: `cm_exp_${cmd.id}`,
        date,
        kind: 'Stok Alış Gideri',
        accountId: acc.id,
        partyId: '',
        category: 'Alış Nakliye/Hammaliye',
        amountMinor: directExpenseMinor,
        signedMinor: (-BigInt(directExpenseMinor)).toString(),
        sourceKind: 'trade-expense',
        sourceId: id,
        status: 'posted',
        isReversal: false,
        note: `${docNo} alış ek maliyeti`,
        at: cmd.at
      });
    }

    // Tek adımda anında peşin / kısmi ödeme desteği!
    const instantPaidMinor = parseOptionalMoneyMinor(d.instantPaidAmount, 'Peşin ödenen tutar');
    if (BigInt(instantPaidMinor) > 0n) {
      assert(BigInt(instantPaidMinor) <= BigInt(netPayableMinor), 'PESIN_ASIMI', 'Peşin ödenen tutar net ödenecek belge toplamını aşamaz.');
      const payAcc = byId(next.accounts, d.instantAccountId || next.accounts[0]?.id, 'Ödeme hesabı');
      if (payAcc.kind === 'Kasa') {
        assert(BigInt(accountBalanceMinor(next, payAcc.id)) >= BigInt(instantPaidMinor), 'KASA_NEGATIF_ENGEL', `${payAcc.name} nakit bakiyesi peşin ödeme için yetersiz.`);
      }
      const cashId = `csh_inst_${cmd.id}`;
      next.cashMovements.push({
        id: cashId,
        date,
        kind: 'Ödeme',
        accountId: payAcc.id,
        partyId: pty.id,
        category: '',
        amountMinor: instantPaidMinor,
        signedMinor: (-BigInt(instantPaidMinor)).toString(),
        sourceKind: 'cash',
        sourceId: cashId,
        status: 'posted',
        isReversal: false,
        note: `${docNo} peşin/kısmi alış ödemesi`,
        at: cmd.at
      });
      next.partyLedger.push({
        id: `pl_inst_${cmd.id}`,
        partyId: pty.id,
        date,
        direction: 'DEBIT',
        amountMinor: instantPaidMinor,
        sourceKind: 'cash',
        sourceId: cashId,
        desc: `Ödeme · ${payAcc.name} (${docNo} peşinatı)`,
        at: cmd.at
      });
      applyAllocationsInternal(next, {
        cmdId: `${cmd.id}_inst`,
        at: cmd.at,
        partyId: pty.id,
        sourceKind: 'cash',
        sourceId: cashId,
        targetTradeKind: 'purchase',
        maxAmountMinor: instantPaidMinor,
        explicitTradeId: id
      });
    }

    if (weigh) {
      weigh.status = 'linked';
      weigh.linkedTradeId = id;
    }
    summary = `Mal Alışı kesinleşti: ${docNo} (${docSubType}) · ${pty.name} · ${formatQtyGrams(qtyGrams, true)} ${prd.name}`;
  } else if (cmd.type === 'trade.sale') {
    const id = validId(d.id) ? d.id : `trd_${cmd.id}`;
    const date = strictIsoDate(d.date, 'Satış tarihi');
    const dueDate = optionalIsoDate(d.dueDate, 'Vade tarihi') || date;
    assert(dueDate >= date, 'VADE_TARIHI', 'Vade tarihi satış tarihinden önce olamaz.');

    const pty = resolveOrCreateInlineParty(next, d, cmd, 'Müşteri');
    assert(pty.active, 'PASIF_CARI', 'Pasif cari karta satış yapılamaz.');
    const prd = byId(next.products, d.productId, 'Ürün');
    const wh = byId(next.warehouses, d.warehouseId, 'Çıkış deposu');

    let weigh = null;
    if (d.weighId) {
      weigh = byId(next.weighs, d.weighId, 'Kantar fişi');
      assert(weigh.status === 'open', 'KANTAR_KULLANILMIS', 'Seçilen kantar fişi zaten kullanılmış veya iptal edilmiş.');
      assert(weigh.productId === prd.id, 'KANTAR_URUN_FARKLI', 'Kantar fişindeki ürün ile satış ürünü uyuşmuyor.');
    }

    const validSaleSubTypes = ['Ticari Satış Faturası', 'Tevkifatlı Satış Faturası', 'Müstahsile Girdi Satışı'];
    const docSubType = validSaleSubTypes.includes(d.docSubType) ? d.docSubType : 'Ticari Satış Faturası';

    const rawQtyGrams = parseQtyGrams(String(d.qtyKg), 'Satış miktarı (kg)');
    const fireGrams = parseOptionalQtyGrams(d.fireKg, 'Sevk fire düşümü (kg)');
    assert(BigInt(fireGrams) < BigInt(rawQtyGrams), 'FIRE_ASIMI', 'Fire miktarı satış miktarından küçük olmalıdır.');
    const qtyGrams = (BigInt(rawQtyGrams) - BigInt(fireGrams)).toString();

    const avail = BigInt(warehouseProductStock(next, wh.id, prd.id).qtyGrams);
    assert(
      avail >= BigInt(qtyGrams),
      'NEGATIF_STOK_ENGEL',
      `${wh.name} içinde yeterli ${prd.name} stoku yok (Mevcut: ${formatQtyGrams(avail.toString(), true)}, İstenen: ${formatQtyGrams(qtyGrams, true)}).`
    );

    const unitPriceMicro = parseUnitPriceMicro(String(d.unitPrice), 'Satış birim fiyatı');
    const discountBps = parseRateBps(d.discountPct ?? '0', 'Satış iskontosu (%)');
    const freightChargeMinor = parseOptionalMoneyMinor(d.freightCharge, 'Faturaya yansıtılan nakliye/navlun');
    const vatBps = parseRateBps(d.vatPct ?? formatBps(prd.defaultVatBps).replace('%', ''), 'Satış KDV (%)');
    const withholdingCode = WITHHOLDING_RATES[d.withholdingCode] ? d.withholdingCode : 'YOK';

    const grossMinor = calcLineGrossMinor(qtyGrams, unitPriceMicro);
    assert(BigInt(grossMinor) > 0n, 'SIFIR_TUTAR', 'Satış tutarı sıfır olamaz.');
    const discountMinor = calcBpsAmountMinor(grossMinor, discountBps);
    const netMinor = (BigInt(grossMinor) - BigInt(discountMinor)).toString();
    assert(BigInt(netMinor) > 0n, 'SIFIR_NET', 'İskonto sonrası satış tutarı sıfır olamaz.');

    const vatBaseMinor = (BigInt(netMinor) + BigInt(freightChargeMinor)).toString();
    const vatMinor = calcBpsAmountMinor(vatBaseMinor, vatBps);
    const withheldVatMinor = calcWithheldVatMinor(vatMinor, withholdingCode);
    const payableVatMinor = (BigInt(vatMinor) - BigInt(withheldVatMinor)).toString();
    const totalWithVatMinor = (BigInt(vatBaseMinor) + BigInt(payableVatMinor)).toString();

    const subPrdId = d.subProductId || '';
    const subPrd = subPrdId && prd.subProducts ? prd.subProducts.find((s) => s.id === subPrdId) : null;
    const subPrdNameSnapshot = subPrd ? subPrd.name : (d.subProductNameSnapshot || '');
    const operatorId = optionalText(d.operatorId, 40) || 'usr_merkez';
    const operatorName = optionalText(d.operatorName, 80) || (SYSTEM_USERS.find((u) => u.id === operatorId)?.name || 'Merkez (Yönetici)');

    const candidateLots = next.lots
      .filter((l) => l.status === 'active' && l.warehouseId === wh.id && l.productId === prd.id && (!subPrdId || l.subProductId === subPrdId) && BigInt(l.remainingGrams) > 0n)
      .sort((a, b) => a.date.localeCompare(b.date) || a.createdSeq - b.createdSeq);

    let needed = BigInt(qtyGrams);
    let totalCogs = 0n;
    const lotConsumptions = [];

    for (const lot of candidateLots) {
      if (needed === 0n) break;
      const remQty = BigInt(lot.remainingGrams);
      const remCost = BigInt(lot.remainingCostMinor);
      const take = remQty >= needed ? needed : remQty;
      const takeCost = take === remQty ? remCost : divRoundHalfAway(remCost * take, remQty);
      lot.remainingGrams = (remQty - take).toString();
      lot.remainingCostMinor = (remCost - takeCost).toString();
      needed -= take;
      totalCogs += takeCost;
      lotConsumptions.push({
        lotId: lot.id,
        qtyGrams: take.toString(),
        costMinor: takeCost.toString()
      });
    }
    assert(needed === 0n, 'FIFO_PARTI_YETERSIZ', 'Kullanılabilir FIFO stok partisi yetersiz.');

    const docNo = d.docNo && String(d.docNo).trim()
      ? cleanText(String(d.docNo), 'Fatura no', 2, 32).toLocaleUpperCase('tr-TR')
      : `ST-${String(next.trades.filter((x) => x.kind === 'sale').length + 1).padStart(5, '0')}`;
    assert(!next.trades.some((x) => x.docNo === docNo), 'MUKERRER_BELGE', `Belge numarası (${docNo}) zaten mevcut.`);

    const plate = optionalText(d.plate || weigh?.plate || '', 24).toLocaleUpperCase('tr-TR');
    const driverName = optionalText(d.driverName || weigh?.driverName || '', 80);
    const waybillNo = optionalText(d.waybillNo || '', 40);

    next.trades.push({
      id,
      createdSeq: seq,
      kind: 'sale',
      docSubType,
      status: 'posted',
      docNo,
      waybillNo,
      plate,
      driverName,
      date,
      dueDate,
      partyId: pty.id,
      partyNameSnapshot: pty.name,
      productId: prd.id,
      productNameSnapshot: prd.name,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      warehouseNameSnapshot: wh.name,
      weighId: weigh ? weigh.id : '',
      rawQtyGrams,
      fireGrams,
      qtyGrams,
      moistureBps: '0',
      foreignBps: '0',
      unitPriceMicro,
      grossMinor,
      discountBps,
      discountMinor,
      netMinor,
      deductionBps: '0',
      deductionMinor: '0',
      bagkurBps: '0',
      bagkurMinor: '0',
      directExpenseMinor: '0',
      freightChargeMinor,
      stockCostMinor: '0',
      netPayableMinor: '0',
      vatBps,
      vatMinor,
      withholdingCode,
      withheldVatMinor,
      payableVatMinor,
      totalWithVatMinor,
      cogsMinor: totalCogs.toString(),
      lotId: '',
      lotConsumptions,
      operatorId,
      operatorName,
      note: optionalText(d.note, 220),
      at: cmd.at
    });

    next.stockMovements.push({
      id: `sm_${cmd.id}`,
      date,
      productId: prd.id,
      subProductId: subPrdId,
      subProductNameSnapshot: subPrdNameSnapshot,
      warehouseId: wh.id,
      qtyGrams: (-BigInt(qtyGrams)).toString(),
      costMinor: (-totalCogs).toString(),
      kind: 'sale',
      sourceId: id,
      operatorId,
      operatorName,
      at: cmd.at
    });

    next.partyLedger.push({
      id: `pl_${cmd.id}`,
      partyId: pty.id,
      date,
      direction: 'DEBIT',
      amountMinor: totalWithVatMinor,
      sourceKind: 'trade',
      sourceId: id,
      desc: `${docNo} · ${docSubType} (${prd.name} ${formatQtyGrams(qtyGrams, true)})`,
      at: cmd.at
    });

    // Tek adımda anında peşin / kısmi tahsilat!
    const instantPaidMinor = parseOptionalMoneyMinor(d.instantPaidAmount, 'Peşin tahsil edilen tutar');
    if (BigInt(instantPaidMinor) > 0n) {
      assert(BigInt(instantPaidMinor) <= BigInt(totalWithVatMinor), 'PESIN_ASIMI', 'Peşin tahsilat fatura genel toplamını aşamaz.');
      const recvAcc = byId(next.accounts, d.instantAccountId || next.accounts[0]?.id, 'Tahsilat hesabı');
      const cashId = `csh_inst_${cmd.id}`;
      next.cashMovements.push({
        id: cashId,
        date,
        kind: 'Tahsilat',
        accountId: recvAcc.id,
        partyId: pty.id,
        category: '',
        amountMinor: instantPaidMinor,
        signedMinor: instantPaidMinor,
        sourceKind: 'cash',
        sourceId: cashId,
        status: 'posted',
        isReversal: false,
        note: `${docNo} peşin/kısmi satış tahsilatı`,
        at: cmd.at
      });
      next.partyLedger.push({
        id: `pl_inst_${cmd.id}`,
        partyId: pty.id,
        date,
        direction: 'CREDIT',
        amountMinor: instantPaidMinor,
        sourceKind: 'cash',
        sourceId: cashId,
        desc: `Tahsilat · ${recvAcc.name} (${docNo} peşinatı)`,
        at: cmd.at
      });
      applyAllocationsInternal(next, {
        cmdId: `${cmd.id}_inst`,
        at: cmd.at,
        partyId: pty.id,
        sourceKind: 'cash',
        sourceId: cashId,
        targetTradeKind: 'sale',
        maxAmountMinor: instantPaidMinor,
        explicitTradeId: id
      });
    }

    if (weigh) {
      weigh.status = 'linked';
      weigh.linkedTradeId = id;
    }
    summary = `Mal Satışı kesinleşti: ${docNo} (${docSubType}) · ${pty.name} · ${formatQtyGrams(qtyGrams, true)} ${prd.name}`;
  } else if (cmd.type === 'trade.void') {
    const tr = byId(next.trades, d.tradeId, 'Ticari belge');
    assert(tr.status === 'posted', 'ZATEN_IPTAL', 'Bu belge zaten ters kayıtla iptal edilmiş.');
    assert(
      BigInt(tradeAllocatedMinor(next, tr.id)) === 0n,
      'MAHSUPLU_BELGE',
      'Bu belgeye bağlı aktif tahsilat/ödeme veya çek mahsubu bulunuyor. Önce Tahsilat & Kasa ekranından ilgili tahsilat/ödemeyi Storno edin.'
    );
    const voidDate = cmd.at.slice(0, 10);

    if (tr.kind === 'purchase') {
      const lot = byId(next.lots, tr.lotId, 'Alış stok partisi');
      assert(
        lot.remainingGrams === lot.initialGrams && lot.remainingCostMinor === lot.initialCostMinor,
        'PARTI_TUKETILMIS',
        'Bu alış partisindeki ürünün bir kısmı satılmış veya sevk edilmiş. Önce ilgili satışı iptal edin.'
      );
      lot.remainingGrams = '0';
      lot.remainingCostMinor = '0';
      lot.status = 'void';

      next.stockMovements.push({
        id: `sm_void_${cmd.id}`,
        date: voidDate,
        productId: tr.productId,
        warehouseId: tr.warehouseId,
        qtyGrams: (-BigInt(tr.qtyGrams)).toString(),
        costMinor: (-BigInt(tr.stockCostMinor)).toString(),
        kind: 'purchase-void',
        sourceId: tr.id,
        at: cmd.at
      });

      next.partyLedger.push({
        id: `pl_void_${cmd.id}`,
        partyId: tr.partyId,
        date: voidDate,
        direction: 'DEBIT',
        amountMinor: tr.netPayableMinor,
        sourceKind: 'trade-void',
        sourceId: tr.id,
        desc: `STORNO İPTAL · ${tr.docNo}`,
        at: cmd.at
      });

      if (BigInt(tr.directExpenseMinor || '0') > 0n) {
        const expMov = next.cashMovements.find((m) => m.sourceKind === 'trade-expense' && m.sourceId === tr.id && m.status === 'posted');
        if (expMov) {
          expMov.status = 'void';
          next.cashMovements.push({
            id: `cm_exp_void_${cmd.id}`,
            date: voidDate,
            kind: 'Stok Alış Gideri İptali',
            accountId: expMov.accountId,
            partyId: '',
            category: 'Alış Nakliye/Hammaliye',
            amountMinor: tr.directExpenseMinor,
            signedMinor: tr.directExpenseMinor,
            sourceKind: 'trade-expense-void',
            sourceId: tr.id,
            status: 'posted',
            isReversal: true,
            note: `STORNO · ${tr.docNo} alış ek gider iadesi`,
            at: cmd.at
          });
        }
      }
    } else {
      for (const c of tr.lotConsumptions) {
        const lot = byId(next.lots, c.lotId, 'Tüketilen stok partisi');
        lot.remainingGrams = (BigInt(lot.remainingGrams) + BigInt(c.qtyGrams)).toString();
        lot.remainingCostMinor = (BigInt(lot.remainingCostMinor) + BigInt(c.costMinor)).toString();
      }

      next.stockMovements.push({
        id: `sm_void_${cmd.id}`,
        date: voidDate,
        productId: tr.productId,
        warehouseId: tr.warehouseId,
        qtyGrams: tr.qtyGrams,
        costMinor: tr.cogsMinor,
        kind: 'sale-void',
        sourceId: tr.id,
        at: cmd.at
      });

      next.partyLedger.push({
        id: `pl_void_${cmd.id}`,
        partyId: tr.partyId,
        date: voidDate,
        direction: 'CREDIT',
        amountMinor: tr.totalWithVatMinor,
        sourceKind: 'trade-void',
        sourceId: tr.id,
        desc: `STORNO İPTAL · ${tr.docNo}`,
        at: cmd.at
      });
    }

    if (tr.weighId) {
      const w = byId(next.weighs, tr.weighId, 'Bağlı kantar fişi');
      w.status = 'open';
      w.linkedTradeId = '';
    }

    tr.status = 'void';
    tr.voidedAt = cmd.at;
    tr.voidReason = optionalText(d.reason, 160) || 'Ters kayıt (storno)';
    summary = `Belge ters kayıtla (storno) iptal edildi: ${tr.docNo}`;
  } else if (cmd.type === 'stock.transfer') {
    const date = strictIsoDate(d.date, 'Sevk tarihi');
    const prd = byId(next.products, d.productId, 'Ürün');
    const fromWh = byId(next.warehouses, d.fromWarehouseId, 'Çıkış deposu');
    const toWh = byId(next.warehouses, d.toWarehouseId, 'Hedef depo');
    assert(fromWh.id !== toWh.id, 'AYNI_DEPO', 'Çıkış deposu ile hedef depo aynı olamaz.');
    const qtyGrams = parseQtyGrams(String(d.qtyKg), 'Sevk miktarı (kg)');

    const avail = BigInt(warehouseProductStock(next, fromWh.id, prd.id).qtyGrams);
    assert(avail >= BigInt(qtyGrams), 'NEGATIF_STOK_ENGEL', `${fromWh.name} içinde sevk için yeterli stok yok.`);
    if (toWh.capacityGrams !== '0') {
      const targetQty = BigInt(warehouseProductStock(next, toWh.id, null).qtyGrams);
      assert(targetQty + BigInt(qtyGrams) <= BigInt(toWh.capacityGrams), 'DEPO_KAPASITE', `${toWh.name} kapasitesi aşılıyor.`);
    }

    const candidateLots = next.lots
      .filter((l) => l.status === 'active' && l.warehouseId === fromWh.id && l.productId === prd.id && BigInt(l.remainingGrams) > 0n)
      .sort((a, b) => a.date.localeCompare(b.date) || a.createdSeq - b.createdSeq);

    let needed = BigInt(qtyGrams);
    let movedCost = 0n;
    for (const lot of candidateLots) {
      if (needed === 0n) break;
      const remQty = BigInt(lot.remainingGrams);
      const remCost = BigInt(lot.remainingCostMinor);
      const take = remQty >= needed ? needed : remQty;
      const takeCost = take === remQty ? remCost : divRoundHalfAway(remCost * take, remQty);
      lot.remainingGrams = (remQty - take).toString();
      lot.remainingCostMinor = (remCost - takeCost).toString();
      needed -= take;
      movedCost += takeCost;
    }
    assert(needed === 0n, 'FIFO_PARTI_YETERSIZ', 'Sevk için kullanılabilir parti bakiyesi yetersiz.');

    next.lots.push({
      id: `lot_trf_${cmd.id}`,
      tradeId: `trf_${cmd.id}`,
      productId: prd.id,
      warehouseId: toWh.id,
      date,
      createdSeq: seq,
      initialGrams: qtyGrams,
      remainingGrams: qtyGrams,
      initialCostMinor: movedCost.toString(),
      remainingCostMinor: movedCost.toString(),
      status: 'active'
    });

    next.stockMovements.push(
      {
        id: `sm_out_${cmd.id}`,
        date,
        productId: prd.id,
        warehouseId: fromWh.id,
        qtyGrams: (-BigInt(qtyGrams)).toString(),
        costMinor: (-movedCost).toString(),
        kind: 'transfer-out',
        sourceId: cmd.id,
        at: cmd.at
      },
      {
        id: `sm_in_${cmd.id}`,
        date,
        productId: prd.id,
        warehouseId: toWh.id,
        qtyGrams,
        costMinor: movedCost.toString(),
        kind: 'transfer-in',
        sourceId: cmd.id,
        at: cmd.at
      }
    );
    summary = `Depolar arası sevk: ${formatQtyGrams(qtyGrams, true)} ${prd.name} (${fromWh.name} -> ${toWh.name})`;
  } else if (cmd.type === 'cash.post') {
    const id = validId(d.id) ? d.id : `csh_${cmd.id}`;
    const date = strictIsoDate(d.date, 'İşlem tarihi');
    const operatorId = optionalText(d.operatorId, 40) || 'usr_merkez';
    const operatorName = optionalText(d.operatorName, 80) || (SYSTEM_USERS.find((u) => u.id === operatorId)?.name || 'Merkez (Yönetici)');
    const validKinds = ['Tahsilat', 'Ödeme', 'Gelir', 'Gider', 'Virman'];
    assert(validKinds.includes(d.kind), 'HAREKET_TURU', 'Geçersiz kasa/banka hareket türü.');
    const acc = byId(next.accounts, d.accountId, 'Kasa/Banka hesabı');
    const amountMinor = parseMoneyMinor(String(d.amount), 'İşlem tutarı');
    const note = optionalText(d.note, 220);

    const isOutflow = d.kind === 'Ödeme' || d.kind === 'Gider' || d.kind === 'Virman';
    if (isOutflow && acc.kind === 'Kasa') {
      const curBal = BigInt(accountBalanceMinor(next, acc.id));
      assert(
        curBal >= BigInt(amountMinor),
        'KASA_NEGATIF_ENGEL',
        `${acc.name} fiziksel kasa bakiyesi yetersiz (Mevcut: ${formatMoneyMinor(curBal.toString())}).`
      );
    }

    if (d.kind === 'Tahsilat' || d.kind === 'Ödeme') {
      const pty = byId(next.parties, d.partyId, 'Cari kart');
      const signed = d.kind === 'Tahsilat' ? amountMinor : (-BigInt(amountMinor)).toString();
      next.cashMovements.push({
        id,
        date,
        kind: d.kind,
        accountId: acc.id,
        partyId: pty.id,
        category: '',
        amountMinor,
        signedMinor: signed,
        sourceKind: 'cash',
        sourceId: id,
        status: 'posted',
        isReversal: false,
        note,
        at: cmd.at
      });
      next.partyLedger.push({
        id: `pl_${cmd.id}`,
        partyId: pty.id,
        date,
        direction: d.kind === 'Tahsilat' ? 'CREDIT' : 'DEBIT',
        amountMinor,
        sourceKind: 'cash',
        sourceId: id,
        desc: `${d.kind} · ${acc.name}${note ? ' · ' + note : ''}`,
        at: cmd.at
      });

      const mode = d.allocationMode || (d.tradeId ? 'EXPLICIT' : 'FIFO');
      if (mode === 'EXPLICIT' && d.tradeId) {
        applyAllocationsInternal(next, {
          cmdId: cmd.id,
          at: cmd.at,
          partyId: pty.id,
          sourceKind: 'cash',
          sourceId: id,
          targetTradeKind: d.kind === 'Tahsilat' ? 'sale' : 'purchase',
          maxAmountMinor: amountMinor,
          explicitTradeId: d.tradeId
        });
      } else if (mode === 'FIFO') {
        applyAllocationsInternal(next, {
          cmdId: cmd.id,
          at: cmd.at,
          partyId: pty.id,
          sourceKind: 'cash',
          sourceId: id,
          targetTradeKind: d.kind === 'Tahsilat' ? 'sale' : 'purchase',
          maxAmountMinor: amountMinor,
          explicitTradeId: ''
        });
      }
      summary = `${d.kind} kaydedildi: ${pty.name} · ${formatMoneyMinor(amountMinor)} (${acc.name})`;
    } else if (d.kind === 'Gelir' || d.kind === 'Gider') {
      const signed = d.kind === 'Gelir' ? amountMinor : (-BigInt(amountMinor)).toString();
      const category = optionalText(d.category, 60) || (d.kind === 'Gelir' ? 'Diğer Faaliyet Geliri' : 'Genel İşletme Gideri');
      next.cashMovements.push({
        id,
        date,
        kind: d.kind,
        accountId: acc.id,
        partyId: '',
        category,
        amountMinor,
        signedMinor: signed,
        sourceKind: 'cash',
        sourceId: id,
        status: 'posted',
        isReversal: false,
        note,
        at: cmd.at
      });
      summary = `${d.kind} kaydedildi: ${category} · ${formatMoneyMinor(amountMinor)} (${acc.name})`;
    } else if (d.kind === 'Virman') {
      const toAcc = byId(next.accounts, d.toAccountId, 'Hedef Kasa/Banka hesabı');
      assert(acc.id !== toAcc.id, 'AYNI_HESAP', 'Virman için kaynak ve hedef hesap farklı olmalıdır.');
      next.cashMovements.push(
        {
          id,
          date,
          kind: 'Virman Çıkış',
          accountId: acc.id,
          partyId: '',
          category: 'Hesaplar Arası Virman',
          amountMinor,
          signedMinor: (-BigInt(amountMinor)).toString(),
          sourceKind: 'transfer',
          sourceId: id,
          status: 'posted',
          isReversal: false,
          note: `${toAcc.name} hesabına virman${note ? ' · ' + note : ''}`,
          at: cmd.at
        },
        {
          id: `${id}_in`,
          date,
          kind: 'Virman Giriş',
          accountId: toAcc.id,
          partyId: '',
          category: 'Hesaplar Arası Virman',
          amountMinor,
          signedMinor: amountMinor,
          sourceKind: 'transfer',
          sourceId: id,
          status: 'posted',
          isReversal: false,
          note: `${acc.name} hesabından virman${note ? ' · ' + note : ''}`,
          at: cmd.at
        }
      );
      summary = `Virman tamamlandı: ${formatMoneyMinor(amountMinor)} (${acc.name} -> ${toAcc.name})`;
    }
  } else if (cmd.type === 'cash.void') {
    const mov = byId(next.cashMovements, d.cashId, 'Kasa/Banka hareketi');
    assert(mov.status === 'posted' && !mov.isReversal, 'ZATEN_IPTAL', 'Bu hareket zaten iptal edilmiş veya ters kayıt niteliğinde.');
    assert(mov.sourceKind === 'cash' || mov.sourceKind === 'transfer', 'KAYNAK_KILITLI', 'Çek/senet veya alış masrafı kaynaklı kasa hareketi ilgili belge üzerinden iptal edilmelidir.');
    const voidDate = cmd.at.slice(0, 10);

    const group = mov.sourceKind === 'transfer'
      ? next.cashMovements.filter((m) => m.sourceId === mov.sourceId && m.status === 'posted')
      : [mov];

    for (const m of group) {
      const revSigned = (-BigInt(m.signedMinor)).toString();
      const acc = byId(next.accounts, m.accountId, 'Hesap');
      if (BigInt(revSigned) < 0n && acc.kind === 'Kasa') {
        assert(
          BigInt(accountBalanceMinor(next, acc.id)) >= -BigInt(revSigned),
          'KASA_NEGATIF_ENGEL',
          `${acc.name} bakiyesi bu tahsilat/giriş iptalini karşılamak için yetersiz.`
        );
      }
      m.status = 'void';
      next.cashMovements.push({
        id: `rev_${m.id}_${cmd.id}`,
        date: voidDate,
        kind: `${m.kind} (Storno)`,
        accountId: m.accountId,
        partyId: m.partyId,
        category: m.category || '',
        amountMinor: m.amountMinor,
        signedMinor: revSigned,
        sourceKind: 'cash-void',
        sourceId: m.id,
        status: 'posted',
        isReversal: true,
        note: `STORNO İPTAL · ${m.note || m.kind}`,
        at: cmd.at
      });
    }

    if (mov.partyId) {
      next.partyLedger.push({
        id: `pl_void_${cmd.id}`,
        partyId: mov.partyId,
        date: voidDate,
        direction: mov.kind === 'Tahsilat' ? 'DEBIT' : 'CREDIT',
        amountMinor: mov.amountMinor,
        sourceKind: 'cash-void',
        sourceId: mov.id,
        desc: `STORNO İPTAL · ${mov.kind}`,
        at: cmd.at
      });
      for (const a of next.allocations) {
        if (a.status === 'active' && a.sourceKind === 'cash' && a.sourceId === mov.id) {
          a.status = 'void';
        }
      }
    }
    summary = `Kasa/banka hareketi ters kayıtla iptal edildi: ${mov.kind} (${formatMoneyMinor(mov.amountMinor)})`;
  } else if (cmd.type === 'allocation.apply') {
    const tr = byId(next.trades, d.tradeId, 'Fatura/Belge');
    assert(tr.status === 'posted', 'BELGE_IPTAL', 'İptal edilmiş belgeye mahsup yapılamaz.');
    const amountMinor = parseMoneyMinor(String(d.amount), 'Mahsup tutarı');
    const openTrade = BigInt(tradeOpenMinor(next, tr));
    assert(BigInt(amountMinor) <= openTrade, 'FAZLA_MAHSUP', 'Mahsup tutarı belgenin açık bakiyesini aşamaz.');

    let srcPartyId = '';
    let srcTotal = 0n;
    if (d.sourceKind === 'cash') {
      const c = byId(next.cashMovements, d.sourceId, 'Tahsilat/Ödeme kaydı');
      assert(c.status === 'posted' && !c.isReversal, 'KAYNAK_IPTAL', 'İptal edilmiş kasa hareketi mahsup edilemez.');
      assert(
        (tr.kind === 'sale' && c.kind === 'Tahsilat') || (tr.kind === 'purchase' && c.kind === 'Ödeme'),
        'MAHSUP_YON',
        'Satış faturasına Tahsilat, Alış belgesine Ödeme mahsup edilebilir.'
      );
      srcPartyId = c.partyId;
      srcTotal = BigInt(c.amountMinor);
    } else if (d.sourceKind === 'instrument') {
      const ins = byId(next.instruments, d.sourceId, 'Çek/Senet');
      assert(!['İade / Karşılıksız', 'İade'].includes(ins.status), 'CEK_IADE', 'İade edilmiş çek/senet mahsup edilemez.');
      srcPartyId = ins.partyId;
      srcTotal = BigInt(ins.amountMinor);
    } else {
      throw new DomainError('MAHSUP_KAYNAK', 'Geçersiz mahsup kaynağı.');
    }

    assert(srcPartyId === tr.partyId, 'MAHSUP_CARI', 'Belge ile ödeme/tahsilat aynı cariye ait olmalıdır.');
    const used = BigInt(sourceAllocatedMinor(next, d.sourceKind, d.sourceId));
    assert(used + BigInt(amountMinor) <= srcTotal, 'KAYNAK_ASIMI', 'Ödeme/tahsilat kaydının serbest (mahsup edilmemiş) bakiyesi yetersiz.');

    next.allocations.push({
      id: `alc_${cmd.id}`,
      partyId: tr.partyId,
      tradeId: tr.id,
      sourceKind: d.sourceKind,
      sourceId: d.sourceId,
      amountMinor,
      status: 'active',
      at: cmd.at
    });
    summary = `Mahsup eşleştirildi: ${tr.docNo} <- ${formatMoneyMinor(amountMinor)}`;
  } else if (cmd.type === 'instrument.create') {
    const id = validId(d.id) ? d.id : `ins_${cmd.id}`;
    const validKinds = ['Alınan Çek', 'Alınan Senet', 'Verilen Çek', 'Verilen Senet'];
    assert(validKinds.includes(d.kind), 'BELGE_TURU', 'Geçersiz çek/senet türü.');
    const date = strictIsoDate(d.date, 'Kayıt tarihi');
    const dueDate = strictIsoDate(d.dueDate, 'Vade tarihi');
    assert(dueDate >= date, 'VADE_TARIHI', 'Çek/senet vadesi kayıt tarihinden önce olamaz.');
    const pty = byId(next.parties, d.partyId, 'Cari kart');
    const docNumber = cleanText(d.docNumber, 'Çek/Senet seri no', 2, 40).toLocaleUpperCase('tr-TR');
    assert(!next.instruments.some((x) => x.docNumber === docNumber && x.kind === d.kind), 'MUKERRER_CEK', 'Aynı seri numaralı çek/senet zaten kayıtlı.');
    const amountMinor = parseMoneyMinor(String(d.amount), 'Çek/Senet tutarı');

    const isInbound = d.kind === 'Alınan Çek' || d.kind === 'Alınan Senet';
    const initialStatus = isInbound ? 'Portföyde' : 'Verildi';

    next.instruments.push({
      id,
      kind: d.kind,
      docNumber,
      partyId: pty.id,
      endorsedPartyId: '',
      accountId: '',
      bankName: optionalText(d.bankName, 80),
      date,
      dueDate,
      amountMinor,
      status: initialStatus,
      note: optionalText(d.note, 200),
      history: [{ status: initialStatus, at: cmd.at, note: 'İlk kayıt' }],
      at: cmd.at
    });

    next.partyLedger.push({
      id: `pl_ins_${cmd.id}`,
      partyId: pty.id,
      date,
      direction: isInbound ? 'CREDIT' : 'DEBIT',
      amountMinor,
      sourceKind: 'instrument',
      sourceId: id,
      desc: `${d.kind} #${docNumber} (Vade: ${dueDate})`,
      at: cmd.at
    });

    if (d.tradeId || d.autoAllocate) {
      applyAllocationsInternal(next, {
        cmdId: cmd.id,
        at: cmd.at,
        partyId: pty.id,
        sourceKind: 'instrument',
        sourceId: id,
        targetTradeKind: isInbound ? 'sale' : 'purchase',
        maxAmountMinor: amountMinor,
        explicitTradeId: d.tradeId || ''
      });
    }
    summary = `${d.kind} portföye alındı: #${docNumber} · ${pty.name} · ${formatMoneyMinor(amountMinor)}`;
  } else if (cmd.type === 'instrument.transition') {
    const ins = byId(next.instruments, d.instrumentId, 'Çek/Senet');
    const target = d.nextStatus;
    const txDate = strictIsoDate(d.date || cmd.at.slice(0, 10), 'İşlem tarihi');
    const isInbound = ins.kind === 'Alınan Çek' || ins.kind === 'Alınan Senet';

    if (isInbound) {
      if (target === 'Bankada Tahsilde') {
        assert(ins.status === 'Portföyde', 'GECERSIZ_GECIS', 'Yalnızca Portföydeki çek/senet bankaya tahsile verilebilir.');
        ins.status = 'Bankada Tahsilde';
      } else if (target === 'Tahsil Edildi') {
        assert(['Portföyde', 'Bankada Tahsilde'].includes(ins.status), 'GECERSIZ_GECIS', 'Bu durumdaki belge tahsil edilemez.');
        const acc = byId(next.accounts, d.accountId, 'Tahsilat Kasa/Banka hesabı');
        ins.status = 'Tahsil Edildi';
        ins.accountId = acc.id;
        next.cashMovements.push({
          id: `cm_ins_${cmd.id}`,
          date: txDate,
          kind: 'Çek/Senet Tahsilatı',
          accountId: acc.id,
          partyId: ins.partyId,
          category: ins.kind,
          amountMinor: ins.amountMinor,
          signedMinor: ins.amountMinor,
          sourceKind: 'instrument-settle',
          sourceId: ins.id,
          status: 'posted',
          isReversal: false,
          note: `${ins.kind} #${ins.docNumber} tahsilatı`,
          at: cmd.at
        });
      } else if (target === 'Ciro Edildi') {
        assert(ins.status === 'Portföyde', 'GECERSIZ_GECIS', 'Yalnızca Portföydeki çek/senet ciro edilebilir.');
        const targetPty = byId(next.parties, d.targetPartyId, 'Ciro edilecek cari');
        assert(targetPty.id !== ins.partyId, 'AYNI_CARI_CIRO', 'Çek kendi keşidecisine ciro edilemez.');
        ins.status = 'Ciro Edildi';
        ins.endorsedPartyId = targetPty.id;
        next.partyLedger.push({
          id: `pl_ciro_${cmd.id}`,
          partyId: targetPty.id,
          date: txDate,
          direction: 'DEBIT',
          amountMinor: ins.amountMinor,
          sourceKind: 'instrument-endorse',
          sourceId: ins.id,
          desc: `Ciro Edilen ${ins.kind} #${ins.docNumber}`,
          at: cmd.at
        });
        applyAllocationsInternal(next, {
          cmdId: cmd.id,
          at: cmd.at,
          partyId: targetPty.id,
          sourceKind: 'instrument-endorse',
          sourceId: ins.id,
          targetTradeKind: 'purchase',
          maxAmountMinor: ins.amountMinor,
          explicitTradeId: d.tradeId || ''
        });
      } else if (target === 'İade / Karşılıksız') {
        assert(['Portföyde', 'Bankada Tahsilde'].includes(ins.status), 'GECERSIZ_GECIS', 'Tahsil veya ciro edilmiş belge doğrudan iade edilemez.');
        ins.status = 'İade / Karşılıksız';
        next.partyLedger.push({
          id: `pl_ins_rev_${cmd.id}`,
          partyId: ins.partyId,
          date: txDate,
          direction: 'DEBIT',
          amountMinor: ins.amountMinor,
          sourceKind: 'instrument-void',
          sourceId: ins.id,
          desc: `STORNO · Karşılıksız/İade ${ins.kind} #${ins.docNumber}`,
          at: cmd.at
        });
        for (const a of next.allocations) {
          if (a.status === 'active' && a.sourceKind === 'instrument' && a.sourceId === ins.id) a.status = 'void';
        }
      } else {
        throw new DomainError('GECERSIZ_GECIS', `Desteklenmeyen çek/senet durumu: ${target}`);
      }
    } else {
      if (target === 'Ödendi') {
        assert(ins.status === 'Verildi', 'GECERSIZ_GECIS', 'Yalnızca açık durumdaki verilen çek/senet ödenebilir.');
        const acc = byId(next.accounts, d.accountId, 'Ödeme Kasa/Banka hesabı');
        if (acc.kind === 'Kasa') {
          assert(BigInt(accountBalanceMinor(next, acc.id)) >= BigInt(ins.amountMinor), 'KASA_NEGATIF_ENGEL', `${acc.name} bakiyesi bu ödemeyi karşılamıyor.`);
        }
        ins.status = 'Ödendi';
        ins.accountId = acc.id;
        next.cashMovements.push({
          id: `cm_ins_${cmd.id}`,
          date: txDate,
          kind: 'Çek/Senet Ödemesi',
          accountId: acc.id,
          partyId: ins.partyId,
          category: ins.kind,
          amountMinor: ins.amountMinor,
          signedMinor: (-BigInt(ins.amountMinor)).toString(),
          sourceKind: 'instrument-settle',
          sourceId: ins.id,
          status: 'posted',
          isReversal: false,
          note: `${ins.kind} #${ins.docNumber} ödemesi`,
          at: cmd.at
        });
      } else if (target === 'İade') {
        assert(ins.status === 'Verildi', 'GECERSIZ_GECIS', 'Ödenmiş çek/senet iade alınamaz.');
        ins.status = 'İade';
        next.partyLedger.push({
          id: `pl_ins_rev_${cmd.id}`,
          partyId: ins.partyId,
          date: txDate,
          direction: 'CREDIT',
          amountMinor: ins.amountMinor,
          sourceKind: 'instrument-void',
          sourceId: ins.id,
          desc: `STORNO · İade Alınan ${ins.kind} #${ins.docNumber}`,
          at: cmd.at
        });
        for (const a of next.allocations) {
          if (a.status === 'active' && a.sourceKind === 'instrument' && a.sourceId === ins.id) a.status = 'void';
        }
      } else {
        throw new DomainError('GECERSIZ_GECIS', `Desteklenmeyen verilen çek/senet durumu: ${target}`);
      }
    }

    ins.history.push({ status: target, at: cmd.at, note: optionalText(d.note, 120) });
    summary = `${ins.kind} #${ins.docNumber} durumu güncellendi -> ${target}`;
  } else {
    throw new DomainError('BILINMEYEN_KOMUT', `Desteklenmeyen işlem türü: ${cmd.type}`);
  }

  next.revision = seq;
  next.audit.push({
    id: `aud_${cmd.id}`,
    cmdId: cmd.id,
    type: cmd.type,
    summary,
    at: cmd.at,
    revision: seq
  });
  next.commands.push({
    id: cmd.id,
    type: cmd.type,
    signature: JSON.stringify(cmd.data),
    revision: seq
  });

  validateState(next);
  return { state: next, duplicate: false };
}

function validateState(st) {
  assert(st && typeof st === 'object' && !Array.isArray(st), 'BOZUK_VERI', 'Veri yapısı geçersiz.');
  assert(Object.getPrototypeOf(st) === Object.prototype, 'PROTO_IHLALI', 'Veri nesnesi prototipi geçersiz.');
  assert(st.schemaVersion === SCHEMA_VERSION, 'SEMA_SURUMU', `Desteklenmeyen veri şeması: ${st.schemaVersion}`);
  assert(typeof st.instanceId === 'string' && /^[A-Za-z0-9_-]{6,64}$/.test(st.instanceId), 'ISLETME_KIMLIGI', 'İşletme kimliği bozuk.');
  assert(Number.isSafeInteger(st.revision) && st.revision >= 0, 'REVIZYON_BOZUK', 'Revizyon numarası geçersiz.');

  const collections = [
    'products', 'warehouses', 'accounts', 'parties', 'weighs',
    'trades', 'lots', 'stockMovements', 'partyLedger',
    'cashMovements', 'allocations', 'instruments', 'audit', 'commands'
  ];
  for (const col of collections) {
    assert(Array.isArray(st[col]), 'KOLEKSIYON_EKSIK', `Zorunlu veri tablosu eksik: ${col}`);
    const seen = new Set();
    for (const item of st[col]) {
      assert(item && typeof item === 'object' && validId(item.id), 'GECERSIZ_KAYIT_ID', `${col} tablosunda bozuk kimlik.`);
      assert(!seen.has(item.id), 'MUKERRER_KAYIT_ID', `${col} tablosunda mükerrer kimlik: ${item.id}`);
      seen.add(item.id);
    }
  }

  assert(
    st.audit.length === st.commands.length && st.commands.length === st.revision,
    'AUDIT_ZINCIRI_BOZUK',
    'Komut, denetim izi (audit) ve revizyon sayıları birbiriyle eşleşmiyor.'
  );

  for (const wh of st.warehouses) {
    for (const prd of st.products) {
      const mov = warehouseProductStock(st, wh.id, prd.id);
      let lotQty = 0n;
      let lotCost = 0n;
      for (const l of st.lots) {
        if (l.status === 'active' && l.warehouseId === wh.id && l.productId === prd.id) {
          assert(BigInt(l.remainingGrams) >= 0n && BigInt(l.remainingCostMinor) >= 0n, 'NEGATIF_PARTI', 'Parti bakiyesi negatif.');
          lotQty += BigInt(l.remainingGrams);
          lotCost += BigInt(l.remainingCostMinor);
        }
      }
      assert(BigInt(mov.qtyGrams) >= 0n, 'NEGATIF_STOK', `${wh.name} / ${prd.name} stoku negatif.`);
      assert(BigInt(mov.qtyGrams) === lotQty, 'STOK_MIKTAR_FARKI', `${wh.name} / ${prd.name} hareket-parti miktar farkı var.`);
      assert(BigInt(mov.costMinor) === lotCost, 'STOK_MALIYET_FARKI', `${wh.name} / ${prd.name} hareket-parti maliyet farkı var.`);
    }
  }

  const exec = computeExecutiveSummary(st);
  assert(
    BigInt(exec.inventoryDriftMinor) === 0n,
    'ENVANTER_MALIYET_SAPMASI',
    `Alış - SMM ile Stok Değeri arasında sapma oluştu: ${exec.inventoryDriftMinor} kuruş.`
  );

  for (const t of st.trades) {
    byId(st.parties, t.partyId, 'Belge carisi');
    byId(st.products, t.productId, 'Belge ürünü');
    byId(st.warehouses, t.warehouseId, 'Belge deposu');
    const alloc = BigInt(tradeAllocatedMinor(st, t.id));
    if (t.status === 'void') {
      assert(alloc === 0n, 'IPTAL_BELGEDE_MAHSUP', 'İptal edilmiş belgede aktif mahsup olamaz.');
    } else {
      const expected = BigInt(tradeExpectedSettleMinor(t));
      assert(alloc >= 0n && alloc <= expected, 'MAHSUP_TUTAR_ASIMI', `Belge (${t.docNo}) mahsup toplamı belge tutarını aşıyor.`);
    }
  }

  for (const acc of st.accounts) {
    if (acc.kind === 'Kasa') {
      assert(BigInt(accountBalanceMinor(st, acc.id)) >= 0n, 'NEGATIF_KASA', `${acc.name} bakiyesi negatif olamaz.`);
    }
  }

  return true;
}

function sanitizeAndValidateSnapshot(rawObj) {
  const jsonText = JSON.stringify(rawObj);
  assert(!jsonText.includes('"__proto__"') && !jsonText.includes('"constructor"'), 'GUVENLIK_REDDI', 'Yedek dosyasında izin verilmeyen anahtar tespit edildi.');
  const clean = JSON.parse(jsonText);
  validateState(clean);
  return clean;
}
