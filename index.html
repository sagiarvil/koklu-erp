function runIsolatedSelfDiagnostics() {
  const checks = [];
  const rec = (id, name, fn) => {
    try { fn(); checks.push({ id, name, status: 'PASS', detail: 'Doğrulandı' }); }
    catch (err) { checks.push({ id, name, status: 'FAIL', detail: err.message }); }
  };

  rec('F01', 'Türkçe tutar ayrıştırma (1.234,56 -> 123456 kuruş)', () => {
    if (parseMoneyMinor('1.234,56') !== '123456') throw new Error('Kuruş hatası');
  });
  rec('F05', 'Geçersiz biçim reddi (1,234.56)', () => {
    let ok = false; try { parseMoneyMinor('1,234.56'); } catch { ok = true; }
    if (!ok) throw new Error('Reddedilmedi');
  });
  rec('ZAH-01', 'Fire + Stopaj + Bağ-Kur + Tevkifatlı Satış + Peşin Tahsilat Tam Zahire Senaryosu', () => {
    let s = newState('TEST-ZAH-2026', 'Köklü Zahire Denetim');
    const step = (type, data, n) => { s = execute(s, { id: `zcmd_${n}`, type, data, at: '2026-11-11T09:00:00Z', expectedRevision: s.revision }).state; };
    // Form içi yeni cari açarak 20.500 kg brüt, 500 kg fire -> 20.000 kg net @ 10,00 TL = 200.000 TL (%1 borsa stopaj + %1 bağkur = 4.000 TL kesinti, net ödenecek = 196.000 TL)
    step('trade.purchase', {
      id: 'tr_p1', date: '2026-11-01', inlinePartyName: 'Çiftçi Veli Öz', productId: 'prd_001', warehouseId: 'wh_001',
      qtyKg: '20.500', fireKg: '500', unitPrice: '10,00', deductionPct: '1', bagkurPct: '1'
    }, 1);
    if (s.trades[0].qtyGrams !== '20000000' || s.trades[0].netPayableMinor !== '19600000') throw new Error('Müstahsil fire/kesinti hesabı hatalı');
    // 10.000 kg Tevkifatlı Satış (@ 12,00 TL = 120.000 TL, %10 KDV = 12.000 TL, 5/10 tevkifat = 6.000 TL, ödenecek KDV = 6.000 TL, genel toplam = 126.000 TL, 26.000 TL peşin tahsilat!)
    step('trade.sale', {
      id: 'tr_s1', docSubType: 'Tevkifatlı Satış Faturası', date: '2026-11-05', inlinePartyName: 'Yem Sanayi A.Ş.',
      productId: 'prd_001', warehouseId: 'wh_001', qtyKg: '10.000', unitPrice: '12,00', vatPct: '10', withholdingCode: '5/10',
      instantPaidAmount: '26.000,00', instantAccountId: 'acc_001'
    }, 2);
    const saleDoc = s.trades[1];
    if (saleDoc.totalWithVatMinor !== '12600000' || tradeOpenMinor(s, saleDoc) !== '10000000') throw new Error('Tevkifatlı satış veya peşin tahsilat mahsubu hatalı');
    if (computeExecutiveSummary(s).inventoryDriftMinor !== '0') throw new Error('Envanter mutabakat farkı oluştu');
  });
  rec('NEG-01', 'Negatif kontrol: 1 kuruşluk bozulmayı validateState yakalar', () => {
    let s = newState('TEST-NEG-2026', 'Negatif');
    s = execute(s, { id: 'ncmd_1', type: 'trade.purchase', data: { id: 'tr_1', date: '2026-11-11', inlinePartyName: 'Test Üretici', productId: 'prd_001', warehouseId: 'wh_001', qtyKg: '1.000', unitPrice: '10,00', deductionPct: '0' }, at: '2026-11-11T09:01:00Z', expectedRevision: 0 }).state;
    s.lots[0].remainingCostMinor = '999999';
    let caught = false; try { validateState(s); } catch { caught = true; }
    if (!caught) throw new Error('Yakalanmadı');
  });
  rec('SEC-01', 'SHA-256 yedek zarfı müdahale reddi', () => {
    const env = createBackupEnvelope(newState('TEST-BAK-2026', 'Yedek'));
    env.snapshot.company = 'Sahte';
    let caught = false; try { verifyBackupEnvelopeText(JSON.stringify(env)); } catch { caught = true; }
    if (!caught) throw new Error('Yakalanmadı');
  });

  appState.selfTestResults = checks;
  renderApp();
  showToast(`Öz-denetim tamamlandı: ${checks.filter((x) => x.status === 'PASS').length}/${checks.length} PASS`);
}

/* ============================================================================
 * EKRAN GÖRÜNÜMLERİ (ANA EKRAN + AYRI MAL ALIŞLARI + AYRI MAL SATIŞLARI + TÜM MODÜLLER)
 * ============================================================================ */
function renderSixMonthChart(st) {
  const posted = st.trades.filter((t) => t.status === 'posted');
  if (!posted.length) {
    return h('div', { className: 'empty-box' },
      h('strong', null, 'Grafik için henüz alış veya satış yok'),
      h('div', { style: 'margin-top:8px;display:inline-flex;gap:8px' },
        h('button', { type: 'button', className: 'btn sm primary', onClick: () => openPurchaseFormModal() }, '+ Mal Alışı Gir'),
        h('button', { type: 'button', className: 'btn sm blue', onClick: () => openSaleFormModal() }, '+ Mal Satışı Yap')
      )
    );
  }

  const base = istToday().slice(0, 7);
  const [by, bm] = base.split('-').map(Number);
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(Date.UTC(by, bm - 1 - i, 1));
    const key = dt.toISOString().slice(0, 7);
    let buy = 0n, sell = 0n;
    for (const t of posted) {
      if (t.date.startsWith(key)) {
        if (t.kind === 'purchase') buy += BigInt(t.netMinor);
        else sell += BigInt(t.netMinor);
      }
    }
    months.push({ label: `${key.slice(5, 7)}/${key.slice(2, 4)}`, buy, sell });
  }

  let maxVal = 100n;
  for (const m of months) {
    if (m.buy > maxVal) maxVal = m.buy;
    if (m.sell > maxVal) maxVal = m.sell;
  }

  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 540 185');
  svg.setAttribute('style', 'width:100%;height:auto;display:block');
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Son 6 ay net mal alışı ve mal satışı grafiği');

  for (let i = 0; i < 4; i++) {
    const line = document.createElementNS(SVG_NS, 'line');
    const y = String(18 + i * 40);
    line.setAttribute('x1', '16'); line.setAttribute('x2', '524'); line.setAttribute('y1', y); line.setAttribute('y2', y);
    line.setAttribute('stroke', 'var(--line)'); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  }

  months.forEach((m, idx) => {
    const gx = 36 + idx * 82;
    const hBuy = Number((m.buy * 118n) / maxVal);
    const hSell = Number((m.sell * 118n) / maxVal);

    const rBuy = document.createElementNS(SVG_NS, 'rect');
    rBuy.setAttribute('x', String(gx)); rBuy.setAttribute('y', String(140 - Math.max(3, hBuy)));
    rBuy.setAttribute('width', '22'); rBuy.setAttribute('height', String(Math.max(3, hBuy))); rBuy.setAttribute('rx', '5'); rBuy.setAttribute('fill', '#10b981');
    svg.appendChild(rBuy);

    const rSell = document.createElementNS(SVG_NS, 'rect');
    rSell.setAttribute('x', String(gx + 26)); rSell.setAttribute('y', String(140 - Math.max(3, hSell)));
    rSell.setAttribute('width', '22'); rSell.setAttribute('height', String(Math.max(3, hSell))); rSell.setAttribute('rx', '5'); rSell.setAttribute('fill', '#2563eb');
    svg.appendChild(rSell);

    const txt = document.createElementNS(SVG_NS, 'text');
    txt.setAttribute('x', String(gx + 24)); txt.setAttribute('y', '162'); txt.setAttribute('text-anchor', 'middle');
    txt.setAttribute('fill', 'var(--muted)'); txt.setAttribute('font-size', '11'); txt.setAttribute('font-weight', '750'); txt.setAttribute('stroke', 'none');
    txt.textContent = m.label;
    svg.appendChild(txt);
  });

  return h('div', null,
    svg,
    h('div', { style: 'display:flex;gap:16px;font-size:11.5px;margin-top:4px;font-weight:750' },
      h('span', { style: 'color:#10b981' }, '● Mal Alışları'),
      h('span', { style: 'color:#2563eb' }, '● Mal Satışları')
    )
  );
}

          ],
          rows: receivables
        })
      ),

/* ---------------- ÖZEL MAL ALIŞLARI EKRANI (14 SÜTUN TAM DETAY!) ---------------- */
function viewPurchases(st) {
  const q = appState.search.trim().toLocaleLowerCase('tr-TR');
  const allPurchases = st.trades.filter((t) => t.kind === 'purchase').slice().reverse();

  let totalNetKg = 0n, totalNetGoods = 0n, totalCuts = 0n, totalOpenDebt = 0n;
  for (const t of allPurchases) {
    if (t.status !== 'posted') continue;
    totalNetKg += BigInt(t.qtyGrams);
    totalNetGoods += BigInt(t.netMinor);
    totalCuts += BigInt(t.deductionMinor || '0') + BigInt(t.bagkurMinor || '0');
    totalOpenDebt += BigInt(tradeOpenMinor(st, t));
  }

  const filtered = allPurchases.filter((t) => {
    if (appState.userFilter !== 'ALL' && (t.operatorId || 'usr_merkez') !== appState.userFilter) return false;
    if (appState.subFilter === 'MUSTAHSIL' && (t.docSubType === 'Ticari Alış Faturası' || t.status === 'void')) return false;
    if (appState.subFilter === 'FATURALI' && (t.docSubType !== 'Ticari Alış Faturası' || t.status === 'void')) return false;
    if (appState.subFilter === 'OPEN' && BigInt(tradeOpenMinor(st, t)) <= 0n) return false;
    if (appState.subFilter === 'VOID' && t.status !== 'void') return false;
    if (appState.productFilter !== 'ALL' && t.productId !== appState.productFilter) return false;
    return !q || `${t.docNo} ${t.partyNameSnapshot} ${t.productNameSnapshot} ${t.plate || ''} ${t.waybillNo || ''}`.toLocaleLowerCase('tr-TR').includes(q);
  });

  return h('div', null,
    pageHead(
      'Mal Alışları (Müstahsil & Faturalı Alım)',
      'Müstahsil stopajı, borsa/Bağ-Kur kesintisi, fire düşümü, faturalı KDV ve üretici ödeme takibi.',
      h('button', {
        type: 'button',
        className: 'btn',
        onClick: () => exportCsvRows('mal-alislari',
          ['Tarih', 'Belge No', 'Belge Tipi', 'Müstahsil/Tedarikçi', 'Plaka', 'Ürün', 'Depo', 'Fire Kg', 'Net Kg', 'Birim Fiyat', 'Mal Bedeli', 'Stopaj/KDV', 'Net Ödenecek', 'Kalan Borç', 'Vade'],
          filtered.map((t) => [
            t.date, t.docNo, t.docSubType || 'Müstahsil Makbuzu', t.partyNameSnapshot, t.plate || '', t.productNameSnapshot, t.warehouseNameSnapshot,
            formatQtyGrams(t.fireGrams || '0', false), formatQtyGrams(t.qtyGrams, false), formatUnitPriceMicro(t.unitPriceMicro),
            formatMoneyMinor(t.netMinor, false),
            t.docSubType === 'Ticari Alış Faturası' ? formatMoneyMinor(t.payableVatMinor || '0', false) : formatMoneyMinor((BigInt(t.deductionMinor || '0') + BigInt(t.bagkurMinor || '0')).toString(), false),
            formatMoneyMinor(t.netPayableMinor, false), formatMoneyMinor(tradeOpenMinor(st, t), false), t.dueDate
          ])
        )
      }, iconEl('download', 15), 'Alışları CSV İndir'),
      h('button', { type: 'button', className: 'btn', onClick: () => openWeighFormModal() }, iconEl('scale', 15), 'Kantar Fişi Kes'),
      h('button', { type: 'button', className: 'btn primary', onClick: () => openPurchaseFormModal() }, iconEl('plus', 15), '+ Yeni Mal Alışı Gir')
    ),

    h('div', { className: 'stat-strip' },
      statCard('Toplam Alınan Net Ürün', formatQtyGrams(totalNetKg.toString(), true), 'text-good', `${allPurchases.filter((x) => x.status === 'posted').length} kesinleşmiş alım`),
      statCard('Toplam Mal Alış Tutarı', formatMoneyMinor(totalNetGoods.toString()), '', 'İskonto sonrası mal bedeli'),
      statCard('Toplam Stopaj & Borsa Kesintisi', formatMoneyMinor(totalCuts.toString()), '', 'Müstahsil yasal kesintileri'),
      statCard('Ödenmemiş Açık Alış Borcu', formatMoneyMinor(totalOpenDebt.toString()), totalOpenDebt > 0n ? 'text-bad' : 'text-good', 'Üretici / tedarikçiye kalan')
    ),

    h('div', { className: 'toolbar' },
      h('input', {
        type: 'text',
        className: 'input',
        placeholder: 'Müstahsil, belge no, plaka veya ürün ara...',
        value: appState.search,
        onInput: (e) => { appState.search = e.target.value; appState.tablePage = 1; renderApp(); }
      }),
      h('select', {
        className: 'select',
        onChange: (e) => { appState.productFilter = e.target.value; appState.tablePage = 1; renderApp(); }
      },
        h('option', { value: 'ALL', selected: appState.productFilter === 'ALL' }, 'Tüm Ürünler'),
        ...st.products.map((p) => h('option', { value: p.id, selected: appState.productFilter === p.id }, p.name))
      ),
      h('div', { className: 'filter-tabs' },
        ...[
          ['ALL', 'Tümü'],
          ['MUSTAHSIL', 'Müstahsil Makbuzları'],
          ['FATURALI', 'Faturalı Alışlar'],
          ['OPEN', 'Borcu Açık Olanlar'],
          ['VOID', 'İptaller']
        ].map(([id, lbl]) =>
          h('button', { type: 'button', className: `tab-chip ${appState.subFilter === id ? 'active' : ''}`, onClick: () => { appState.subFilter = id; appState.tablePage = 1; renderApp(); } }, lbl)
        )
      )
    ),
      renderUserFilterTabs(),

    h('div', { className: 'card' },
      renderDataTable({
        emptyTitle: 'Kayıtlı mal alışı bulunmuyor',
        emptyAction: h('button', { type: 'button', className: 'btn primary', onClick: () => openPurchaseFormModal() }, '+ İlk Mal Alışını Gir'),
        columns: [
          { header: 'Tarih', render: (r) => fmtDateTr(r.date) },
          { header: 'Belge / Tip', render: (r) => h('div', null, h('strong', null, r.docNo), h('div', { className: 'text-muted', style: 'font-size:10.5px' }, r.docSubType || 'Müstahsil')) },
          { header: 'Müstahsil / Tedarikçi', render: (r) => h('strong', null, r.partyNameSnapshot) },
          { header: 'Kullanıcı', render: (r) => h('span', { className: 'badge neutral', style: 'font-size:10.5px;' }, SYSTEM_USERS.find(u => u.id === (r.operatorId || 'usr_merkez'))?.name || 'Merkez') },
          { header: 'Plaka', render: (r) => r.plate || '—' },
          {
            header: 'Ürün & Alt Kırılım',
            render: (r) => h('div', null,
              h('strong', null, r.productNameSnapshot),
              r.subProductNameSnapshot ? h('div', { style: 'font-size:11px;color:var(--brand);font-weight:700;' }, `↳ ${r.subProductNameSnapshot}`) : null,
              h('div', { style: 'font-size:10.5px;color:var(--muted);' }, r.warehouseNameSnapshot)
            )
          },
          { header: 'Fire Kg', numeric: true, render: (r) => BigInt(r.fireGrams || '0') > 0n ? formatQtyGrams(r.fireGrams, false) : '—' },
          { header: 'Net Safi Kg', numeric: true, render: (r) => h('strong', null, formatQtyGrams(r.qtyGrams, true)) },
          { header: 'Birim Fiyat', numeric: true, render: (r) => formatUnitPriceMicro(r.unitPriceMicro) },
          { header: 'Brüt/Net Bedel', numeric: true, render: (r) => formatMoneyMinor(r.netMinor) },
          {
            header: 'Stopaj / KDV',
            numeric: true,
            render: (r) => r.docSubType === 'Ticari Alış Faturası'
              ? `+${formatMoneyMinor(r.payableVatMinor || '0')} KDV`
              : `−${formatMoneyMinor((BigInt(r.deductionMinor || '0') + BigInt(r.bagkurMinor || '0')).toString())}`
          },
          { header: 'Net Ödenecek', numeric: true, render: (r) => h('strong', null, formatMoneyMinor(r.netPayableMinor)) },
          {
            header: 'Kalan Borç',
            numeric: true,
            render: (r) => {
              if (r.status === 'void') return h('span', { className: 'badge red' }, 'İptal');
              const op = BigInt(tradeOpenMinor(st, r));
              return op === 0n ? h('span', { className: 'badge green' }, 'Ödendi') : h('span', { className: 'text-bad' }, formatMoneyMinor(op.toString()));
            }
          },
          { header: 'Vade', render: (r) => fmtDateTr(r.dueDate) },
          {
            header: 'İşlem',
            numeric: true,
            render: (r) => {
              const op = BigInt(tradeOpenMinor(st, r));
              return h('div', { className: 'row-actions' },
                r.status === 'posted' && op > 0n
                  ? h('button', { type: 'button', className: 'btn sm amber', onClick: () => openCashFormModal({ kind: 'Ödeme', partyId: r.partyId, tradeId: r.id, amountMinor: op.toString(), note: `${r.docNo} müstahsil ödemesi` }) }, 'Öde')
                  : null,
                h('button', { type: 'button', className: 'btn sm', onClick: () => openTradeDetailModal(r) }, 'Makbuz'),
                r.status === 'posted'
                  ? h('button', {
                      type: 'button',
                      className: 'btn sm danger',
                      onClick: () => confirmActionModal({
                        title: `Alış İptali (Storno) — ${r.docNo}`,
                        message: `${r.docNo} alış belgesi ters stok ve cari hareketiyle iptal edilsin mi?`,
                        confirmLabel: 'Storno İptal Et',
                        withReason: true,
                        onConfirm: (reason) => runCommand('trade.void', { tradeId: r.id, reason })
                      })
                    }, 'Storno')
                  : null
              );
            }
          }
        ],
        rows: filtered
      })
    )
  );
}

/* ---------------- ÖZEL MAL SATIŞLARI EKRANI (14 SÜTUN TAM DETAY!) ---------------- */
function viewSales(st) {
  const q = appState.search.trim().toLocaleLowerCase('tr-TR');
  const allSales = st.trades.filter((t) => t.kind === 'sale').slice().reverse();

  let totalSoldKg = 0n, totalNetRev = 0n, totalVat = 0n, totalGrossProfit = 0n, totalOpenAr = 0n;
  for (const t of allSales) {
    if (t.status !== 'posted') continue;
    totalSoldKg += BigInt(t.qtyGrams);
    const rev = BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
    totalNetRev += rev;
    totalVat += BigInt(t.payableVatMinor ?? t.vatMinor ?? '0');
    totalGrossProfit += rev - BigInt(t.cogsMinor);
    totalOpenAr += BigInt(tradeOpenMinor(st, t));
  }

  const filtered = allSales.filter((t) => {
    if (appState.userFilter !== 'ALL' && (t.operatorId || 'usr_merkez') !== appState.userFilter) return false;
    if (appState.subFilter === 'TEVKIFAT' && (t.withholdingCode === 'YOK' || !t.withholdingCode || t.status === 'void')) return false;
    if (appState.subFilter === 'OPEN' && BigInt(tradeOpenMinor(st, t)) <= 0n) return false;
    if (appState.subFilter === 'VOID' && t.status !== 'void') return false;
    if (appState.productFilter !== 'ALL' && t.productId !== appState.productFilter) return false;
    return !q || `${t.docNo} ${t.partyNameSnapshot} ${t.productNameSnapshot} ${t.subProductNameSnapshot || ''} ${t.plate || ''} ${t.waybillNo || ''}`.toLocaleLowerCase('tr-TR').includes(q);
  });

  return h('div', null,
    pageHead(
      'Mal Satışları (Normal, Tevkifatlı & Sevkiyat)',
      'Depo bazlı FIFO maliyet, KDV ve KDV tevkifatı, navlun, brüt kâr ve müşteri tahsilat takibi.',
      h('button', {
        type: 'button',
        className: 'btn',
        onClick: () => exportCsvRows('mal-satislari',
          ['Tarih', 'Fatura No', 'Tür', 'Müşteri', 'Plaka', 'Ürün', 'Çıkış Deposu', 'Net Kg', 'Birim Fiyat', 'KDV Hariç Net', 'KDV %', 'Ödenecek KDV', 'KDV Dahil Toplam', 'FIFO SMM', 'Brüt Kâr', 'Kalan Alacak', 'Vade'],
          filtered.map((t) => {
            const rev = BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
            return [
              t.date, t.docNo, t.docSubType || 'Satış Faturası', t.partyNameSnapshot, t.plate || '', t.productNameSnapshot, t.warehouseNameSnapshot,
              formatQtyGrams(t.qtyGrams, false), formatUnitPriceMicro(t.unitPriceMicro), formatMoneyMinor(rev.toString(), false),
              formatBps(t.vatBps), formatMoneyMinor(t.payableVatMinor ?? t.vatMinor, false), formatMoneyMinor(t.totalWithVatMinor, false),
              formatMoneyMinor(t.cogsMinor, false), formatMoneyMinor((rev - BigInt(t.cogsMinor)).toString(), false),
              formatMoneyMinor(tradeOpenMinor(st, t), false), t.dueDate
            ];
          })
        )
      }, iconEl('download', 15), 'Satışları CSV İndir'),
      h('button', { type: 'button', className: 'btn', onClick: () => openWeighFormModal() }, iconEl('scale', 15), 'Kantar Fişi Kes'),
      h('button', { type: 'button', className: 'btn blue', onClick: () => openSaleFormModal() }, iconEl('plus', 15), '+ Yeni Mal Satışı Yap')
    ),

    h('div', { className: 'stat-strip' },
      statCard('Toplam Satılan Net Ürün', formatQtyGrams(totalSoldKg.toString(), true), 'text-good', `${allSales.filter((x) => x.status === 'posted').length} satış faturası`),
      statCard('KDV Hariç Net Satış', formatMoneyMinor(totalNetRev.toString()), '', `Hesaplanan Net KDV: ${formatMoneyMinor(totalVat.toString())}`),
      statCard('Satışlardan Brüt Kâr', formatMoneyMinor(totalGrossProfit.toString()), totalGrossProfit >= 0n ? 'text-good' : 'text-bad', 'Net Satış − FIFO SMM'),
      statCard('Tahsil Edilmemiş Alacak', formatMoneyMinor(totalOpenAr.toString()), totalOpenAr > 0n ? 'text-bad' : 'text-good', 'Açık satış faturaları')
    ),

    h('div', { className: 'toolbar', style: 'flex-direction:column;align-items:stretch;gap:8px;' },
      h('div', { style: 'display:flex;gap:10px;flex-wrap:wrap;align-items:center;' },
        h('input', {
          type: 'text',
          className: 'input',
          style: 'flex:1;min-width:240px;',
          placeholder: 'Müşteri, fatura no, plaka veya ürün ara...',
          value: appState.search,
          onInput: (e) => { appState.search = e.target.value; appState.tablePage = 1; renderApp(); }
        }),
        h('select', {
          className: 'select',
          onChange: (e) => { appState.productFilter = e.target.value; appState.tablePage = 1; renderApp(); }
        },
          h('option', { value: 'ALL', selected: appState.productFilter === 'ALL' }, 'Tüm Ürünler'),
          ...st.products.map((p) => h('option', { value: p.id, selected: appState.productFilter === p.id }, p.name))
        ),
        h('div', { className: 'filter-tabs' },

function viewInventory(st) {
  const whId = appState.warehouseFilter === 'ALL' ? null : appState.warehouseFilter;
  const sum = warehouseProductStock(st, whId, null);

  const productRows = st.products.map((prd) => {
    const s = warehouseProductStock(st, whId, prd.id);
    return { ...prd, qtyGrams: s.qtyGrams, costMinor: s.costMinor, avgMicro: s.avgUnitPriceMicro };
  });

  const activeLots = st.lots
    .filter((l) => l.status === 'active' && BigInt(l.remainingGrams) > 0n && (!whId || l.warehouseId === whId))
    .slice()
    .sort((a, b) => a.date.localeCompare(b.date) || a.createdSeq - b.createdSeq);

  return h('div', null,
    pageHead(
      'Depo, Silo & Stok',
      'Depo bazlı miktar, ağırlıklı ortalama birim maliyet ve açık FIFO partiler.',

      h('button', { type: 'button', className: 'btn', onClick: () => openMasterDefinitionModal('warehouse') }, '+ Depo/Silo Ekle'),
      h('button', { type: 'button', className: 'btn secondary', onClick: () => openStockTransferModal() }, iconEl('transfer', 15), 'Depolar Arası Sevk'),
      h('button', { type: 'button', className: 'btn primary', onClick: () => openPurchaseFormModal() }, iconEl('plus', 15), 'Mal Alışı Gir')
    ),
    h('div', { className: 'stat-strip' },
      statCard('Seçili Depo Stoku', formatQtyGrams(sum.qtyGrams, true), 'text-good'),
      statCard('Stok Defter Değeri', formatMoneyMinor(sum.costMinor)),
      statCard('Depo / Silo Sayısı', String(st.warehouses.length)),
      statCard('Açık FIFO Parti', String(activeLots.length))
    ),
    h('div', { className: 'toolbar', style: 'justify-content:space-between' },
      h('div', { className: 'filter-tabs' },
        h('button', { type: 'button', className: `tab-chip ${appState.warehouseFilter === 'ALL' ? 'active' : ''}`, onClick: () => { appState.warehouseFilter = 'ALL'; renderApp(); } }, 'Tüm Depolar'),
        ...st.warehouses.map((w) =>
          h('button', { type: 'button', className: `tab-chip ${appState.warehouseFilter === w.id ? 'active' : ''}`, onClick: () => { appState.warehouseFilter = w.id; renderApp(); } }, w.name)
        )
      ),
      h('div', { className: 'filter-tabs' },
        h('button', { type: 'button', className: `tab-chip ${appState.invTab === 'SUMMARY' ? 'active' : ''}`, onClick: () => { appState.invTab = 'SUMMARY'; renderApp(); } }, 'Ürün Stok Tablosu'),
        h('button', { type: 'button', className: `tab-chip ${appState.invTab === 'LOTS' ? 'active' : ''}`, onClick: () => { appState.invTab = 'LOTS'; renderApp(); } }, `FIFO Maliyet Partileri (${activeLots.length})`)
      )
    ),
    h('div', { className: 'card' },
      appState.invTab === 'SUMMARY'
        ? renderDataTable({
            paginate: false,
            columns: [
              { header: 'Stok Kodu', render: (r) => h('strong', null, r.sku) },
              {
                header: 'Ürün Adı & Alt Kırılımlar',
                render: (r) => {
                  const subs = r.subProducts || [];

        : renderDataTable({
            emptyTitle: 'Açık FIFO stok partisi yok',
            columns: [
              { header: 'Giriş Tarihi', render: (l) => fmtDateTr(l.date) },
              { header: 'Ürün', render: (l) => st.products.find((p) => p.id === l.productId)?.name || '' },

function viewDue(st) {
  const today = istToday();
  const dir = appState.subFilter === 'RECEIVABLE' ? 'RECEIVABLE' : appState.subFilter === 'PAYABLE' ? 'PAYABLE' : 'ALL';
  const recvAging = computeAgingSummary(st, today, 'RECEIVABLE');
  const payAging = computeAgingSummary(st, today, 'PAYABLE');
  const activeAging = computeAgingSummary(st, today, dir);

  const openIns = st.instruments.filter((ins) => {
    if (!['Portföyde', 'Bankada Tahsilde', 'Verildi'].includes(ins.status)) return false;
    const isRecv = ins.kind === 'Alınan Çek' || ins.kind === 'Alınan Senet';
    if (dir === 'RECEIVABLE' && !isRecv) return false;
    if (dir === 'PAYABLE' && isRecv) return false;
    return true;
  }).map((ins) => ({
    kind: 'instrument',
    subKind: ins.kind,
    direction: (ins.kind === 'Alınan Çek' || ins.kind === 'Alınan Senet') ? 'RECEIVABLE' : 'PAYABLE',
    id: ins.id,
    docNo: ins.docNumber,
    partyId: ins.partyId,
    dueDate: ins.dueDate,
    overdueDays: Math.round((Date.parse(today + 'T00:00:00Z') - Date.parse(ins.dueDate + 'T00:00:00Z')) / 86400000),
    openMinor: ins.amountMinor,
    rawInstrument: ins
  }));

  const combined = [...activeAging.items, ...openIns].sort((a, b) => a.dueDate.localeCompare(b.dueDate));

  return h('div', null,
    pageHead('Vade & Yaşlandırma', 'Açık alış/satış faturaları ve vadesi yaklaşan çek/senetler.'),
    h('div', { className: 'stat-strip' },
      statCard('Açık Alacak Vadesi', formatMoneyMinor(recvAging.totalOpenMinor), 'text-good'),
      statCard('Açık Borç Vadesi', formatMoneyMinor(payAging.totalOpenMinor), 'text-bad'),
      statCard('0–30 Gün Geciken', formatMoneyMinor(activeAging.d0_30Minor)),
      statCard('31+ Gün Geciken', formatMoneyMinor((BigInt(activeAging.d31_60Minor) + BigInt(activeAging.d61_90Minor) + BigInt(activeAging.d90PlusMinor)).toString()), 'text-bad')
    ),
    h('div', { className: 'toolbar' },
      h('div', { className: 'filter-tabs' },
        ...[['ALL', 'Tüm Açık Vadeler'], ['RECEIVABLE', 'Tahsil Edilecekler (Alacak)'], ['PAYABLE', 'Ödenecekler (Borç)']].map(([id, lbl]) =>
          h('button', { type: 'button', className: `tab-chip ${appState.subFilter === id ? 'active' : ''}`, onClick: () => { appState.subFilter = id; renderApp(); } }, lbl)
        )
      )
    ),
    h('div', { className: 'card' },
      renderDataTable({
        emptyTitle: 'Bekleyen açık vade bulunmuyor',
        columns: [
          { header: 'Vade Tarihi', render: (x) => h('strong', null, fmtDateTr(x.dueDate)) },
          {

              ? h('span', { className: 'badge red' }, `${x.overdueDays}g gecikti`)
              : x.overdueDays === 0
              ? h('span', { className: 'badge amber' }, 'Bugün vade')

function viewProfit(st) {
  const exec = computeExecutiveSummary(st);
  const rows = [];

  for (const prd of st.products) {
    let buyGrams = 0n, sellGrams = 0n, sellNetMinor = 0n, cogsMinor = 0n;
    for (const t of st.trades) {
      if (t.status !== 'posted' || t.productId !== prd.id) continue;
      if (t.kind === 'purchase') buyGrams += BigInt(t.qtyGrams);
      else {
        sellGrams += BigInt(t.qtyGrams);
        sellNetMinor += BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
        cogsMinor += BigInt(t.cogsMinor);
      }
    }
    const mm = computeMarginAndMarkup(sellNetMinor.toString(), cogsMinor.toString());
    rows.push({
      isParent: true,
      id: prd.id,
      sku: prd.sku,
      name: `${prd.sku} · ${prd.name} (Konsolide Toplam)`,
      buyGrams: buyGrams.toString(),
      sellGrams: sellGrams.toString(),
      sellNetMinor: sellNetMinor.toString(),
      cogsMinor: cogsMinor.toString(),
      ...mm
    });

    // Sub products breakdown (Mısır 1, Mısır 2, ...)
    const subs = prd.subProducts || [];
    for (const sub of subs) {
      let subBuy = 0n, subSell = 0n, subNet = 0n, subCogs = 0n;
      for (const t of st.trades) {
        if (t.status !== 'posted' || t.productId !== prd.id || t.subProductId !== sub.id) continue;
        if (t.kind === 'purchase') subBuy += BigInt(t.qtyGrams);
        else {
          subSell += BigInt(t.qtyGrams);
          subNet += BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
          subCogs += BigInt(t.cogsMinor);
        }
      }
      const subMm = computeMarginAndMarkup(subNet.toString(), subCogs.toString());
      rows.push({
        isParent: false,
        id: sub.id,
        sku: sub.code || '—',
        name: `↳ ${sub.name}`,
        buyGrams: subBuy.toString(),
        sellGrams: subSell.toString(),
        sellNetMinor: subNet.toString(),
        cogsMinor: subCogs.toString(),
        ...subMm
      });
    }
  }

  return h('div', null,
    pageHead(
      'Kârlılık & Mutabakat',
      'Ürün ve alt kırılım (sınıf) bazında FIFO satış maliyeti, brüt kâr marjı ve mutabakat.',
      h('button', {
        type: 'button',
        className: 'btn primary',
        onClick: () => openSubProductManagerModal()
      }, iconEl('scale', 15), 'Alt Kırılımları Yönet'),
      h('button', {
        type: 'button',
        className: 'btn',
        onClick: () => exportCsvRows('karlilik', ['Ürün / Sınıf', 'Alınan Kg', 'Satılan Kg', 'Net Satış', 'FIFO SMM', 'Brüt Kâr', 'Marj %', 'Markup %'],
          rows.map((r) => [r.name, formatQtyGrams(r.buyGrams, false), formatQtyGrams(r.sellGrams, false), formatMoneyMinor(r.sellNetMinor, false), formatMoneyMinor(r.cogsMinor, false), formatMoneyMinor(r.grossProfitMinor, false), r.marginBps !== null ? formatBps(r.marginBps) : '—', r.markupBps !== null ? formatBps(r.markupBps) : '—']))
      }, iconEl('download', 15), 'CSV'),
      h('button', { type: 'button', className: 'btn secondary', onClick: () => window.print() }, 'Yazdır')
    ),
    h('div', { className: 'status-strip' },
      h('span', null, `Canlı Mutabakat: Net Alış (${formatMoneyMinor(exec.buyNetMinor)}) − SMM (${formatMoneyMinor(exec.cogsMinor)}) = Stok (${formatMoneyMinor(exec.stockValueMinor)})`),
      h('span', null, `Sapma Farkı: ${formatMoneyMinor(exec.inventoryDriftMinor)} (Tam Mutabık)`)
    ),
    h('div', { className: 'stat-strip' },
      statCard('KDV Hariç Net Satış', formatMoneyMinor(exec.sellNetMinor), 'text-good'),
      statCard('Satılan Mal Maliyeti', formatMoneyMinor(exec.cogsMinor)),
      statCard('Brüt Ticari Kâr', formatMoneyMinor(exec.grossProfitMinor), BigInt(exec.grossProfitMinor) >= 0n ? 'text-good' : 'text-bad'),
      statCard('Net Faaliyet Sonucu', formatMoneyMinor(exec.operatingResultMinor), BigInt(exec.operatingResultMinor) >= 0n ? 'text-good' : 'text-bad')
    ),
    h('div', { className: 'card' },
      renderDataTable({
        paginate: false,
        columns: [
          {
            header: 'Ürün / Alt Kırılım Sınıfı',
            render: (r) => r.isParent
              ? h('div', { style: 'font-weight:800;color:var(--brand);display:flex;align-items:center;gap:6px;' },
                  h('span', { className: 'badge primary', style: 'font-size:9.5px;padding:2px 6px;' }, 'ANA ÜRÜN'),
                  h('span', null, r.name)
                )
              : h('div', { style: 'padding-left:18px;color:var(--ink);font-weight:600;' }, r.name)
          },
          { header: 'Alınan Kg', numeric: true, render: (r) => formatQtyGrams(r.buyGrams, true) },
          { header: 'Satılan Kg', numeric: true, render: (r) => formatQtyGrams(r.sellGrams, true) },
          { header: 'Net Satış (Ciro)', numeric: true, render: (r) => formatMoneyMinor(r.sellNetMinor) },
          { header: 'FIFO Maliyet', numeric: true, render: (r) => formatMoneyMinor(r.cogsMinor) },
          { header: 'Brüt Kâr', numeric: true, render: (r) => h('span', { className: BigInt(r.grossProfitMinor) >= 0n ? 'text-good' : 'text-bad', style: r.isParent ? 'font-weight:800;' : '' }, formatMoneyMinor(r.grossProfitMinor)) },
          { header: 'Brüt Marj (%)', numeric: true, render: (r) => r.marginBps !== null ? formatBps(r.marginBps) : '—' },
          { header: 'Markup (%)', numeric: true, render: (r) => r.markupBps !== null ? formatBps(r.markupBps) : '—' }
        ],
        rows
      })
    )
  );
}

function viewReports(st) {
  const from = appState.reportFrom || '2000-01-01';
  const to = appState.reportTo || '2099-12-31';
  const periodTrades = st.trades.filter((t) => t.status === 'posted' && t.date >= from && t.date <= to);
  let pBuy = 0n, pStopaj = 0n, pBagkur = 0n, pSell = 0n, pVat = 0n, pWithheld = 0n;
  for (const t of periodTrades) {
    if (t.kind === 'purchase') {
      pBuy += BigInt(t.stockCostMinor);
      pStopaj += BigInt(t.deductionMinor || '0');
      pBagkur += BigInt(t.bagkurMinor || '0');
    } else {
      pSell += BigInt(t.netMinor) + BigInt(t.freightChargeMinor || '0');
      pVat += BigInt(t.payableVatMinor ?? t.vatMinor ?? '0');
      pWithheld += BigInt(t.withheldVatMinor || '0');
    }
  }
  const ledgerRows = st.partyLedger.filter((l) => l.date >= from && l.date <= to).slice().reverse();

  return h('div', null,
    pageHead(
      'Rapor & Defter Merkezi',
      `Dönemsel vergi/stopaj özeti ve birleşik cari hareket defteri (${st.company}).`,
      h('button', {
        type: 'button',
        className: 'btn',
        onClick: () => exportCsvRows('hareket-defteri', ['Tarih', 'Cari', 'Yön', 'Tutar', 'Açıklama'],
          ledgerRows.map((l) => [l.date, st.parties.find((p) => p.id === l.partyId)?.name || '', l.direction === 'DEBIT' ? 'Borç' : 'Alacak', formatMoneyMinor(l.amountMinor, false), l.desc]))
      }, iconEl('download', 15), 'Defter CSV'),
      h('button', { type: 'button', className: 'btn primary', onClick: () => window.print() }, 'A4 Resmi Rapor Yazdır')
    ),
    h('div', { className: 'toolbar' },
      h('input', { type: 'date', className: 'input', value: appState.reportFrom, onChange: (e) => { appState.reportFrom = e.target.value; renderApp(); } }),
      h('input', { type: 'date', className: 'input', value: appState.reportTo, onChange: (e) => { appState.reportTo = e.target.value; renderApp(); } }),
      (appState.reportFrom || appState.reportTo)
        ? h('button', { type: 'button', className: 'btn sm', onClick: () => { appState.reportFrom = ''; appState.reportTo = ''; renderApp(); } }, 'Filtreyi Sıfırla')
        : null
    ),
    h('div', { className: 'stat-strip' },
      statCard('Dönem Mal Alışı', formatMoneyMinor(pBuy.toString())),
      statCard('Müstahsil Stopaj + Borsa', formatMoneyMinor((pStopaj + pBagkur).toString()), '', `Stopaj: ${formatMoneyMinor(pStopaj.toString())} · Borsa/Bağ-Kur: ${formatMoneyMinor(pBagkur.toString())}`),
      statCard('Dönem Net Satış', formatMoneyMinor(pSell.toString()), 'text-good'),
      statCard('Satış KDV & Tevkifat', formatMoneyMinor(pVat.toString()), '', `Tevkif Edilen KDV: ${formatMoneyMinor(pWithheld.toString())}`)
    ),
    h('div', { className: 'card' },
      renderDataTable({
        emptyTitle: 'Seçili dönemde defter kaydı yok',
        columns: [
          { header: 'Tarih', render: (l) => fmtDateTr(l.date) },
          { header: 'Cari Hesap', render: (l) => st.parties.find((p) => p.id === l.partyId)?.name || '—' },
          { header: 'Açıklama', render: (l) => l.desc },
          { header: 'Borç (Alacağımız)', numeric: true, render: (l) => l.direction === 'DEBIT' ? formatMoneyMinor(l.amountMinor) : '—' },
          { header: 'Alacak (Borcumuz)', numeric: true, render: (l) => l.direction === 'CREDIT' ? formatMoneyMinor(l.amountMinor) : '—' }
        ],
        rows: ledgerRows
      })
    )
  );
}

async function triggerJsonBackupDownload() {
  const env = createBackupEnvelope(appState.data);
  downloadBlob(JSON.stringify(env, null, 2), `koklu-agro-pro-plus-rev${appState.data.revision}-${istToday()}.json`, 'application/json;charset=utf-8');
  await markExternalBackupCompleted(appState.data.revision);
  renderApp();
  showToast(`SHA-256 yedek indirildi (Rev #${appState.data.revision})`);
}

function viewSystem(st) {
  const sInfo = getStorageInfo();
  const compIn = h('input', { type: 'text', className: 'input', value: st.company, maxLength: 120 });
  const cityIn = h('input', { type: 'text', className: 'input', value: st.companyMeta?.city || 'İzmir' });
  const taxNoIn = h('input', { type: 'text', className: 'input', value: st.companyMeta?.taxNo || '', placeholder: 'VKN / TCKN' });

  return h('div', null,
    pageHead(
      'Yedek & Sistem',
      `İşletme: ${st.instanceId} · Revizyon #${st.revision}`,
      h('button', { type: 'button', className: 'btn secondary', onClick: () => runIsolatedSelfDiagnostics() }, iconEl('shield', 15), 'Canlı Öz-Denetim Çalıştır'),
      h('button', { type: 'button', className: 'btn', onClick: () => document.getElementById('backupFileInput')?.click() }, iconEl('upload', 15), 'Yedek Yükle'),
      h('button', { type: 'button', className: 'btn primary', onClick: () => triggerJsonBackupDownload() }, iconEl('download', 15), 'JSON Yedek İndir')
    ),

    h('div', { className: `status-strip ${sInfo.mode === 'SANDBOX_MEMORY' ? 'warn' : ''}` },
      h('span', null, sInfo.mode === 'SANDBOX_MEMORY'
        ? 'Önizleme Kısıtlı Bellek Modu (Kalıcı olmayan geçici web alanı kullanılmaz; kalıcı kayıt için HTML dosyasını indirip açın veya JSON Yedek alın)'
        : `${sInfo.mode === 'P2_SQLITE' ? 'P2 Yerel SQLite WAL Aktif' : 'IndexedDB Atomik Kayıt Aktif'} · Son Dış Yedek: Rev #${sInfo.lastExternalBackupRev}`)
    ),

    h('div', { className: 'equal-2' },
      h('div', { className: 'card' },
        h('div', { className: 'card-head' }, h('h2', null, 'İşletme Bilgisi')),
        h('form', {
          onSubmit: async (e) => {
            e.preventDefault();
            try { await runCommand('company.update', { company: compIn.value, city: cityIn.value, taxNo: taxNoIn.value }); }
            catch (err) { showToast(err.message, 'error'); }
          }
        },
          h('div', { className: 'form-grid' },
            formField('İşletme Unvanı *', compIn, { full: true }),
            formField('Şehir', cityIn),
            formField('VKN / TCKN', taxNoIn)
          ),
          h('div', { style: 'margin-top:12px;display:flex;justify-content:flex-end' }, h('button', { type: 'submit', className: 'btn primary' }, 'Kaydet'))
        )
      ),
      h('div', { className: 'card' },
        h('div', { className: 'card-head' }, h('h2', null, 'İç Kurtarma Noktaları')),
        renderDataTable({
          paginate: false,
          emptyTitle: 'Kayıt noktası yok',
          columns: [
            { header: 'Nokta', render: (c) => c.label },
            { header: 'Rev', numeric: true, render: (c) => `#${c.revision}` },
            { header: 'SHA-256', render: (c) => `${String(c.checksum).slice(0, 10)}…` }
          ],
          rows: appState.checkpoints.slice(0, 4)
        })
      )
    ),

    appState.selfTestResults
      ? h('div', { className: 'card' },
          h('div', { className: 'card-head' }, h('h2', null, 'Öz-Denetim Sonucu')),
          renderDataTable({
            paginate: false,
            columns: [
              { header: 'Kod', render: (r) => h('strong', null, r.id) },
              { header: 'Test', render: (r) => r.name },
              { header: 'Durum', render: (r) => h('span', { className: `badge ${r.status === 'PASS' ? 'green' : 'red'}` }, r.status) }
            ],
            rows: appState.selfTestResults
          })
        )
      : null,

    h('div', { className: 'card' },
      h('div', { className: 'card-head' }, h('h2', null, `İşlem Geçmişi / Audit (${st.audit.length})`)),
      renderDataTable({
        emptyTitle: 'Henüz işlem yok',
        columns: [
          { header: 'Rev', numeric: true, render: (a) => `#${a.revision}` },
          { header: 'Zaman', render: (a) => new Date(a.at).toLocaleString('tr-TR') },
          { header: 'İşlem', render: (a) => a.summary }
        ],
        rows: st.audit.slice().reverse()
      })
    )
  );
}

/* ---------------- ANA RENDER VE OLAY BAĞLANTILARI ---------------- */
let _currentNextAction = () => openPurchaseFormModal();

function renderSidebar(st) {
  const navOp = document.getElementById('navOperations');
  const navCtrl = document.getElementById('navControl');
  clearNode(navOp);
  clearNode(navCtrl);

  const openWeighCount = st ? st.weighs.filter((w) => w.status === 'open').length : 0;
  const buyCount = st ? st.trades.filter((t) => t.kind === 'purchase' && t.status === 'posted').length : 0;
  const saleCount = st ? st.trades.filter((t) => t.kind === 'sale' && t.status === 'posted').length : 0;
  const openDueCount = st ? computeAgingSummary(st, istToday(), 'ALL').items.length : 0;

  const makeBtn = ([id, label]) => {
    const badgeVal = id === 'scale' && openWeighCount > 0 ? String(openWeighCount)
      : id === 'purchases' && buyCount > 0 ? String(buyCount)
      : id === 'sales' && saleCount > 0 ? String(saleCount)
      : id === 'due' && openDueCount > 0 ? String(openDueCount)
      : null;

    return h('button', {
      type: 'button',
      className: `nav-btn ${appState.page === id ? 'active' : ''}`,
      'aria-current': appState.page === id ? 'page' : null,
      onClick: () => navigateTo(id)
    },
      iconEl(id, 17),
      h('span', null, label),
      badgeVal ? h('span', { className: 'nav-badge' }, badgeVal) : null
    );
  };

  NAV_OPERATIONS.forEach((it) => navOp.appendChild(makeBtn(it)));
  NAV_CONTROL.forEach((it) => navCtrl.appendChild(makeBtn(it)));
}


function renderScenarioStrip(st) {
  const isPop = (st.parties && st.parties.length > 0) || (st.trades && st.trades.length > 0);
  const wrap = h('div', {
    className: 'demo-scenario-strip no-print',
    style: 'display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;margin:0 0 16px;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);'
  });
  const left = h('div', { style: 'display:flex;align-items:center;gap:10px;min-width:0;flex:1;font-size:12px;' },
    h('span', {
      style: 'background:' + (isPop ? 'rgba(59,130,246,0.12)' : 'rgba(34,197,94,0.12)') + ';color:' + (isPop ? '#2563eb' : '#16a34a') + ';font-weight:800;font-size:10.5px;padding:4px 9px;border-radius:6px;white-space:nowrap;'
    }, isPop ? '💡 HAZIR SENARYO YÜKLÜ' : '✨ BOŞ ÇALIŞMA ALANI'),
    h('span', { style: 'color:var(--muted);' },
      isPop ? 'Bu demo çalışan zahire, çiftçi müstahsil, kantar ve silo operasyon verileriyle açılmıştır. İnceleyebilir veya temizleyip kendi verilerinizi girebilirsiniz.'
            : 'Tüm veriler temizlendi. Şimdi sol menüden kendi cari, kantar ve ticaret kayıtlarınızı girebilirsiniz.'
    )
  );
  const right = h('div', { style: 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;' });
  if (isPop) {
    right.appendChild(h('button', {
      type: 'button',
      className: 'btn sm danger',
      style: 'background:#dc2626;color:#ffffff;border:none;padding:6px 14px;border-radius:8px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;',
      onClick: async () => {
        if (!confirm('Tüm örnek tarım senaryosu verileri temizlenecek ve sıfır kayıtlı boş çalışma alanına geçilecektir. Devam etmek istiyor musunuz?')) return;
        if (typeof localStorage !== 'undefined') localStorage.setItem('koklu_manual_clean', '1');
        const clean = newState(st.instanceId, st.company);
        await persistDirectSnapshot(clean, 'Kullanıcı verileri temizledi');
        appState.data = clean;
        renderApp();
        showToast('Tüm veriler temizlendi. Artık kendi kayıtlarınızı girebilirsiniz.');
      }
    }, '🗑️ Verileri Temizle (Boş Başla)'));
    right.appendChild(h('button', {
      type: 'button',
      className: 'btn sm ghost',
      style: 'background:transparent;border:1px solid var(--line);color:var(--ink);padding:6px 12px;border-radius:8px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;cursor:pointer;',
      onClick: async () => {
        if (typeof localStorage !== 'undefined') localStorage.removeItem('koklu_manual_clean');
        const seeded = buildDefaultSeedState();
        await persistDirectSnapshot(seeded, 'Örnek senaryo yenilendi');
        appState.data = seeded;
        renderApp();
        showToast('Örnek tarım senaryosu yüklendi.');
      }
    }, '🔄 Yenile'));
  } else {
    right.appendChild(h('button', {
      type: 'button',
      className: 'btn sm primary',
      style: 'background:#0284c7;color:#ffffff;border:none;padding:6px 14px;border-radius:8px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;cursor:pointer;',
      onClick: async () => {
        if (typeof localStorage !== 'undefined') localStorage.removeItem('koklu_manual_clean');
        const seeded = buildDefaultSeedState();
        await persistDirectSnapshot(seeded, 'Örnek senaryo yüklendi');
        appState.data = seeded;
        renderApp();
        showToast('Örnek tarım senaryosu yüklendi.');
      }
    }, '🔄 Örnek Senaryoyu Yükle'));
  }
  wrap.appendChild(left);
  wrap.appendChild(right);
  return wrap;
}

function renderApp() {
  const st = appState.data;
  renderSidebar(st);
  if (!appState.ready || !st) return;

  const next = resolveNextStep(st);
  _currentNextAction = next.action;
  document.getElementById('sideNextTitle').textContent = next.short;
  document.getElementById('sideNextSub').textContent = next.sub;

  document.getElementById('brandCompany').textContent = st.company.toLocaleUpperCase('tr-TR');
  document.getElementById('crumbCompany').textContent = st.company;
  document.getElementById('crumbPage').textContent = PAGE_TITLES[appState.page] || 'Ana Ekran';
  document.getElementById('sideInstance').textContent = st.instanceId;
  document.getElementById('sideRevInfo').textContent = `Rev #${st.revision}`;

  const curUser = SYSTEM_USERS.find((u) => u.id === (appState.activeUserId || 'usr_merkez')) || SYSTEM_USERS[0];
  const uLbl = document.getElementById('activeUserLabel');
  if (uLbl) uLbl.textContent = curUser.name;

  const sInfo = getStorageInfo();
  const badge = document.getElementById('storageBadge');
  const badgeTxt = document.getElementById('storageBadgeText');
  if (sInfo.mode === 'P2_SQLITE') {
    badge.className = 'status-pill';
    badgeTxt.textContent = `SQLite P2 · Rev #${st.revision}`;
  } else if (sInfo.mode === 'INDEXED_DB') {
    badge.className = 'status-pill';
    badgeTxt.textContent = `IndexedDB · Rev #${st.revision}`;
  } else {
    badge.className = 'status-pill warn';
    badgeTxt.textContent = `Önizleme · Rev #${st.revision}`;
  }

  const lh = document.getElementById('printLetterhead');
  clearNode(lh);
  lh.appendChild(h('div', null, h('strong', { style: 'font-size:13pt;display:block' }, st.company), h('span', null, `${PAGE_TITLES[appState.page] || ''} · TRY (₺)`)));
  lh.appendChild(h('div', { style: 'text-align:right' }, h('div', null, istNowText()), h('div', null, `${st.instanceId} · Rev #${st.revision}`)));

  const views = {
    dashboard: viewDashboard,
    purchases: viewPurchases,
    sales: viewSales,
    trades: viewTrades,
    parties: viewParties,
    scale: viewScale,
    inventory: viewInventory,
    cash: viewCash,
    instruments: viewInstruments,
    due: viewDue,
    profit: viewProfit,
    reports: viewReports,
    guide: viewGuide,
    system: viewSystem
  };

  const isPop = (st.parties && st.parties.length > 0) || (st.trades && st.trades.length > 0);
  const tReset = document.getElementById('btnTopResetKoklu');
  const tSeed = document.getElementById('btnTopSeedKoklu');
  if (tReset && tReset.style) tReset.style.display = isPop ? 'inline-flex' : 'none';
  if (tSeed && tSeed.style) tSeed.style.display = isPop ? 'none' : 'inline-flex';

  const pv = document.getElementById('pageView');
  clearNode(pv);
  pv.appendChild(renderScenarioStrip(st));
  pv.appendChild((views[appState.page] || viewDashboard)(st));
  pv.appendChild(renderContextHelp(appState.page));
}

function bindShellEvents() {
  document.getElementById('btnTopResetKoklu')?.addEventListener('click', async () => {
    if (!confirm('Tüm örnek tarım senaryosu verileri temizlenecek ve sıfır kayıtlı boş çalışma alanına geçilecektir. Devam etmek istiyor musunuz?')) return;
    if (typeof localStorage !== 'undefined') localStorage.setItem('koklu_manual_clean', '1');
    const clean = newState(appState.data.instanceId, appState.data.company);
    await persistDirectSnapshot(clean, 'Kullanıcı verileri temizledi');
    appState.data = clean;
    renderApp();
    showToast('Tüm veriler temizlendi. Artık kendi kayıtlarınızı girebilirsiniz.');
  });
  document.getElementById('btnTopSeedKoklu')?.addEventListener('click', async () => {
    if (typeof localStorage !== 'undefined') localStorage.removeItem('koklu_manual_clean');
    const seeded = buildDefaultSeedState();
    await persistDirectSnapshot(seeded, 'Örnek senaryo yüklendi');
    appState.data = seeded;
    renderApp();
    showToast('Örnek tarım senaryosu yüklendi.');
  });
  document.getElementById('btnMenuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  document.getElementById('sidebarBackdrop').addEventListener('click', () => document.getElementById('sidebar').classList.remove('open'));
  document.getElementById('btnCloseModal').addEventListener('click', () => closeModal());
  document.getElementById('modalOverlay').addEventListener('click', (e) => { if (e.target.id === 'modalOverlay') closeModal(); });
  document.getElementById('btnUserSwitch')?.addEventListener('click', () => openUserSwitchModal());
  document.getElementById('btnCmdPalette').addEventListener('click', () => openCommandPalette());
  document.getElementById('btnQuickPrint').addEventListener('click', () => window.print());
  document.getElementById('btnQuickAction').addEventListener('click', () => {
    if (appState.page === 'sales') openSaleFormModal();
    else openPurchaseFormModal();
  });
  document.getElementById('btnFlowGuide').addEventListener('click', () => _currentNextAction());
  document.getElementById('btnSideGuide').addEventListener('click', () => navigateTo('guide'));

  document.getElementById('themePicker').addEventListener('change', (e) => {
    const val = e.target.value;
    if (['emerald', 'sapphire', 'noir'].includes(val)) {
      document.documentElement.dataset.theme = val;
      appState.theme = val;
    }
  });

  document.getElementById('backupFileInput').addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const cleanSnapshot = verifyBackupEnvelopeText(String(reader.result || ''));
        confirmActionModal({
          title: 'Yedeği Geri Yükle',
          message: `SHA-256 doğrulandı (${cleanSnapshot.company}, Rev #${cleanSnapshot.revision}). Mevcut verinizin kopyası korunarak bu yedek yüklensin mi?`,
          confirmLabel: 'Geri Yükle',
          danger: false,
          onConfirm: async () => {
            appState.data = await restoreVerifiedSnapshot(cleanSnapshot);
            appState.checkpoints = await listInternalCheckpoints();
            renderApp();
            showToast(`Yedek yüklendi (Rev #${appState.data.revision})`);
          }
        });
      } catch (err) {
        showToast(`Yedek Reddedildi: ${err.message}`, 'error');
      }
    };
    reader.readAsText(file);
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openCommandPalette(); return; }
    if (e.key === 'F2') { e.preventDefault(); openPurchaseFormModal(); return; }
    if (e.key === 'Escape') {
      if (document.getElementById('modalOverlay').classList.contains('open')) { e.preventDefault(); closeModal(); }
      else document.getElementById('sidebar').classList.remove('open');
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's' && document.getElementById('modalOverlay').classList.contains('open')) {
      const form = document.querySelector('#modalBody form');
      if (form) { e.preventDefault(); form.requestSubmit(); }
    }
  });

  onMultiTabSync(async () => {
    try { appState.data = await readCurrentState(); renderApp(); }
    catch { /* Mevcut ekran korunur */ }
  });
}

(async function bootstrap() {
  bindShellEvents();
  try {
    appState.data = await initStorage();
    appState.ready = true;
    renderApp();
  } catch (err) {
    document.getElementById('storageBadge').className = 'status-pill err';
    document.getElementById('storageBadgeText').textContent = 'Depolama Hatası';
    const pv = document.getElementById('pageView');
    clearNode(pv);
    pv.appendChild(h('div', { className: 'empty-box' }, h('strong', null, 'Depolama Başlatılamadı'), h('span', null, err.message || '')));
  }
})();


})();
</script>
