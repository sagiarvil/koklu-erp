/**
 * KÖKLÜ AGRO PRO+ — ATOMİK DEPOLAMA, ÇOKLU SEKME SENKRONİZASYONU VE SHA-256 YEDEK MOTORU
 *
 * Kurallar (Anayasa V3 Bölüm 11, 12, 17.4):
 * - Ticari veri ve yedekler ASLA localStorage veya sessionStorage içine yazılmaz.
 * - P2 yerel SQLite servisi aktifse (window.__HH_P2_API__) tüm komutlar sunucuya gider.
 * - Tek dosya / çevrimdışı modda (P1) tüm kayıtlar tek bir atomik IndexedDB transaction (oncomplete + readback) ile yazılır.
 * - Kısıtlı önizleme iframe ortamında IndexedDB engellenirse kullanıcıya açık uyarı verilerek izole bellek modunda çalışılır.
 */

const IDB_NAME = 'koklu_agro_pro_plus_v10_idb';
const IDB_VERSION = 1;
const SNAPSHOT_KEY = 'active_state_v2';
const BACKUP_FORMAT = 'HH-AGRO-BACKUP-V2';

/**
 * Saf JS deterministik SHA-256 (file:// protokolünde crypto.subtle olmasa dahi çalışır)
 */
function sha256Hex(str) {
  const bytes = new TextEncoder().encode(str);
  const K = new Uint32Array([
    0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
    0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
    0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
    0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
    0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
  ]);
  const H = new Uint32Array([
    0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
    0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19
  ]);
  const bitLen = bytes.length * 8;
  const padLen = ((bytes.length + 9 + 63) >> 6) << 6;
  const buf = new Uint8Array(padLen);
  buf.set(bytes);
  buf[bytes.length] = 0x80;
  const view = new DataView(buf.buffer);
  view.setUint32(padLen - 8, Math.floor(bitLen / 0x100000000), false);
  view.setUint32(padLen - 4, bitLen >>> 0, false);

  const W = new Uint32Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));

  for (let i = 0; i < padLen; i += 64) {
    for (let t = 0; t < 16; t++) W[t] = view.getUint32(i + t * 4, false);
    for (let t = 16; t < 64; t++) {
      const s0 = rotr(W[t - 15], 7) ^ rotr(W[t - 15], 18) ^ (W[t - 15] >>> 3);
      const s1 = rotr(W[t - 2], 17) ^ rotr(W[t - 2], 19) ^ (W[t - 2] >>> 10);
      W[t] = (W[t - 16] + s0 + W[t - 7] + s1) >>> 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let t = 0; t < 64; t++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + K[t] + W[t]) >>> 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  return Array.from(H).map((x) => x.toString(16).padStart(8, '0')).join('');
}

let _storageMode = 'INIT'; // 'P2_SQLITE' | 'INDEXED_DB' | 'SANDBOX_MEMORY'
let _idbHandle = null;
let _memoryState = null;
let _memoryBackups = [];
let _lastExternalBackupRev = 0;
let _csrfToken = null;
let _channel = null;
let _onExternalSync = null;

function getStorageInfo() {
  return {
    mode: _storageMode,
    lastExternalBackupRev: _lastExternalBackupRev
  };
}

function onMultiTabSync(cb) {
  _onExternalSync = cb;
}

function setupBroadcast() {
  if (_channel || typeof BroadcastChannel === 'undefined') return;
  try {
    _channel = new BroadcastChannel('koklu_agro_pro_plus_v10_sync');
    _channel.onmessage = (ev) => {
      if (ev?.data?.type === 'STATE_COMMITTED' && typeof _onExternalSync === 'function') {
        _onExternalSync(ev.data.revision);
      }
    };
  } catch {
    _channel = null;
  }
}

function notifyBroadcast(revision) {
  try {
    _channel?.postMessage({ type: 'STATE_COMMITTED', revision });
  } catch {
    // BroadcastChannel kısıtlı ortamda sessiz geçilir
  }
}

async function p2Request(endpoint, options = {}) {
  const base = window.__HH_P2_API__;
  const headers = { 'X-HH-Request': '1', ...(options.headers || {}) };
  const res = await fetch(base + endpoint, {
    credentials: 'same-origin',
    cache: 'no-store',
    ...options,
    headers
  });
  if (res.headers.get('X-HH-CSRF')) _csrfToken = res.headers.get('X-HH-CSRF');
  const ct = res.headers.get('content-type') || '';
  if (!ct.includes('application/json')) throw new Error('Sunucu yanıtı geçerli JSON değil.');
  const body = await res.json();
  if (!res.ok) {
    const err = new Error(body.message || 'Sunucu işlemi reddetti.');
    err.code = body.code || 'HTTP_ERROR';
    throw err;
  }
  return body;
}

function openIdb() {
  if (_idbHandle) return Promise.resolve(_idbHandle);
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined' || !indexedDB?.open) {
      reject(new Error('IndexedDB bu ortamda desteklenmiyor.'));
      return;
    }
    let req;
    try {
      req = indexedDB.open(IDB_NAME, IDB_VERSION);
    } catch (err) {
      reject(err);
      return;
    }
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('snapshots')) {
        db.createObjectStore('snapshots', { keyPath: 'key' });
      }
      if (!db.objectStoreNames.contains('checkpoints')) {
        db.createObjectStore('checkpoints', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => {
      const db = req.result;
      db.onversionchange = () => {
        db.close();
        _idbHandle = null;
      };
      _idbHandle = db;
      resolve(db);
    };
    req.onerror = () => reject(req.error || new Error('IndexedDB açılamadı.'));
    req.onblocked = () => reject(new Error('IndexedDB başka bir sekme tarafından kilitlenmiş.'));
  });
}

function idbReadRecord(db, storeName, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction([storeName], 'readonly');
    const req = tx.objectStore(storeName).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error || new Error('Okuma hatası.'));
  });
}

function idbListCheckpoints(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(['checkpoints'], 'readonly');
    const req = tx.objectStore('checkpoints').getAll();
    req.onsuccess = () => resolve((req.result || []).sort((a, b) => b.savedAt.localeCompare(a.savedAt)));
    req.onerror = () => reject(req.error || new Error('Yedek noktaları okunamadı.'));
  });
}

function idbWriteSnapshotAtomic(db, stateObj, checkpointNote = '') {
  const raw = JSON.stringify(stateObj);
  const checksum = sha256Hex(raw);
  const nowIso = new Date().toISOString();
  const dayKey = 'cp_daily_' + nowIso.slice(0, 10);

  return new Promise((resolve, reject) => {
    const tx = db.transaction(['snapshots', 'checkpoints'], 'readwrite');
    tx.objectStore('snapshots').put({
      key: SNAPSHOT_KEY,
      revision: stateObj.revision,
      instanceId: stateObj.instanceId,
      checksum,
      updatedAt: nowIso,
      payload: raw
    });
    tx.objectStore('checkpoints').put({
      id: 'cp_latest',
      label: checkpointNote || `Son işlem noktası (Rev #${stateObj.revision})`,
      revision: stateObj.revision,
      checksum,
      savedAt: nowIso,
      payload: raw
    });
    tx.objectStore('checkpoints').put({
      id: dayKey,
      label: `Günlük otomatik kontrol noktası (${nowIso.slice(0, 10)})`,
      revision: stateObj.revision,
      checksum,
      savedAt: nowIso,
      payload: raw
    });
    tx.oncomplete = () => resolve({ checksum, updatedAt: nowIso });
    tx.onerror = () => reject(tx.error || new Error('Atomik IndexedDB yazma işlemi başarısız oldu; önceki veri korundu.'));
    tx.onabort = () => reject(tx.error || new Error('İşlem iptal edildi (transaction abort); yarım kayıt bırakılmadı.'));
  });
}

async function initStorage() {
  setupBroadcast();
  if (typeof window !== 'undefined' && window.__HH_P2_API__) {
    const data = await p2Request('/state');
    validateState(data.state);
    _storageMode = 'P2_SQLITE';
    return data.state;
  }

  try {
    const db = await openIdb();
    const rec = await idbReadRecord(db, 'snapshots', SNAPSHOT_KEY);
    const meta = await idbReadRecord(db, 'meta', 'external_backup');
    _lastExternalBackupRev = meta?.revision || 0;

    if (!rec) {
      const isClean = typeof localStorage !== 'undefined' && localStorage.getItem('koklu_manual_clean') === '1';
      const initial = isClean ? newState() : buildDefaultSeedState();
      await idbWriteSnapshotAtomic(db, initial, 'İlk kurulum');
      const verify = await idbReadRecord(db, 'snapshots', SNAPSHOT_KEY);
      if (!verify || sha256Hex(verify.payload) !== verify.checksum) {
        throw new Error('İlk kurulum readback doğrulaması başarısız.');
      }
      _storageMode = 'INDEXED_DB';
      return initial;
    }

    if (sha256Hex(rec.payload) !== rec.checksum) {
      throw new Error('IndexedDB veri bütünlük özeti (SHA-256) uyuşmuyor; bozuk veri engellendi.');
    }
    const parsed = sanitizeAndValidateSnapshot(JSON.parse(rec.payload));
    _storageMode = 'INDEXED_DB';
    return parsed;
  } catch (err) {
    // Kısıtlı önizleme iframe (Canvas vb.) için açık uyarılı izole bellek modu (ASLA localStorage kullanmaz!)
    _memoryState = newState();
    _memoryBackups = [{
      id: 'cp_init',
      label: 'Oturum başlangıcı',
      revision: 0,
      checksum: sha256Hex(JSON.stringify(_memoryState)),
      savedAt: new Date().toISOString(),
      payload: JSON.stringify(_memoryState)
    }];
    _storageMode = 'SANDBOX_MEMORY';
    return _memoryState;
  }
}

async function readCurrentState() {
  if (_storageMode === 'P2_SQLITE') {
    const data = await p2Request('/state');
    validateState(data.state);
    return data.state;
  }
  if (_storageMode === 'INDEXED_DB') {
    const db = await openIdb();
    const rec = await idbReadRecord(db, 'snapshots', SNAPSHOT_KEY);
    if (!rec) throw new Error('Aktif veritabanı kaydı bulunamadı.');
    if (sha256Hex(rec.payload) !== rec.checksum) throw new Error('Veri bütünlük doğrulaması başarısız.');
    return sanitizeAndValidateSnapshot(JSON.parse(rec.payload));
  }
  return structuredClone(_memoryState);
}

async function commitCommand(command) {
  if (_storageMode === 'P2_SQLITE') {
    if (!_csrfToken) await p2Request('/state');
    const res = await p2Request('/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-HH-CSRF': _csrfToken },
      body: JSON.stringify(command)
    });
    validateState(res.state);
    notifyBroadcast(res.state.revision);
    return { state: res.state, duplicate: !!res.duplicate };
  }

  if (_storageMode === 'INDEXED_DB') {
    const db = await openIdb();
    const latest = await readCurrentState();
    const result = execute(latest, command);
    if (!result.duplicate) {
      await idbWriteSnapshotAtomic(db, result.state);
      const readback = await readCurrentState();
      if (readback.revision !== result.state.revision) {
        throw new Error('READBACK_HATA: Yazılan revizyon okunanla eşleşmedi.');
      }
      notifyBroadcast(readback.revision);
      return { state: readback, duplicate: false };
    }
    return { state: latest, duplicate: true };
  }

  // SANDBOX_MEMORY modu
  const result = execute(_memoryState, command);
  if (!result.duplicate) {
    _memoryState = result.state;
    const raw = JSON.stringify(_memoryState);
    _memoryBackups.unshift({
      id: 'cp_' + _memoryState.revision,
      label: `Kontrol noktası (Rev #${_memoryState.revision})`,
      revision: _memoryState.revision,
      checksum: sha256Hex(raw),
      savedAt: new Date().toISOString(),
      payload: raw
    });
    _memoryBackups = _memoryBackups.slice(0, 15);
  }
  return { state: structuredClone(_memoryState), duplicate: result.duplicate };
}

async function listInternalCheckpoints() {
  if (_storageMode === 'INDEXED_DB') {
    const db = await openIdb();
    return idbListCheckpoints(db);
  }
  if (_storageMode === 'SANDBOX_MEMORY') {
    return _memoryBackups;
  }
  return [];
}

function createBackupEnvelope(stateObj) {
  const clean = sanitizeAndValidateSnapshot(stateObj);
  const canonical = JSON.stringify(clean);
  const sha256 = sha256Hex(canonical);
  return {
    format: BACKUP_FORMAT,
    appName: 'Köklü Agro Pro+',
    appVersion: APP_VERSION,
    schemaVersion: SCHEMA_VERSION,
    instanceId: clean.instanceId,
    company: clean.company,
    revision: clean.revision,
    exportedAt: new Date().toISOString(),
    sha256,
    snapshot: clean
  };
}

async function markExternalBackupCompleted(revision) {
  _lastExternalBackupRev = revision;
  if (_storageMode === 'INDEXED_DB') {
    try {
      const db = await openIdb();
      await new Promise((resolve) => {
        const tx = db.transaction(['meta'], 'readwrite');
        tx.objectStore('meta').put({ key: 'external_backup', revision, at: new Date().toISOString() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
      });
    } catch {
      // Meta kayıt hatası ticari veriyi etkilemez
    }
  }
}

function verifyBackupEnvelopeText(jsonText, expectedInstanceId = null) {
  assert(typeof jsonText === 'string' && jsonText.length > 2 && jsonText.length < 32 * 1024 * 1024, 'YEDEK_BOYUT', 'Yedek dosyası boş veya boyut sınırını aşıyor.');
  assert(!jsonText.includes('"__proto__"') && !jsonText.includes('"constructor"'), 'GUVENLIK_REDDI', 'Dosyada izin verilmeyen prototip anahtarı var.');
  let parsed;
  try {
    parsed = JSON.parse(jsonText);
  } catch {
    throw new DomainError('JSON_BOZUK', 'Yedek dosyası geçerli bir JSON yapısında değil (kesilmiş veya bozulmuş dosya).');
  }

  assert(parsed && typeof parsed === 'object' && parsed.format === BACKUP_FORMAT, 'ZARF_FORMATI', 'Bu dosya geçerli bir Köklü Agro Pro+ yedek zarfı (HH-AGRO-BACKUP-V2) değil.');
  assert(parsed.schemaVersion === SCHEMA_VERSION, 'SEMA_FARKLI', `Yedek şema sürümü (${parsed.schemaVersion}) desteklenmiyor.`);
  if (expectedInstanceId && parsed.instanceId !== expectedInstanceId) {
    throw new DomainError('FARKLI_ISLETME', `Yedek başka bir işletme kimliğine (${parsed.instanceId}) ait. Yanlış şirket verisi engellendi.`);
  }
  assert(parsed.snapshot && typeof parsed.snapshot === 'object', 'SNAPSHOT_YOK', 'Yedek zarfında veri gövdesi bulunamadı.');

  const computedHash = sha256Hex(JSON.stringify(parsed.snapshot));
  assert(computedHash === parsed.sha256, 'HASH_UYUMSUZ', 'Yedek dosyasının SHA-256 bütünlük özeti bozulmuş; geri yükleme reddedildi.');

  const clean = sanitizeAndValidateSnapshot(parsed.snapshot);
  assert(clean.revision === parsed.revision && clean.instanceId === parsed.instanceId, 'META_UYUMSUZ', 'Zarf üstverisi ile veri içeriği uyuşmuyor.');
  return clean;
}

async function restoreVerifiedSnapshot(cleanSnapshot) {
  if (_storageMode === 'P2_SQLITE') {
    throw new DomainError('P2_KORUMA', 'P2 SQLite sunucu modunda tarayıcıdan canlı veritabanı ezilemez; sunucu kurtarma aracını kullanın.');
  }
  validateState(cleanSnapshot);
  if (_storageMode === 'INDEXED_DB') {
    const db = await openIdb();
    const current = await readCurrentState();
    // Geri yüklemeden hemen önce mevcut veriyi kurtarma noktasına al (HH-095)
    await idbWriteSnapshotAtomic(db, current, `Geri yükleme öncesi güvenlik yedeği (Rev #${current.revision})`);
    await idbWriteSnapshotAtomic(db, cleanSnapshot, `Dış yedekten geri yüklendi (Rev #${cleanSnapshot.revision})`);
    const readback = await readCurrentState();
    notifyBroadcast(readback.revision);
    return readback;
  }
  _memoryState = structuredClone(cleanSnapshot);
  return structuredClone(_memoryState);
}

function istToday() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/Istanbul',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(new Date());
}

function addDaysIso(baseIso, days) {
  const base = baseIso && /^\d{4}-\d{2}-\d{2}$/.test(baseIso) ? baseIso : istToday();
  const ms = Date.parse(base + 'T00:00:00Z') + days * 86400000;
  return new Date(ms).toISOString().slice(0, 10);
}

function istNowText() {
  return new Intl.DateTimeFormat('tr-TR', {
    timeZone: 'Europe/Istanbul',
    dateStyle: 'medium',
    timeStyle: 'short'
  }).format(new Date());
}

function fmtDateTr(iso) {
  if (!iso) return '—';
  const parts = String(iso).slice(0, 10).split('-');
  return parts.length === 3 ? `${parts[2]}.${parts[1]}.${parts[0]}` : iso;
}

function newCmdId(prefix = 'cmd') {
  const arr = new Uint8Array(10);
  if (typeof crypto !== 'undefined' && crypto.getRandomValues) {
    crypto.getRandomValues(arr);
  } else {
    for (let i = 0; i < arr.length; i++) arr[i] = Math.floor(Date.now() + i * 37) & 0xff;
  }
  return `${prefix}_${Array.from(arr).map((b) => b.toString(16).padStart(2, '0')).join('')}`;
}

function iconEl(name, size = 18) {
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('aria-hidden', 'true');
  for (const [tag, attrs] of ICONS[name] || ICONS.reports) {
    const child = document.createElementNS(SVG_NS, tag);
    for (const [k, v] of Object.entries(attrs)) child.setAttribute(k, String(v));
    svg.appendChild(child);
  }
  return svg;
}

function h(tag, attrs = null, ...children) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'className') el.className = v;
      else if (k === 'dataset' && typeof v === 'object') {
        for (const [dk, dv] of Object.entries(v)) el.dataset[dk] = String(dv);
      } else if (k.startsWith('on') && typeof v === 'function') {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (v === true) {
        el.setAttribute(k, '');
      } else {
        el.setAttribute(k, String(v));
      }
    }
  }
  const append = (child) => {
    if (child === null || child === undefined || child === false) return;
    if (Array.isArray(child)) child.forEach(append);
    else if (child instanceof Node) el.appendChild(child);
    else el.appendChild(document.createTextNode(String(child)));
  };
  children.forEach(append);
  return el;
}

function clearNode(node) {
  while (node && node.firstChild) node.removeChild(node.firstChild);
}

function showToast(msg, kind = 'ok') {
  const stack = document.getElementById('toastStack');
  if (!stack) return;
  const item = h('div', { className: `toast ${kind === 'error' ? 'error' : ''}` }, msg);
  stack.appendChild(item);
  setTimeout(() => {
    if (item.parentNode) item.parentNode.removeChild(item);
  }, 4200);
}

let _lastFocusedEl = null;

function openModal(title, contentNode, { narrow = false, trackDirty = false } = {}) {
  _lastFocusedEl = document.activeElement;
  appState.modalDirty = false;
  const overlay = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  const titleEl = document.getElementById('modalTitle');
  const bodyEl = document.getElementById('modalBody');

  card.className = narrow ? 'modal-card narrow' : 'modal-card';
  titleEl.textContent = title;
  clearNode(bodyEl);
  bodyEl.appendChild(contentNode);

  if (trackDirty) {
    bodyEl.addEventListener('input', () => {
      appState.modalDirty = true;
    }, { once: true });
  }

  overlay.classList.add('open');
  const firstInput = bodyEl.querySelector('input:not([readonly]), select, textarea, button.primary');
  if (firstInput) setTimeout(() => firstInput.focus(), 20);
}

function closeModal(force = false) {
  const overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('open')) return;
  if (!force && appState.modalDirty) {
    const bodyEl = document.getElementById('modalBody');
    if (!bodyEl.querySelector('.unsaved-guard')) {
      const guard = h('div', { className: 'status-strip warn unsaved-guard' },
        h('span', null, 'Kaydedilmemiş bilgiler var. Çıkılsın mı?'),
        h('div', { style: 'display:flex;gap:6px' },
          h('button', { type: 'button', className: 'btn sm danger', onClick: () => closeModal(true) }, 'Vazgeç ve Kapat'),
          h('button', { type: 'button', className: 'btn sm', onClick: () => guard.remove() }, 'Forma Dön')
        )
      );
      bodyEl.prepend(guard);
      return;
    }
  }
  appState.modalDirty = false;
  overlay.classList.remove('open');
  clearNode(document.getElementById('modalBody'));
  if (_lastFocusedEl && typeof _lastFocusedEl.focus === 'function') _lastFocusedEl.focus();
}

async function runCommand(type, data, preGeneratedCmdId = null) {
  const opId = appState.activeUserId || 'usr_merkez';
  const opUser = SYSTEM_USERS.find((u) => u.id === opId) || SYSTEM_USERS[0];
  if (!data.operatorId) data.operatorId = opId;
  if (!data.operatorName) data.operatorName = opUser.name;
  const cmd = {
    id: preGeneratedCmdId || newCmdId('cmd'),
    type,
    data,
    at: new Date().toISOString(),
    expectedRevision: appState.data.revision
  };
  try {
    const res = await commitCommand(cmd);
    appState.data = res.state;
    if (appState.page === 'system') appState.checkpoints = await listInternalCheckpoints();
    renderApp();
    showToast(res.duplicate ? 'İşlem zaten kayıtlı.' : `Kaydedildi ve doğrulandı (Rev #${res.state.revision})`);
    return res.state;
  } catch (err) {
    if (err?.code === 'CONFLICT') {
      appState.data = await readCurrentState().catch(() => appState.data);
      renderApp();
    }
    throw err;
  }
}

function safeCsvCell(val) {
  let s = String(val ?? '').replace(/\r?\n/g, ' ');
  if (/^[=+\-@\t]/.test(s) && !/^-[0-9]+(?:,[0-9]+)?(?:\s*₺|\s*kg)?$/.test(s)) s = "'" + s;
  return s.includes(';') || s.includes('"') ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadBlob(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function exportCsvRows(filenameStem, headers, rows) {
  if (!rows.length) {
    showToast('Dışa aktarılacak kayıt yok.', 'error');
    return;
  }
  const lines = [headers.map(safeCsvCell).join(';'), ...rows.map((r) => r.map(safeCsvCell).join(';'))];
  downloadBlob('\uFEFF' + lines.join('\r\n'), `${filenameStem}-${istToday()}.csv`, 'text/csv;charset=utf-8');
  showToast(`${rows.length} satır CSV indirildi.`);
}

function pageHead(title, shortHint, ...buttons) {
  return h('div', { className: 'page-head' },
    h('div', null,
      h('h1', null, title),
      shortHint ? h('p', null, shortHint) : null
    ),
    buttons.length ? h('div', { className: 'head-actions' }, ...buttons) : null
  );
}

function statCard(label, value, toneClass = '', subText = '') {
  return h('div', { className: 'stat-card' },
    h('span', null, label),
    h('strong', { className: toneClass }, value),
    subText ? h('small', null, subText) : null
  );
}

function renderDataTable({ columns, rows, emptyTitle = 'Henüz kayıt yok', emptyAction = null, paginate = true }) {
  if (!rows.length) {
    return h('div', { className: 'empty-box' },
      h('strong', null, emptyTitle),
      emptyAction ? h('div', { style: 'margin-top:10px' }, emptyAction) : null
    );
  }

  const total = rows.length;
  const totalPages = paginate ? Math.max(1, Math.ceil(total / PAGE_SIZE)) : 1;
  if (appState.tablePage > totalPages) appState.tablePage = totalPages;
  const startIdx = paginate ? (appState.tablePage - 1) * PAGE_SIZE : 0;
  const slice = paginate ? rows.slice(startIdx, startIdx + PAGE_SIZE) : rows;

  const thead = h('thead', null,
    h('tr', null, ...columns.map((c) => h('th', { className: c.numeric ? 'num' : '' }, c.header)))
  );

  const tbody = h('tbody', null,
    ...slice.map((row) =>
      h('tr', null,
        ...columns.map((c) => h('td', { className: c.numeric ? 'num' : '', dataset: { label: c.header } }, c.render(row)))
      )
    )
  );

  const pager = paginate && total > PAGE_SIZE
    ? h('div', { className: 'pager-bar' },
        h('span', null, `${startIdx + 1}–${Math.min(total, startIdx + PAGE_SIZE)} / ${total}`),
        h('div', { style: 'display:flex;gap:6px' },
          h('button', { type: 'button', className: 'btn sm', disabled: appState.tablePage <= 1, onClick: () => { appState.tablePage -= 1; renderApp(); } }, '← Önceki'),
          h('button', { type: 'button', className: 'btn sm', disabled: appState.tablePage >= totalPages, onClick: () => { appState.tablePage += 1; renderApp(); } }, 'Sonraki →')
        )
      )
    : null;

  return h('div', { className: 'table-wrap' },
    h('table', { className: 'tbl' }, thead, tbody),
    pager
  );
}

function renderContextHelp(page) {
  const items = PAGE_HELP[page] || PAGE_HELP.dashboard;
  return h('details', { className: 'context-help' },
    h('summary', null,
      h('span', null, 'Bu Ekran Nasıl Kullanılır?'),
      h('span', { className: 'badge blue' }, 'Yardımı Aç')
    ),
    h('div', { className: 'help-grid' },
      h('div', null, h('b', null, '1. Nasıl işlem yapılır?'), h('p', null, items[0])),
      h('div', null, h('b', null, '2. Bir şey yanlış olursa?'), h('p', null, items[1])),
      h('div', null, h('b', null, '3. Kontrol ve güvenlik'), h('p', null, items[2]))
    )
  );
}

function formField(labelNode, inputEl, { full = false, span2 = false, chips = null } = {}) {
  return h('div', { className: `form-field ${full ? 'full' : ''} ${span2 ? 'span-2' : ''}` },
    h('label', null, labelNode),
    inputEl,
    chips
  );
}

/* ============================================================================
 * 1. GENİŞLETİLMİŞ PROFESYONEL ZAHİRE MAL ALIŞI MODALI (Müstahsil + Faturalı Alış)
 * ============================================================================ */
function openPurchaseFormModal(presetWeigh = null) {
  const st = appState.data;
  const activeParties = st.parties.filter((p) => p.active);
  const openWeighs = st.weighs.filter((w) => w.status === 'open');

  let docSubType = 'Müstahsil Makbuzu';
  let useInlineParty = activeParties.length === 0;

  const btnMustahsil = h('button', { type: 'button', className: 'mode-btn green active' }, iconEl('arrowDown', 16), 'Müstahsil Makbuzu ile Alış (Çiftçiden)');
  const btnFaturali = h('button', { type: 'button', className: 'mode-btn blue' }, iconEl('reports', 16), 'Ticari Faturalı Mal Alışı (Tüccardan / KDV’li)');

  const partySel = h('select', null,
    ...activeParties.map((p) => h('option', { value: p.id, selected: presetWeigh?.partyId === p.id }, `${p.code} · ${p.name} (${p.role})`))
  );
  const toggleInlineBtn = h('button', { type: 'button', className: 'chip-btn' }, useInlineParty ? 'Kayıtlı Carilerden Seç' : '+ Yeni Cari Yazarak Aç');

  const inlineNameIn = h('input', { type: 'text', maxLength: 120, placeholder: 'Yeni Müstahsil / Tedarikçi Adı Soyadı veya Unvanı *' });
  const inlinePhoneIn = h('input', { type: 'text', maxLength: 30, placeholder: 'Telefon (05xx...)' });
  const inlineTcknIn = h('input', { type: 'text', maxLength: 20, placeholder: 'TCKN (11 hane) veya VKN' });
  const inlineBox = h('div', { className: `inline-party-box ${useInlineParty ? '' : 'hide'}` },
    h('div', { style: 'font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:8px' }, 'Formdan Çıkmadan Hızlı Yeni Cari Kart (Alışla Birlikte Otomatik Açılır)'),
    h('div', { className: 'form-grid-3' },
      formField('Cari Adı / Unvanı *', inlineNameIn),
      formField('Telefon', inlinePhoneIn),
      formField('TCKN / VKN', inlineTcknIn)
    )
  );

  const weighSel = h('select', null,
    h('option', { value: '' }, '— Kantar Fişi Bağlama (Manuel Tartım / Miktar) —'),
    ...openWeighs.map((w) => {
      const pName = st.products.find((p) => p.id === w.productId)?.name || '';
      return h('option', { value: w.id, selected: presetWeigh?.id === w.id }, `#${w.ticketNo} · ${w.plate} · Net ${formatQtyGrams(w.netGrams, true)} ${pName}`);
    })
  );

  const dateIn = h('input', { type: 'date', required: true, value: presetWeigh?.date || istToday() });
  const dueIn = h('input', { type: 'date', required: true, value: presetWeigh?.date || istToday() });
  const docNoIn = h('input', { type: 'text', maxLength: 32, placeholder: 'Otomatik (AL-00001)' });
  const waybillIn = h('input', { type: 'text', maxLength: 40, placeholder: 'İrsaliye / Borsa Tescil No' });
  const plateIn = h('input', { type: 'text', maxLength: 24, value: presetWeigh?.plate || '', placeholder: '35 ABC 123' });
  const driverIn = h('input', { type: 'text', maxLength: 80, value: presetWeigh?.driverName || '', placeholder: 'Şoför / Nakliyeci Adı' });

  const whSel = h('select', { required: true },
    ...st.warehouses.map((w) => h('option', { value: w.id, selected: presetWeigh?.warehouseId === w.id }, `${w.code} · ${w.name}`))
  );
  const productSel = h('select', { required: true },
    ...st.products.filter((x) => x.active).map((p) => h('option', { value: p.id, selected: presetWeigh?.productId === p.id }, `${p.sku} · ${p.name}`))
  );

  const subProductSel = h('select', null);
  const refreshSubProducts = () => {
    clearNode(subProductSel);
    const p = st.products.find((x) => x.id === productSel.value);
    const subs = (p && p.subProducts && p.subProducts.length > 0) ? p.subProducts : [];
    subProductSel.appendChild(h('option', { value: '' }, '— Standart / Genel Alt Kırılım —'));
    subs.forEach((s) => {
      subProductSel.appendChild(h('option', {
        value: s.id,
        selected: presetWeigh?.subProductId === s.id,
        dataset: { buyPrice: s.buyPriceTl || '', sellPrice: s.sellPriceTl || '' }
      }, `${s.name} ${s.buyPriceTl ? `· Alış: ${s.buyPriceTl} ₺` : ''}`));
    });
  };
  productSel.addEventListener('change', () => {
    refreshSubProducts();
  });
  subProductSel.addEventListener('change', () => {
    const opt = subProductSel.selectedOptions[0];
    if (opt && opt.dataset.buyPrice && opt.dataset.buyPrice !== '0,00' && opt.dataset.buyPrice !== '') {
      unitPriceIn.value = opt.dataset.buyPrice;
      recalc();
    }
  });
  refreshSubProducts();

  const qtyIn = h('input', {
    type: 'text',
    inputMode: 'decimal',
    required: true,
    value: presetWeigh ? formatQtyGrams(presetWeigh.netGrams, false) : '',
    placeholder: 'Örn. 25.000'
  });
  const fireIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0' });
  const netSafiOut = h('input', { type: 'text', readonly: true, value: '0 kg' });
  const moistIn = h('input', { type: 'text', inputMode: 'decimal', value: presetWeigh ? formatBps(presetWeigh.moistureBps).replace('%', '') : '0', placeholder: 'Örn. 13,5' });
  const foreignIn = h('input', { type: 'text', inputMode: 'decimal', value: presetWeigh ? formatBps(presetWeigh.foreignBps).replace('%', '') : '0', placeholder: 'Örn. 1,2' });

  const unitPriceIn = h('input', { type: 'text', inputMode: 'decimal', required: true, placeholder: 'Örn. 10,50 veya 9,825' });
  const grossManualIn = h('input', { type: 'text', inputMode: 'decimal', placeholder: 'Birim fiyattan otomatik (veya toplam yazın)' });
  const discIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0' });

  // Müstahsil Kesintileri
  const stopajIn = h('input', { type: 'text', inputMode: 'decimal', value: '2', placeholder: '2' });
  const bagkurIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0' });

  // Faturalı Alış KDV & Tevkifat
  const vatIn = h('input', { type: 'text', inputMode: 'decimal', value: '1', placeholder: '1' });
  const withholdSel = h('select', null,
    h('option', { value: 'YOK' }, 'Tevkifat Yok'),
    h('option', { value: '5/10' }, '5/10 KDV Tevkifatı'),
    h('option', { value: '7/10' }, '7/10 KDV Tevkifatı'),
    h('option', { value: '9/10' }, '9/10 KDV Tevkifatı')
  );

  // Ek Stok Maliyeti & Anında Peşin Ödeme
  const expIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0,00' });
  const expAccSel = h('select', null,
    h('option', { value: '' }, '— Ek nakliye ödemesi yok —'),
    ...st.accounts.map((a) => h('option', { value: a.id }, `${a.name} (${formatMoneyMinor(accountBalanceMinor(st, a.id))})`))
  );

  const instantPaidIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0,00 (Vadeli ise 0 bırakın)' });
  const instantAccSel = h('select', null,
    ...st.accounts.map((a) => h('option', { value: a.id }, `${a.name} (Bakiye: ${formatMoneyMinor(accountBalanceMinor(st, a.id))})`))
  );
  const noteIn = h('input', { type: 'text', maxLength: 220, placeholder: 'Kalite, parsel, analiz veya sözleşme notu' });

  const applyFirePct = (pct) => {
    try {
      const rawG = parseQtyGrams(qtyIn.value, 'Miktar');
      const fireG = divRoundHalfAway(BigInt(rawG) * BigInt(Math.round(pct * 100)), 10000n);
      fireIn.value = formatQtyGrams(fireG.toString(), false);
      recalc();
    } catch { /* Miktar henüz girilmediyse sessiz geç */ }
  };

  const fireChips = h('div', { className: 'quick-chips' },
    ...[['Fire Yok', 0], ['%1 Fire', 1], ['%2 Fire', 2], ['%3 Fire', 3]].map(([lbl, pct]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => applyFirePct(pct) }, lbl)
    )
  );

  const dueChips = h('div', { className: 'quick-chips' },
    ...[['Peşin / Bugün', 0], ['+7 Gün', 7], ['+15 Gün', 15], ['+30 Gün', 30], ['+45 Gün', 45], ['+60 Gün', 60]].map(([lbl, d]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { dueIn.value = addDaysIso(dateIn.value, d); } }, lbl)
    )
  );

  const stopajChips = h('div', { className: 'quick-chips' },
    ...[['Borsa Tescilli (%1)', '1'], ['Standart (%2)', '2'], ['Muaf (%0)', '0'], ['%4', '4']].map(([lbl, v]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { stopajIn.value = v; recalc(); } }, lbl)
    )
  );

  const bagkurChips = h('div', { className: 'quick-chips' },
    ...[['Yok (%0)', '0'], ['Borsa (%0,2)', '0,2'], ['Bağ-Kur (%1)', '1'], ['Bağ-Kur (%2)', '2']].map(([lbl, v]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { bagkurIn.value = v; recalc(); } }, lbl)
    )
  );

  const vatChips = h('div', { className: 'quick-chips' },
    ...[['%0', '0'], ['%1 Hububat', '1'], ['%10 Yem/Bakliyat', '10'], ['%20', '20']].map(([lbl, v]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { vatIn.value = v; recalc(); } }, lbl)
    )
  );

  const mustahsilRow = h('div', { className: 'form-grid', style: 'grid-column: 1 / -1' },
    formField('Müstahsil Gelir Vergisi Stopajı (%)', stopajIn, { chips: stopajChips }),
    formField('Borsa Tescil / Bağ-Kur / Fon Kesintisi (%)', bagkurIn, { chips: bagkurChips })
  );

  const faturaliRow = h('div', { className: 'form-grid hide', style: 'grid-column: 1 / -1' },
    formField('Alış KDV Oranı (%)', vatIn, { chips: vatChips }),
    formField('KDV Tevkifat Oranı', withholdSel)
  );

  let currentPayableMinor = '0';
  const paidChips = h('div', { className: 'quick-chips' },
    h('button', { type: 'button', className: 'chip-btn', onClick: () => { instantPaidIn.value = '0'; recalc(); } }, 'Tamamı Vadeli (0 ₺)'),
    h('button', {
      type: 'button',
      className: 'chip-btn',
      onClick: () => {
        const half = divRoundHalfAway(BigInt(currentPayableMinor), 2n);
        instantPaidIn.value = formatMoneyMinor(half.toString(), false);
        recalc();
      }
    }, '%50 Peşin Ver'),
    h('button', {
      type: 'button',
      className: 'chip-btn',
      onClick: () => {
        instantPaidIn.value = formatMoneyMinor(currentPayableMinor, false);
        recalc();
      }
    }, 'Tamamını Peşin Öde')
  );

  const pSafiKg = h('strong', null, '0 kg');
  const pGross = h('strong', null, '0,00 ₺');
  const pCutOrVatLabel = h('span', null, 'Stopaj + Borsa Kesintisi');
  const pCutOrVat = h('strong', null, '0,00 ₺');
  const pNetPayable = h('strong', { className: 'text-good' }, '0,00 ₺');
  const pInstantPaid = h('strong', null, '0,00 ₺');
  const pRemainingDebt = h('strong', { className: 'text-bad' }, '0,00 ₺');

  const recalc = (fromGrossInput = false) => {
    const isMustahsil = docSubType === 'Müstahsil Makbuzu';
    btnMustahsil.classList.toggle('active', isMustahsil);
    btnFaturali.classList.toggle('active', !isMustahsil);
    mustahsilRow.classList.toggle('hide', !isMustahsil);
    faturaliRow.classList.toggle('hide', isMustahsil);
    pCutOrVatLabel.textContent = isMustahsil ? 'Stopaj + Borsa/Bağ-Kur Kesintisi' : 'Ödenecek Alış KDV';

    try {
      const rawG = parseQtyGrams(qtyIn.value, 'Miktar');
      const fireG = parseOptionalQtyGrams(fireIn.value, 'Fire');
      const safiG = BigInt(rawG) - BigInt(fireG);
      if (safiG <= 0n) throw new Error('Net kg > 0 olmalı');
      netSafiOut.value = formatQtyGrams(safiG.toString(), true);
      pSafiKg.textContent = formatQtyGrams(safiG.toString(), true);

      if (fromGrossInput && grossManualIn.value.trim()) {
        const gMinor = parseMoneyMinor(grossManualIn.value, 'Brüt tutar');
        const computedUnitMicro = divRoundHalfAway(BigInt(gMinor) * 100_000n, safiG);
        unitPriceIn.value = formatUnitPriceMicro(computedUnitMicro.toString()).replace(' ₺', '');
      }

      const uMicro = parseUnitPriceMicro(unitPriceIn.value, 'Birim fiyat');
      const gross = calcLineGrossMinor(safiG.toString(), uMicro);
      if (!fromGrossInput) grossManualIn.value = formatMoneyMinor(gross, false);

      const discBps = parseRateBps(discIn.value || '0', 'İskonto');
      const disc = calcBpsAmountMinor(gross, discBps);
      const netGoods = (BigInt(gross) - BigInt(disc)).toString();
      pGross.textContent = formatMoneyMinor(netGoods);

      let payable = BigInt(netGoods);
      if (isMustahsil) {
        const stp = BigInt(calcBpsAmountMinor(netGoods, parseRateBps(stopajIn.value || '0', 'Stopaj', 5000n)));
        const bgk = BigInt(calcBpsAmountMinor(netGoods, parseRateBps(bagkurIn.value || '0', 'Bağkur', 5000n)));
        pCutOrVat.textContent = `− ${formatMoneyMinor((stp + bgk).toString())}`;
        payable = BigInt(netGoods) - stp - bgk;
      } else {
        const vat = BigInt(calcBpsAmountMinor(netGoods, parseRateBps(vatIn.value || '0', 'KDV')));
        const withheld = BigInt(calcWithheldVatMinor(vat.toString(), withholdSel.value));
        const payVat = vat - withheld;
        pCutOrVat.textContent = `+ ${formatMoneyMinor(payVat.toString())}`;
        payable = BigInt(netGoods) + payVat;
      }

      currentPayableMinor = payable > 0n ? payable.toString() : '0';
      pNetPayable.textContent = formatMoneyMinor(currentPayableMinor);

      const instPaid = BigInt(parseOptionalMoneyMinor(instantPaidIn.value, 'Peşin'));
      pInstantPaid.textContent = formatMoneyMinor(instPaid.toString());
      const rem = payable - instPaid;
      pRemainingDebt.textContent = formatMoneyMinor((rem > 0n ? rem : 0n).toString());
    } catch {
      pSafiKg.textContent = '—';
      pGross.textContent = '0,00 ₺';
      pCutOrVat.textContent = '0,00 ₺';
      pNetPayable.textContent = '0,00 ₺';
      pInstantPaid.textContent = '0,00 ₺';
      pRemainingDebt.textContent = '0,00 ₺';
    }
  };

  btnMustahsil.addEventListener('click', () => { docSubType = 'Müstahsil Makbuzu'; recalc(); });
  btnFaturali.addEventListener('click', () => { docSubType = 'Ticari Alış Faturası'; recalc(); });

  toggleInlineBtn.addEventListener('click', () => {
    useInlineParty = !useInlineParty;
    inlineBox.classList.toggle('hide', !useInlineParty);
    partySel.disabled = useInlineParty;
    toggleInlineBtn.textContent = useInlineParty ? 'Kayıtlı Carilerden Seç' : '+ Yeni Cari Yazarak Aç';
  });
  partySel.disabled = useInlineParty;

  weighSel.addEventListener('change', () => {
    const w = openWeighs.find((x) => x.id === weighSel.value);
    if (w) {
      whSel.value = w.warehouseId;
      productSel.value = w.productId;
      if (w.partyId && !useInlineParty) partySel.value = w.partyId;
      plateIn.value = w.plate;
      driverIn.value = w.driverName || '';
      qtyIn.value = formatQtyGrams(w.netGrams, false);
      moistIn.value = formatBps(w.moistureBps).replace('%', '');
      foreignIn.value = formatBps(w.foreignBps).replace('%', '');
      recalc();
    }
  });

  [qtyIn, fireIn, unitPriceIn, discIn, stopajIn, bagkurIn, vatIn, instantPaidIn].forEach((el) => el.addEventListener('input', () => recalc(false)));
  grossManualIn.addEventListener('input', () => recalc(true));
  withholdSel.addEventListener('change', () => recalc(false));
  recalc(false);

  const errBox = h('div', { className: 'status-strip warn hide' });
  const cmdId = newCmdId('cmd');

  const cariLabel = h('span', { style: 'display:flex;justify-content:space-between;width:100%;align-items:center' },
    h('span', null, 'Müstahsil / Tedarikçi Cari *'),
    activeParties.length > 0 ? toggleInlineBtn : null
  );

  const form = h('form', {
    onSubmit: async (e) => {
      e.preventDefault();
      errBox.classList.add('hide');
      try {
        const cleanTaxOrTckn = inlineTcknIn.value.trim();
        await runCommand('trade.purchase', {
          docSubType,
          date: dateIn.value,
          dueDate: dueIn.value,
          docNo: docNoIn.value,
          waybillNo: waybillIn.value,
          plate: plateIn.value,
          driverName: driverIn.value,
          partyId: useInlineParty ? '' : partySel.value,
          inlinePartyName: useInlineParty ? inlineNameIn.value : '',
          inlinePartyRole: docSubType === 'Müstahsil Makbuzu' ? 'Müstahsil' : 'Tedarikçi',
          inlinePartyPhone: useInlineParty ? inlinePhoneIn.value : '',
          inlinePartyTckn: useInlineParty && /^\d{11}$/.test(cleanTaxOrTckn) ? cleanTaxOrTckn : '',
          inlinePartyTaxNo: useInlineParty && !/^\d{11}$/.test(cleanTaxOrTckn) ? cleanTaxOrTckn : '',
          productId: productSel.value,
          subProductId: subProductSel.value,
          warehouseId: whSel.value,
          weighId: weighSel.value,
          qtyKg: qtyIn.value,
          fireKg: fireIn.value,
          moisturePct: moistIn.value,
          foreignPct: foreignIn.value,
          unitPrice: unitPriceIn.value,
          discountPct: discIn.value,
          deductionPct: stopajIn.value,
          bagkurPct: bagkurIn.value,
          vatPct: vatIn.value,
          withholdingCode: withholdSel.value,
          directExpense: expIn.value,
          expenseAccountId: expAccSel.value,
          instantPaidAmount: instantPaidIn.value,
          instantAccountId: instantAccSel.value,
          note: noteIn.value
        }, cmdId);
        closeModal(true);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hide');
      }
    }
  },
    h('div', { className: 'mode-switch' }, btnMustahsil, btnFaturali),
    h('div', { className: 'form-grid-3' },
      openWeighs.length ? formField('Açık Kantar Fişinden Aktar', weighSel, { full: true }) : null,
      !useInlineParty ? formField(cariLabel, partySel, { span2: true }) : h('div', { style: 'grid-column: 1 / -1; display:flex; justify-content:flex-end' }, activeParties.length > 0 ? toggleInlineBtn : null),
      !useInlineParty ? formField('Alış Tarihi *', dateIn) : null,
      inlineBox,
      useInlineParty ? formField('Alış Tarihi *', dateIn) : null,
      formField('Giriş Deposu / Silo *', whSel),
      formField('Ürün Cinsi *', productSel),
      formField(
        h('span', { style: 'display:flex;justify-content:space-between;align-items:center;width:100%;' },
          h('span', null, 'Alt Kırılım / Sınıf (Mısır 1, 2...)'),
          h('button', {
            type: 'button',
            className: 'chip-btn',
            style: 'font-size:10.5px;padding:1px 6px;',
            onClick: () => openSubProductManagerModal(productSel.value)
          }, '+ Sınıf Tanımla')
        ),
        subProductSel
      ),
      formField('Makbuz / Fatura No', docNoIn),
      formField('İrsaliye / Borsa Tescil No', waybillIn),
      formField('Araç Plakası', plateIn),
      formField('Şoför / Nakliyeci', driverIn),

      h('div', { className: 'form-section-title' }, 'Tartım, Kalite Analizi, Fire ve Birim Fiyat'),
      formField('Tartım / Gelen Miktar (kg) *', qtyIn),
      formField('Fire Düşümü (kg)', fireIn, { chips: fireChips }),
      formField('Fiyatlandırılacak Net Safi Kg', netSafiOut),
      formField('Birim Fiyat (TL/kg) *', unitPriceIn),
      formField('Brüt Mal Tutarı (TL)', grossManualIn),
      formField('İskonto (%)', discIn),
      formField('Rutubet (%)', moistIn),
      formField('Yabancı Madde (%)', foreignIn),
      formField('Nakliye / Hammaliye Ek Maliyet (TL)', expIn),

      h('div', { className: 'form-section-title' }, 'Yasal Kesintiler / KDV, Vade ve Peşin Ödeme'),
      mustahsilRow,
      faturaliRow,
      formField('Ek Nakliye Ödeme Hesabı', expAccSel),
      formField('Ödeme Vade Tarihi *', dueIn, { span2: true, chips: dueChips }),
      formField('Şimdi Peşin Ödenen Tutar (TL)', instantPaidIn, { span2: true, chips: paidChips }),
      formField('Peşin Ödeme Kasa/Banka Hesabı', instantAccSel),
      formField('Alış Açıklaması / Kalite Notu', noteIn, { full: true }),

      h('div', { className: 'calc-preview-6' },
        h('div', null, h('span', null, '1. Net Safi Miktar'), pSafiKg),
        h('div', null, h('span', null, '2. İskonto Sonrası Mal Bedeli'), pGross),
        h('div', null, pCutOrVatLabel, pCutOrVat),
        h('div', null, h('span', null, '4. Üreticiye / Cariye Net Toplam'), pNetPayable),
        h('div', null, h('span', null, '5. Şimdi Peşin Ödenen'), pInstantPaid),
        h('div', null, h('span', null, '6. Vadeye Kalan Cari Borç'), pRemainingDebt)
      )
    ),
    errBox,
    h('div', { className: 'modal-foot' },
      h('button', { type: 'button', className: 'btn', onClick: () => closeModal() }, 'Vazgeç'),
      h('button', { type: 'submit', className: 'btn primary' }, 'Mal Alışını Kesinleştir (Ctrl+S)')

  openModal('Yeni Mal Alışı (Müstahsil Makbuzu & Ticari Alış Faturası)', form, { trackDirty: true });
}

/* ============================================================================
 * 2. GENİŞLETİLMİŞ PROFESYONEL ZAHİRE MAL SATIŞI MODALI (KDV + Tevkifat + FIFO Kâr)
 * ============================================================================ */
function openSaleFormModal(presetWeigh = null) {
  const st = appState.data;
  const activeParties = st.parties.filter((p) => p.active);
  const openWeighs = st.weighs.filter((w) => w.status === 'open');

  let docSubType = 'Ticari Satış Faturası';
  let useInlineParty = activeParties.length === 0;

  const btnNormal = h('button', { type: 'button', className: 'mode-btn blue active' }, iconEl('arrowUp', 16), 'Yurtiçi Satış Faturası');
  const btnTevkifat = h('button', { type: 'button', className: 'mode-btn green' }, iconEl('shield', 16), 'KDV Tevkifatlı Satış');
  const btnMustahsilGirdi = h('button', { type: 'button', className: 'mode-btn red' }, iconEl('parties', 16), 'Müstahsile Girdi/Ürün Satışı');

  const partySel = h('select', null,
    ...activeParties.map((p) => h('option', { value: p.id, selected: presetWeigh?.partyId === p.id }, `${p.code} · ${p.name} (${p.role})`))
  );
  const toggleInlineBtn = h('button', { type: 'button', className: 'chip-btn' }, useInlineParty ? 'Kayıtlı Carilerden Seç' : '+ Yeni Müşteri Yazarak Aç');

  const inlineNameIn = h('input', { type: 'text', maxLength: 120, placeholder: 'Yeni Müşteri Firma Unvanı veya Ad Soyad *' });
  const inlinePhoneIn = h('input', { type: 'text', maxLength: 30, placeholder: 'Telefon (05xx...)' });
  const inlineTaxIn = h('input', { type: 'text', maxLength: 20, placeholder: 'Vergi No / TCKN' });
  const inlineBox = h('div', { className: `inline-party-box ${useInlineParty ? '' : 'hide'}` },
    h('div', { style: 'font-size:11.5px;font-weight:800;color:var(--brand);margin-bottom:8px' }, 'Formdan Çıkmadan Hızlı Yeni Müşteri Kartı (Satışla Birlikte Otomatik Açılır)'),
    h('div', { className: 'form-grid-3' },
      formField('Müşteri Unvanı *', inlineNameIn),
      formField('Telefon', inlinePhoneIn),
      formField('VKN / TCKN', inlineTaxIn)
    )
  );

  const weighSel = h('select', null,
    h('option', { value: '' }, '— Kantar Fişi Bağlama (Manuel Sevk Miktarı) —'),
    ...openWeighs.map((w) => {
      const pName = st.products.find((p) => p.id === w.productId)?.name || '';
      return h('option', { value: w.id, selected: presetWeigh?.id === w.id }, `#${w.ticketNo} · ${w.plate} · Net ${formatQtyGrams(w.netGrams, true)} ${pName}`);
    })
  );

  const dateIn = h('input', { type: 'date', required: true, value: presetWeigh?.date || istToday() });
  const dueIn = h('input', { type: 'date', required: true, value: presetWeigh?.date || istToday() });
  const docNoIn = h('input', { type: 'text', maxLength: 32, placeholder: 'Otomatik (ST-00001)' });
  const waybillIn = h('input', { type: 'text', maxLength: 40, placeholder: 'Sevk İrsaliye No' });
  const plateIn = h('input', { type: 'text', maxLength: 24, value: presetWeigh?.plate || '', placeholder: '35 XYZ 456' });
  const driverIn = h('input', { type: 'text', maxLength: 80, value: presetWeigh?.driverName || '', placeholder: 'Şoför / Nakliye Firması' });

  const whSel = h('select', { required: true },
    ...st.warehouses.map((w) => h('option', { value: w.id, selected: presetWeigh?.warehouseId === w.id }, `${w.code} · ${w.name}`))
  );
  const productSel = h('select', { required: true });

  const subProductSel = h('select', null);
  const refreshSubProducts = () => {
    clearNode(subProductSel);
    const p = st.products.find((x) => x.id === productSel.value);
    const subs = (p && p.subProducts && p.subProducts.length > 0) ? p.subProducts : [];
    subProductSel.appendChild(h('option', { value: '' }, '— Standart / Genel Alt Kırılım —'));
    subs.forEach((s) => {
      const sStock = warehouseProductStock(st, whSel.value, p ? p.id : null, s.id);
      const stockTxt = BigInt(sStock.qtyGrams) > 0n ? ` (Stok: ${formatQtyGrams(sStock.qtyGrams, true)})` : ' (Stok: 0 kg)';
      subProductSel.appendChild(h('option', {
        value: s.id,
        selected: presetWeigh?.subProductId === s.id,
        dataset: { sellPrice: s.sellPriceTl || '' }
      }, `${s.name}${stockTxt} ${s.sellPriceTl ? `· Satış: ${s.sellPriceTl} ₺` : ''}`));
    });
  };

  const refreshProducts = () => {
    const prev = productSel.value || presetWeigh?.productId || st.products[0]?.id;
    clearNode(productSel);
    for (const prd of st.products.filter((x) => x.active)) {
      const s = warehouseProductStock(st, whSel.value, prd.id);
      const avgTxt = BigInt(s.qtyGrams) > 0n ? ` · Ort.Maliyet: ${formatUnitPriceMicro(s.avgUnitPriceMicro)}` : '';
      productSel.appendChild(
        h('option', { value: prd.id, selected: prd.id === prev }, `${prd.name} [Mevcut: ${formatQtyGrams(s.qtyGrams, true)}${avgTxt}]`)
      );
    }
    refreshSubProducts();
  };

  productSel.addEventListener('change', () => {
    refreshSubProducts();
  });
  whSel.addEventListener('change', () => {
    refreshProducts();
  });
  subProductSel.addEventListener('change', () => {
    const opt = subProductSel.selectedOptions[0];
    if (opt && opt.dataset.sellPrice && opt.dataset.sellPrice !== '0,00' && opt.dataset.sellPrice !== '') {
      unitPriceIn.value = opt.dataset.sellPrice;
      recalc();
    }
  });

  const qtyIn = h('input', {
    type: 'text',
    inputMode: 'decimal',
    required: true,
    value: presetWeigh ? formatQtyGrams(presetWeigh.netGrams, false) : '',
    placeholder: 'Örn. 20.000'
  });
  const fireIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0' });
  const unitPriceIn = h('input', { type: 'text', inputMode: 'decimal', required: true, placeholder: 'Örn. 12,25' });
  const grossManualIn = h('input', { type: 'text', inputMode: 'decimal', placeholder: 'Otomatik hesaplanır' });
  const discIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0' });
  const freightIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0,00 (Müşteriye yansıtılan navlun)' });

  const vatIn = h('input', { type: 'text', inputMode: 'decimal', value: '1', placeholder: '1' });
  const withholdSel = h('select', null,
    h('option', { value: 'YOK' }, 'Tevkifat Yok'),
    h('option', { value: '2/10' }, '2/10 KDV Tevkifatı'),
    h('option', { value: '5/10' }, '5/10 KDV Tevkifatı'),
    h('option', { value: '7/10' }, '7/10 KDV Tevkifatı'),
    h('option', { value: '9/10' }, '9/10 KDV Tevkifatı')
  );

  const instantPaidIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '0,00 (Vadeli ise 0 bırakın)' });
  const instantAccSel = h('select', null,
    ...st.accounts.map((a) => h('option', { value: a.id }, `${a.name} (${formatMoneyMinor(accountBalanceMinor(st, a.id))})`))
  );
  const noteIn = h('input', { type: 'text', maxLength: 220, placeholder: 'Teslim yeri, sözleşme veya sevk notu' });

  const dueChips = h('div', { className: 'quick-chips' },
    ...[['Peşin / Bugün', 0], ['+7 Gün', 7], ['+15 Gün', 15], ['+30 Gün', 30], ['+45 Gün', 45], ['+60 Gün', 60]].map(([lbl, d]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { dueIn.value = addDaysIso(dateIn.value, d); } }, lbl)
    )
  );

  const vatChips = h('div', { className: 'quick-chips' },
    ...[['%0 İstisna', '0'], ['%1 Hububat', '1'], ['%10 Yem/Gıda', '10'], ['%20 Genel', '20']].map(([lbl, v]) =>
      h('button', { type: 'button', className: 'chip-btn', onClick: () => { vatIn.value = v; recalc(); } }, lbl)
    )
  );

  let currentGrandTotalMinor = '0';
  const recvChips = h('div', { className: 'quick-chips' },
    h('button', { type: 'button', className: 'chip-btn', onClick: () => { instantPaidIn.value = '0'; recalc(); } }, 'Tamamı Vadeli (0 ₺)'),
    h('button', {
      type: 'button',
      className: 'chip-btn',
      onClick: () => {
        const half = divRoundHalfAway(BigInt(currentGrandTotalMinor), 2n);
        instantPaidIn.value = formatMoneyMinor(half.toString(), false);
        recalc();
      }
    }, '%50 Peşinat Al'),
    h('button', {
      type: 'button',
      className: 'chip-btn',
      onClick: () => {
        instantPaidIn.value = formatMoneyMinor(currentGrandTotalMinor, false);
        recalc();
      }
    }, 'Tamamını Peşin Tahsil Et')
  );

  const pNetMatrah = h('strong', null, '0,00 ₺');
  const pVatSummary = h('strong', null, '0,00 ₺');
  const pGrandTotal = h('strong', { className: 'text-good' }, '0,00 ₺');
  const pEstProfit = h('strong', null, '—');
  const pInstantRecv = h('strong', null, '0,00 ₺');
  const pRemReceivable = h('strong', { className: 'text-bad' }, '0,00 ₺');

  const recalc = (fromGross = false) => {
    btnNormal.classList.toggle('active', docSubType === 'Ticari Satış Faturası');
    btnTevkifat.classList.toggle('active', docSubType === 'Tevkifatlı Satış Faturası');
    btnMustahsilGirdi.classList.toggle('active', docSubType === 'Müstahsile Girdi Satışı');

    try {
      const rawG = parseQtyGrams(qtyIn.value, 'Miktar');
      const fireG = parseOptionalQtyGrams(fireIn.value, 'Fire');
      const safiG = BigInt(rawG) - BigInt(fireG);
      if (safiG <= 0n) throw new Error('Net kg > 0');

      if (fromGross && grossManualIn.value.trim()) {
        const gMinor = parseMoneyMinor(grossManualIn.value, 'Brüt');
        const uMicro = divRoundHalfAway(BigInt(gMinor) * 100_000n, safiG);
        unitPriceIn.value = formatUnitPriceMicro(uMicro.toString()).replace(' ₺', '');
      }

      const uMicro = parseUnitPriceMicro(unitPriceIn.value, 'Birim fiyat');
      const gross = calcLineGrossMinor(safiG.toString(), uMicro);
      if (!fromGross) grossManualIn.value = formatMoneyMinor(gross, false);

      const disc = calcBpsAmountMinor(gross, parseRateBps(discIn.value || '0', 'İskonto'));
      const net = BigInt(gross) - BigInt(disc);
      const freight = BigInt(parseOptionalMoneyMinor(freightIn.value, 'Navlun'));
      const matrah = net + freight;
      pNetMatrah.textContent = formatMoneyMinor(matrah.toString());

      const vat = BigInt(calcBpsAmountMinor(matrah.toString(), parseRateBps(vatIn.value || '0', 'KDV')));
      const withheld = BigInt(calcWithheldVatMinor(vat.toString(), withholdSel.value));
      const payVat = vat - withheld;
      pVatSummary.textContent = withheld > 0n
        ? `${formatMoneyMinor(payVat.toString())} (Tevkif: ${formatMoneyMinor(withheld.toString())})`
        : formatMoneyMinor(payVat.toString());

      const grand = matrah + payVat;
      currentGrandTotalMinor = grand.toString();
      pGrandTotal.textContent = formatMoneyMinor(currentGrandTotalMinor);

      // Tahmini ortalama/FIFO kâr önizlemesi
      const whStock = warehouseProductStock(st, whSel.value, productSel.value);
      if (BigInt(whStock.qtyGrams) >= safiG && BigInt(whStock.qtyGrams) > 0n) {
        const estCost = divRoundHalfAway(safiG * BigInt(whStock.avgUnitPriceMicro), 100_000n);
        const estProf = matrah - estCost;
        pEstProfit.textContent = `${formatMoneyMinor(estProf.toString())} (${estProf >= 0n ? 'Kâr' : 'Zarar'})`;
        pEstProfit.className = estProf >= 0n ? 'text-good' : 'text-bad';
      } else {
        pEstProfit.textContent = 'Depo stoku yetersiz!';
        pEstProfit.className = 'text-bad';
      }

      const inst = BigInt(parseOptionalMoneyMinor(instantPaidIn.value, 'Peşinat'));
      pInstantRecv.textContent = formatMoneyMinor(inst.toString());
      const rem = grand - inst;
      pRemReceivable.textContent = formatMoneyMinor((rem > 0n ? rem : 0n).toString());
    } catch {
      pNetMatrah.textContent = '0,00 ₺';
      pVatSummary.textContent = '0,00 ₺';
      pGrandTotal.textContent = '0,00 ₺';
      pEstProfit.textContent = '—';
      pInstantRecv.textContent = '0,00 ₺';
      pRemReceivable.textContent = '0,00 ₺';
    }
  };

  btnNormal.addEventListener('click', () => { docSubType = 'Ticari Satış Faturası'; withholdSel.value = 'YOK'; recalc(); });
  btnTevkifat.addEventListener('click', () => { docSubType = 'Tevkifatlı Satış Faturası'; if (withholdSel.value === 'YOK') withholdSel.value = '5/10'; recalc(); });
  btnMustahsilGirdi.addEventListener('click', () => { docSubType = 'Müstahsile Girdi Satışı'; withholdSel.value = 'YOK'; recalc(); });

  toggleInlineBtn.addEventListener('click', () => {
    useInlineParty = !useInlineParty;
    inlineBox.classList.toggle('hide', !useInlineParty);
    partySel.disabled = useInlineParty;
    toggleInlineBtn.textContent = useInlineParty ? 'Kayıtlı Carilerden Seç' : '+ Yeni Müşteri Yazarak Aç';
  });
  partySel.disabled = useInlineParty;

  weighSel.addEventListener('change', () => {
    const w = openWeighs.find((x) => x.id === weighSel.value);
    if (w) {
      whSel.value = w.warehouseId;
      refreshProducts();
      productSel.value = w.productId;
      if (w.partyId && !useInlineParty) partySel.value = w.partyId;
      plateIn.value = w.plate;
      driverIn.value = w.driverName || '';
      qtyIn.value = formatQtyGrams(w.netGrams, false);
      recalc();
    }
  });

  whSel.addEventListener('change', () => { refreshProducts(); recalc(); });
  productSel.addEventListener('change', () => recalc());
  [qtyIn, fireIn, unitPriceIn, discIn, freightIn, vatIn, instantPaidIn].forEach((el) => el.addEventListener('input', () => recalc(false)));
  grossManualIn.addEventListener('input', () => recalc(true));
  withholdSel.addEventListener('change', () => recalc(false));

  refreshProducts();
  recalc(false);

  const errBox = h('div', { className: 'status-strip warn hide' });
  const cmdId = newCmdId('cmd');

  const cariLabel = h('span', { style: 'display:flex;justify-content:space-between;width:100%;align-items:center' },
    h('span', null, 'Alıcı / Müşteri Cari *'),
    activeParties.length > 0 ? toggleInlineBtn : null
  );

  const form = h('form', {
    onSubmit: async (e) => {
      e.preventDefault();
      errBox.classList.add('hide');
      try {
        const cleanTax = inlineTaxIn.value.trim();
        await runCommand('trade.sale', {
          docSubType,
          date: dateIn.value,
          dueDate: dueIn.value,
          docNo: docNoIn.value,
          waybillNo: waybillIn.value,
          plate: plateIn.value,
          driverName: driverIn.value,
          partyId: useInlineParty ? '' : partySel.value,
          inlinePartyName: useInlineParty ? inlineNameIn.value : '',
          inlinePartyRole: docSubType === 'Müstahsile Girdi Satışı' ? 'Müstahsil' : 'Müşteri',
          inlinePartyPhone: useInlineParty ? inlinePhoneIn.value : '',
          inlinePartyTckn: useInlineParty && /^\d{11}$/.test(cleanTax) ? cleanTax : '',
          inlinePartyTaxNo: useInlineParty && !/^\d{11}$/.test(cleanTax) ? cleanTax : '',
          productId: productSel.value,
          subProductId: subProductSel.value,
          warehouseId: whSel.value,
          weighId: weighSel.value,
          qtyKg: qtyIn.value,
          fireKg: fireIn.value,
          unitPrice: unitPriceIn.value,
          discountPct: discIn.value,
          freightCharge: freightIn.value,
          vatPct: vatIn.value,
          withholdingCode: withholdSel.value,
          instantPaidAmount: instantPaidIn.value,
          instantAccountId: instantAccSel.value,
          note: noteIn.value
        }, cmdId);
        closeModal(true);
      } catch (err) {
        errBox.textContent = err.message;
        errBox.classList.remove('hide');
      }
    }
  },
    h('div', { className: 'mode-switch' }, btnNormal, btnTevkifat, btnMustahsilGirdi),
    h('div', { className: 'form-grid-3' },
      openWeighs.length ? formField('Açık Kantar Fişinden Aktar', weighSel, { full: true }) : null,
      !useInlineParty ? formField(cariLabel, partySel, { span2: true }) : h('div', { style: 'grid-column: 1 / -1; display:flex; justify-content:flex-end' }, activeParties.length > 0 ? toggleInlineBtn : null),
      !useInlineParty ? formField('Satış Tarihi *', dateIn) : null,
      inlineBox,
      useInlineParty ? formField('Satış Tarihi *', dateIn) : null,
      formField('Çıkış Deposu / Silo *', whSel),
      formField('Satılan Ürün (Canlı Stok & Maliyet) *', productSel),
      formField(
        h('span', { style: 'display:flex;justify-content:space-between;align-items:center;width:100%;' },
          h('span', null, 'Alt Kırılım / Sınıf (Mısır 1, 2...)'),
          h('button', {
            type: 'button',
            className: 'chip-btn',
            style: 'font-size:10.5px;padding:1px 6px;',
            onClick: () => openSubProductManagerModal(productSel.value)
          }, '+ Sınıf Tanımla')
        ),
        subProductSel
      ),
      formField('Fatura No', docNoIn),
      formField('Sevk İrsaliye No', waybillIn),
      formField('Araç Plakası', plateIn),
      formField('Şoför / Lojistik', driverIn),

      h('div', { className: 'form-section-title' }, 'Sevk Miktarı, Birim Fiyat, İskonto ve Navlun'),
      formField('Sevk Miktarı (kg) *', qtyIn),
      formField('Sevk Fire Düşümü (kg)', fireIn),
      formField('Satış Birim Fiyatı (TL/kg) *', unitPriceIn),
      formField('Brüt Mal Tutarı (TL)', grossManualIn),
      formField('Satır İskontosu (%)', discIn),
      formField('Faturaya Eklenen Nakliye / Navlun (TL)', freightIn),

      h('div', { className: 'form-section-title' }, 'KDV, Tevkifat, Vade ve Peşin Tahsilat'),
      formField('Satış KDV Oranı (%)', vatIn, { span2: true, chips: vatChips }),
      formField('KDV Tevkifat Oranı', withholdSel),
      formField('Tahsilat Vade Tarihi *', dueIn, { full: true, chips: dueChips }),
      formField('Şimdi Peşin Tahsil Edilen (TL)', instantPaidIn, { span2: true, chips: recvChips }),
      formField('Tahsilat Kasa/Banka Hesabı', instantAccSel),
      formField('Fatura / Sevkiyat Notu', noteIn, { full: true }),

      h('div', { className: 'calc-preview-6' },
        h('div', null, h('span', null, '1. KDV Hariç Net Matrah'), pNetMatrah),
        h('div', null, h('span', null, '2. Faturaya Yansıyan KDV'), pVatSummary),
        h('div', null, h('span', null, '3. KDV Dahil Genel Toplam'), pGrandTotal),
        h('div', null, h('span', null, '4. Tahmini Brüt Kâr'), pEstProfit),
        h('div', null, h('span', null, '5. Şimdi Tahsil Edilen'), pInstantRecv),
        h('div', null, h('span', null, '6. Vadeye Kalan Alacak'), pRemReceivable)
      )
    ),
    errBox,
    h('div', { className: 'modal-foot' },
      h('button', { type: 'button', className: 'btn', onClick: () => closeModal() }, 'Vazgeç'),
      h('button', { type: 'submit', className: 'btn blue' }, 'Mal Satışını Kesinleştir (Ctrl+S)')
    )
  );

  openModal('Yeni Mal Satışı (Ticari Fatura, Tevkifatlı Satış & Sevkiyat)', form, { trackDirty: true });
}

/* ---------------- DİĞER FORM VE BELGE DETAY MODALLARI ---------------- */
function openTradeDetailModal(tr) {
  const st = appState.data;
  const openAmt = tradeOpenMinor(st, tr);
  const paidAmt = tradeAllocatedMinor(st, tr.id);
  const isBuy = tr.kind === 'purchase';

  const detailRows = [
    ['Belge Türü / No', `${tr.docSubType || (isBuy ? 'Müstahsil Makbuzu' : 'Satış Faturası')} · ${tr.docNo}`],
    ['Tarih / Vade', `${fmtDateTr(tr.date)} · Vade: ${fmtDateTr(tr.dueDate)}`],
    ['Cari Hesap', tr.partyNameSnapshot],
    ['Ürün / Depo', `${tr.productNameSnapshot} · ${tr.warehouseNameSnapshot}`],
    ['Plaka / Şoför / İrsaliye', `${tr.plate || '—'} · ${tr.driverName || '—'} · İrs: ${tr.waybillNo || '—'}`],
    ['Tartım / Fire / Net Safi Kg', `Tartım: ${formatQtyGrams(tr.rawQtyGrams || tr.qtyGrams, true)} · Fire: ${formatQtyGrams(tr.fireGrams || '0', true)} · Net: ${formatQtyGrams(tr.qtyGrams, true)}`],

    isBuy

  ];

  const node = h('div', null,
    h('div', { className: 'status-strip' },
      h('strong', null, `${st.company} — Resmi Belge Dökümü`),
      h('span', { className: `badge ${tr.status === 'posted' ? 'green' : 'red'}` }, tr.status === 'posted' ? 'KESİNLEŞMİŞ BELGE' : 'STORNO İPTAL')
    ),
    renderDataTable({
      paginate: false,
      columns: [
        { header: 'Bilgi Kalemi', render: (r) => h('strong', null, r[0]) },
        { header: 'Değer', render: (r) => r[1] }
      ],
      rows: detailRows
    }),
    tr.note ? h('div', { className: 'status-strip', style: 'margin-top:12px' }, `Not: ${tr.note}`) : null,
    h('div', { className: 'modal-foot' },
      h('button', { type: 'button', className: 'btn', onClick: () => closeModal(true) }, 'Kapat'),
      h('button', { type: 'button', className: 'btn primary', onClick: () => window.print() }, 'Makbuz / Fatura Yazdır (A4)')
    )
  );
  openModal(`${tr.docNo} — Belge ve Makbuz Detayı`, node);
}

function openCashFormModal(preset = {}) {
  const st = appState.data;
  let currentKind = preset.kind || 'Tahsilat';

  const modeButtons = [
    ['Tahsilat', 'Para Tahsil Et', 'green'],
    ['Ödeme', 'Ödeme Yap', 'red'],
    ['Gider', 'Diğer Gider', 'red'],
    ['Gelir', 'Diğer Gelir', 'green'],
    ['Virman', 'Virman', 'blue']
  ].map(([k, lbl, color]) => {
    const b = h('button', { type: 'button', className: `mode-btn ${color}` }, lbl);
    b.dataset.kind = k;
    return b;
  });

  const dateIn = h('input', { type: 'date', required: true, value: istToday() });
  const accSel = h('select', { required: true },
    ...st.accounts.map((a) => h('option', { value: a.id }, `${a.name} (${formatMoneyMinor(accountBalanceMinor(st, a.id))})`))
  );
  const toAccSel = h('select', null, ...st.accounts.map((a, i) => h('option', { value: a.id, selected: i === 1 }, a.name)));

  const partySel = h('select', null,
    h('option', { value: '' }, '— Cari seçin —'),
    ...st.parties.map((p) => {
      const b = BigInt(partyBalanceMinor(st, p.id));
      const info = b > 0n ? `Alacak: ${formatMoneyMinor(b.toString())}` : b < 0n ? `Borç: ${formatMoneyMinor((-b).toString())}` : '0,00 ₺';
      return h('option', { value: p.id, selected: preset.partyId === p.id }, `${p.name} [${info}]`);
    })
  );

  const allocModeSel = h('select', null,
    h('option', { value: 'FIFO', selected: !preset.tradeId }, 'En eski açık faturalardan otomatik düş (FIFO)'),
    h('option', { value: 'EXPLICIT', selected: !!preset.tradeId }, 'Seçili tek faturadan düş'),
    h('option', { value: 'NONE' }, 'Serbest cari avans (faturaya bağlama)')
  );

  const tradeSel = h('select', null);
  const refreshOpenTrades = () => {
    clearNode(tradeSel);
    const target = currentKind === 'Tahsilat' ? 'sale' : 'purchase';
    const list = st.trades.filter((t) => t.status === 'posted' && t.partyId === partySel.value && t.kind === target && BigInt(tradeOpenMinor(st, t)) > 0n);
    if (!list.length) {
      tradeSel.appendChild(h('option', { value: '' }, '— Açık fatura yok —'));
      return;
    }
    for (const t of list) {
      tradeSel.appendChild(h('option', { value: t.id, selected: preset.tradeId === t.id }, `${t.docNo} · Kalan: ${formatMoneyMinor(tradeOpenMinor(st, t))}`));
    }
  };

  const amtIn = h('input', {
    type: 'text',
    inputMode: 'decimal',
    required: true,
    value: preset.amountMinor ? formatMoneyMinor(preset.amountMinor, false) : '',
    placeholder: 'Örn. 25.000,00'
  });

  const fillFullBtn = h('button', {
    type: 'button',
    className: 'chip-btn',
    onClick: () => {
      if (allocModeSel.value === 'EXPLICIT' && tradeSel.value) {
        const tr = st.trades.find((x) => x.id === tradeSel.value);
        if (tr) amtIn.value = formatMoneyMinor(tradeOpenMinor(st, tr), false);
        return;
      }
      if (partySel.value) {
        const b = BigInt(partyBalanceMinor(st, partySel.value));
        const abs = b < 0n ? -b : b;
        if (abs > 0n) amtIn.value = formatMoneyMinor(abs.toString(), false);
      }
    }
  }, 'Açık Bakiyeyi Tam Doldur');

  const catIn = h('input', { type: 'text', maxLength: 60, placeholder: 'Örn. Nakliye, Mazot, Hammaliye, Komisyon, Elektrik' });
  const noteIn = h('input', { type: 'text', maxLength: 220, value: preset.note || '', placeholder: 'Dekont / makbuz açıklaması' });

  const partyWrap = formField('Cari Hesap *', partySel);
  const allocWrap = formField('Fatura Mahsup Şekli', allocModeSel);
  const tradeWrap = formField('Hangi Belge?', tradeSel, { full: true });
  const catWrap = formField('Gelir / Gider Kalemi', catIn);
  const toAccWrap = formField('Hedef Hesap *', toAccSel);

  const syncMode = () => {
    modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.kind === currentKind));
    const isParty = currentKind === 'Tahsilat' || currentKind === 'Ödeme';
    partyWrap.classList.toggle('hide', !isParty);
    allocWrap.classList.toggle('hide', !isParty);
    tradeWrap.classList.toggle('hide', !isParty || allocModeSel.value !== 'EXPLICIT');
    fillFullBtn.classList.toggle('hide', !isParty);
    catWrap.classList.toggle('hide', !(currentKind === 'Gelir' || currentKind === 'Gider'));
    toAccWrap.classList.toggle('hide', currentKind !== 'Virman');
    if (isParty) refreshOpenTrades();
  };

  modeButtons.forEach((b) => b.addEventListener('click', () => { currentKind = b.dataset.kind; syncMode(); }));
  partySel.addEventListener('change', refreshOpenTrades);
  allocModeSel.addEventListener('change', syncMode);
  syncMode();

  const amtLabel = h('span', { style: 'display:flex;justify-content:space-between;width:100%;align-items:center' },
    h('span', null, 'Tutar (TL) *'),
    fillFullBtn
  );

  const errBox = h('div', { className: 'status-strip warn hide' });
  const cmdId = newCmdId('cmd');

  const form = h('form', {
    onSubmit: async (e) => {
      e.preventDefault();
      errBox.classList.add('hide');
      try {
        await runCommand('cash.post', {
          kind: currentKind, date: dateIn.value, accountId: accSel.value, toAccountId: toAccSel.value,
          partyId: partySel.value, allocationMode: allocModeSel.value,
          tradeId: allocModeSel.value === 'EXPLICIT' ? tradeSel.value : '',
          category: catIn.value, amount: amtIn.value, note: noteIn.value
        }, cmdId);
        closeModal(true);
      } catch (err) { errBox.textContent = err.message; errBox.classList.remove('hide'); }
    }
  },
    h('div', { className: 'mode-switch' }, ...modeButtons),
    h('div', { className: 'form-grid' },
      formField('Kasa / Banka Hesabı *', accSel),
      formField('Tarih *', dateIn),
      toAccWrap,
      partyWrap,
      allocWrap,
      tradeWrap,
      catWrap,
      formField(amtLabel, amtIn, { full: true }),
      formField('Açıklama', noteIn, { full: true })
    ),
    errBox,
    h('div', { className: 'modal-foot' },
      h('button', { type: 'button', className: 'btn', onClick: () => closeModal() }, 'Vazgeç'),
      h('button', { type: 'submit', className: 'btn primary' }, 'Hareketi Kaydet')
    )
  );
  openModal('Tahsilat, Ödeme, Gelir/Gider & Virman', form, { trackDirty: true });
}

function openWeighFormModal() {
  const st = appState.data;
  const dateIn = h('input', { type: 'date', required: true, value: istToday() });
  const ticketIn = h('input', { type: 'text', required: true, maxLength: 32, value: `KNT-${String(st.weighs.length + 1).padStart(4, '0')}` });
  const plateIn = h('input', { type: 'text', required: true, maxLength: 24, placeholder: '35 ABC 123' });
  const driverIn = h('input', { type: 'text', maxLength: 80, placeholder: 'Şoför Adı Soyadı' });
  const partySel = h('select', null,
    h('option', { value: '' }, '— Cari seçilmedi (Faturada seçilebilir) —'),
    ...st.parties.filter((p) => p.active).map((p) => h('option', { value: p.id }, p.name))
  );
  const productSel = h('select', { required: true }, ...st.products.filter((p) => p.active).map((p) => h('option', { value: p.id }, p.name)));
  const whSel = h('select', { required: true }, ...st.warehouses.map((w) => h('option', { value: w.id }, w.name)));
  const grossIn = h('input', { type: 'text', inputMode: 'decimal', required: true, placeholder: 'Örn. 42.680' });
  const tareIn = h('input', { type: 'text', inputMode: 'decimal', required: true, placeholder: 'Örn. 15.420' });
  const netOut = h('input', { type: 'text', readonly: true, value: '0 kg' });
  const moistIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '13,5' });
  const foreignIn = h('input', { type: 'text', inputMode: 'decimal', value: '0', placeholder: '1,2' });
  const noteIn = h('input', { type: 'text', maxLength: 200, placeholder: 'Tartım / kalite notu' });

  const calcNet = () => {
    try {
      const g = parseQtyGrams(grossIn.value, 'Brüt');
      const t = parseQtyGrams(tareIn.value || '0', 'Dara', true);
      const diff = BigInt(g) - BigInt(t);
      netOut.value = diff > 0n ? formatQtyGrams(diff.toString(), true) : 'Brüt > Dara olmalı';
    } catch { netOut.value = '0 kg'; }
  };
  grossIn.addEventListener('input', calcNet);
  tareIn.addEventListener('input', calcNet);

  const errBox = h('div', { className: 'status-strip warn hide' });
  const cmdId = newCmdId('cmd');

  const form = h('form', {
    onSubmit: async (e) => {
      e.preventDefault();
      errBox.classList.add('hide');
      try {
        await runCommand('weigh.create', {
          date: dateIn.value, ticketNo: ticketIn.value, plate: plateIn.value, driverName: driverIn.value,
          partyId: partySel.value, productId: productSel.value, warehouseId: whSel.value,
          grossKg: grossIn.value, tareKg: tareIn.value, moisturePct: moistIn.value, foreignPct: foreignIn.value, note: noteIn.value
        }, cmdId);
        closeModal(true);
      } catch (err) { errBox.textContent = err.message; errBox.classList.remove('hide'); }
    }
  },
    h('div', { className: 'form-grid-3' },
      formField('Tartım Tarihi *', dateIn),
      formField('Kantar Fiş No *', ticketIn),
      formField('Araç Plakası *', plateIn),
      formField('Şoför Adı', driverIn),
      formField('Cari Hesap', partySel),
      formField('Depo / Silo *', whSel),
      formField('Ürün *', productSel),
      formField('Brüt Ağırlık (kg) *', grossIn),
      formField('Dara Ağırlık (kg) *', tareIn),
      formField('Net Ağırlık (Otomatik)', netOut),
      formField('Rutubet (%)', moistIn),
      formField('Yabancı Madde (%)', foreignIn),
      formField('Not', noteIn, { full: true })
    ),
    errBox,
    h('div', { className: 'modal-foot' },
      h('button', { type: 'button', className: 'btn', onClick: () => closeModal() }, 'Vazgeç'),
      h('button', { type: 'submit', className: 'btn primary' }, 'Kantar Fişini Kaydet')
    )
  );
  openModal('Yeni Kantar Tartım Fişi', form, { trackDirty: true });
}
