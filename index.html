<!DOCTYPE html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex,follow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köklü Agro Pro+ — Kurumsal Zahire & Tarım ERP</title>
  <style>
    :root {
      --agro-green: #0b6e52;
      --agro-green-dark: #074e3a;
      --agro-green-soft: #e5f6ef;
      --agro-green-border: #b5e4d2;
      --agro-amber: #b86e0c;
      --agro-amber-soft: #fef4e2;
      --agro-amber-dark: #8c5104;
      --agro-emerald: #059669;
      --agro-red: #dc2626;
      --agro-blue: #1e56c5;
      --agro-charcoal: #0d1e18;
      --agro-side: #0a1813;
      --agro-side-elev: #122820;
      --agro-tray-top: #c5d4ce;
      --agro-tray-bot: #b4c6be;
      --bg-canvas: #f2f6f4;
      --bg-card: #ffffff;
      --border-soft: #d8e4df;
      --border-strong: #bfd3cb;
      --text-primary: #10231c;
      --text-secondary: #425950;
      --text-muted: #60796f;
      --navy-header: #0d211a;
      --shadow-card: 0 2px 8px rgba(11, 38, 30, 0.05);
      --shadow-icon: 0 4px 10px rgba(7, 78, 58, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      --shadow-modal: 0 22px 54px rgba(10, 30, 24, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* =======================================================================
       APP SHELL — SINGLE UNIFIED TOP BAR
       ======================================================================= */
    .erp-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 46px;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-left::-webkit-scrollbar {
      display: none;
    }

    .menu-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 13px;
      border-radius: 7px;
      background: var(--agro-green);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px rgba(11, 110, 82, 0.25);
    }
    .menu-toggle-btn:hover {
      background: var(--agro-green-dark);
      transform: translateY(-1px);
    }
    .menu-toggle-btn.is-open {
      background: var(--agro-green-dark);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    .menu-toggle-btn svg {
      width: 15px;
      height: 15px;
    }

    .bar-divider {
      width: 1px;
      height: 20px;
      background: var(--border-soft);
      flex-shrink: 0;
    }

    /* Workspace Tabs */
    .tabs-strip {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ws-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 31px;
      padding: 0 11px;
      border-radius: 7px;
      background: #f0f5f2;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .ws-tab:hover {
      background: #e2ede8;
      color: var(--text-primary);
    }
    .ws-tab.active {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
      border-color: var(--agro-green-border);
      font-weight: 700;
    }
    .ws-tab svg {
      width: 13.5px;
      height: 13.5px;
      flex-shrink: 0;
    }
    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      font-size: 13px;
      color: #60796f;
    }
    .tab-close:hover {
      background: rgba(11, 110, 82, 0.15);
      color: var(--agro-green-dark);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 31px;
      padding: 0 10px;
      border-radius: 7px;
      background: #f6faf8;
      border: 1px solid var(--border-soft);
      color: #2b3d35;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.14s ease;
    }
    .icon-action-btn:hover {
      background: #e8f2ee;
    }
    .icon-action-btn.is-favorited {
      color: #b45309;
      border-color: #fcd34d;
      background: #fffbeb;
    }
    .icon-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    .company-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      padding-left: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .company-badge-tag {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
      border: 1px solid var(--agro-green-border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .company-pill span {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =======================================================================
       COLLAPSIBLE / ACCORDION LEFT SIDEBAR (OPEN / CLOSED / PINNED)
       ======================================================================= */
    .erp-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 24, 0.45);
      z-index: 45;
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }
    .sidebar-overlay.open {
      display: block;
    }

    .left-sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 268px;
      background: var(--agro-side);
      color: #dcece5;
      display: flex;
      flex-direction: column;
      z-index: 55;
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s ease;
      box-shadow: 10px 0 32px rgba(6, 24, 18, 0.4);
      user-select: none;
    }
    .left-sidebar.open {
      transform: translateX(0);
    }
    .erp-body.sidebar-pinned .left-sidebar {
      position: relative;
      transform: translateX(0);
      box-shadow: none;
      border-right: 1px solid #143226;
      flex-shrink: 0;
    }
    .erp-body.sidebar-pinned .sidebar-overlay {
      display: none !important;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: linear-gradient(90deg, #074e3a 0%, #0b6e52 100%);
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .sidebar-head-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .sidebar-head-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sidebar-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.85);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.12s ease;
    }
    .sidebar-icon-btn:hover, .sidebar-icon-btn.pinned {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .sidebar-search-wrap {
      padding: 10px 12px 6px;
    }
    .sidebar-search-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid #1c3e30;
      background: #11261e;
      color: #e8f5f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .sidebar-search-input::placeholder {
      color: #729688;
    }
    .sidebar-search-input:focus {
      border-color: #10b981;
      background: #142e24;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 14px;
      scrollbar-width: thin;
      scrollbar-color: #1c3e30 transparent;
    }
    .sidebar-nav::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: #1c3e30;
      border-radius: 4px;
    }

    /* Accordion groups in sidebar */
    .sidebar-group-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #8cb3a3;
      padding: 12px 8px 6px;
      cursor: pointer;
      border-radius: 5px;
      transition: color 0.12s ease;
    }
    .sidebar-group-header:hover {
      color: #dcece5;
    }
    .sidebar-group-header svg {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
      color: #608878;
    }
    .sidebar-group-header.collapsed svg {
      transform: rotate(-90deg);
    }
    .sidebar-group-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-group-items.collapsed {
      display: none;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 7px;
      color: #c9ded5;
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      margin-bottom: 2px;
      transition: all 0.12s ease;
    }
    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      transform: translateX(2px);
    }
    .nav-item.active {
      background: var(--agro-green);
      color: #ffffff;
      font-weight: 700;
    }
    .nav-item svg {
      width: 15px;
      height: 15px;
      color: #4ade80;
      flex-shrink: 0;
    }
    .nav-item.active svg {
      color: #ffffff;
    }
    .nav-item-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #dcece5;
    }
    .nav-item.active .nav-item-badge {
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
    }

    .sidebar-foot {
      padding: 10px 12px;
      border-top: 1px solid #143226;
      background: #081510;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #729688;
    }
    .sidebar-foot strong {
      color: #c9ded5;
      font-weight: 700;
    }

    /* =======================================================================
       MAIN SCROLLABLE STAGE
       ======================================================================= */
    .center-stage {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 14px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .center-stage > * {
      flex-shrink: 0;
    }

    /* 1. TOP 4 KÖKLÜ AGRO KPI CARDS (Zahire, Alış, Satış, Stok, Borç) */
    .netsis-kpi-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .netsis-kpi-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--agro-green);
      border-radius: 11px;
      padding: 12px 15px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .netsis-kpi-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(11, 38, 30, 0.08);
    }
    .netsis-kpi-card.kpi-emerald { border-left-color: var(--agro-emerald); }
    .netsis-kpi-card.kpi-amber   { border-left-color: var(--agro-amber); }
    .netsis-kpi-card.kpi-red     { border-left-color: var(--agro-red); }

    .netsis-kpi-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .netsis-kpi-mini-icon {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--agro-green-soft);
      color: var(--agro-green);
    }
    .netsis-kpi-card.kpi-emerald .netsis-kpi-mini-icon {
      background: #dcfce7;
      color: var(--agro-emerald);
    }
    .netsis-kpi-card.kpi-amber .netsis-kpi-mini-icon {
      background: var(--agro-amber-soft);
      color: var(--agro-amber);
    }
    .netsis-kpi-card.kpi-red .netsis-kpi-mini-icon {
      background: #fee2e2;
      color: var(--agro-red);
    }
    .netsis-kpi-mini-icon svg {
      width: 13px;
      height: 13px;
    }
    .netsis-kpi-value {
      font-size: 20px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
      color: #0d1e18;
    }
    .netsis-kpi-card.kpi-emerald .netsis-kpi-value { color: var(--agro-emerald); }
    .netsis-kpi-card.kpi-amber .netsis-kpi-value   { color: var(--agro-amber-dark); }
    .netsis-kpi-card.kpi-red .netsis-kpi-value     { color: var(--agro-red); }
    .netsis-kpi-card.kpi-green-val .netsis-kpi-value { color: var(--agro-green); }
    .netsis-kpi-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* 2. NETSİS SHORTCUT LAUNCHER TRAY (Index.htm Exact Box Grid Structure) */
    .netsis-launcher-tray {
      position: relative;
      background: linear-gradient(155deg, var(--agro-tray-top) 0%, var(--agro-tray-bot) 100%);
      border: 1px solid #9cb1a7;
      border-radius: 15px;
      padding: 16px 20px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 4px 14px rgba(11, 38, 30, 0.06);
      overflow: hidden;
    }
    .netsis-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 7px;
      color: rgba(11, 38, 30, 0.04);
      transform: rotate(-8deg);
      pointer-events: none;
      user-select: none;
    }

    .netsis-search-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .netsis-search-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(540px, 100%);
      height: 38px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid rgba(11, 38, 30, 0.15);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(11, 38, 30, 0.08);
      transition: all 0.15s ease;
    }
    .netsis-search-pill:focus-within {
      border-color: var(--agro-green);
      box-shadow: 0 0 0 3px rgba(11, 110, 82, 0.18);
    }
    .netsis-search-pill svg {
      width: 15px;
      height: 15px;
      color: var(--agro-green);
      flex-shrink: 0;
    }
    .netsis-search-pill input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 12.5px;
      color: var(--text-primary);
    }
    .netsis-search-pill input::placeholder {
      color: var(--text-muted);
    }
    .kbd-badge {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--agro-green-dark);
      background: var(--agro-green-soft);
      border: 1px solid var(--agro-green-border);
      border-radius: 999px;
      padding: 1px 7px;
      flex-shrink: 0;
    }

    /* Symmetrical 6x2 Grid (12 Köklü Agro Modules) */
    .modules-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .module-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px 4px 6px;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.14s ease, background 0.14s ease;
      cursor: pointer;
    }
    .module-tile:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.38);
    }

    .netsis-app-icon {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: linear-gradient(180deg, #0e8563 0%, #074e3a 100%);
      box-shadow: var(--shadow-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .module-tile:hover .netsis-app-icon {
      transform: scale(1.04);
    }
    .netsis-app-icon svg {
      width: 26px;
      height: 26px;
      color: #ffffff;
    }
    .netsis-app-icon.icon-amber {
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      box-shadow: 0 4px 10px rgba(184, 110, 12, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .netsis-app-icon.icon-blue {
      background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
      box-shadow: 0 4px 10px rgba(30, 86, 197, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .tile-label {
      font-size: 12px;
      font-weight: 700;
      color: #0d1e18;
      line-height: 1.24;
    }

    .netsis-tile-badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #ffffff;
      color: var(--agro-green-dark);
      border: 1.5px solid var(--agro-green);
      border-radius: 999px;
      padding: 0.5px 6px;
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(11, 38, 30, 0.16);
    }
    .netsis-tile-badge.badge-ok {
      color: #059669;
      border-color: #059669;
      background: #f0fdf4;
    }
    .netsis-tile-badge.badge-amber {
      color: #b45309;
      border-color: #f59e0b;
      background: #fffbeb;
    }

    /* 3. CHARTS ROW (Agro Sales & Purchases Trend + Silo & Grain Distribution) */
    .netsis-charts-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 14px;
    }
    .netsis-chart-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--agro-green);
      border-radius: 11px;
      padding: 13px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chart-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 4px;
    }

    .donut-wrap {
      display: grid;
      grid-template-columns: 128px 1fr;
      gap: 14px;
      align-items: center;
    }
    .aging-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .aging-row-top {

      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 3px;

      height: 7px;
      border-radius: 999px;
      background: #eef2f0;
      overflow: hidden;
    }
    .aging-fill {
      height: 100%;
      border-radius: 999px;
    }

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;

      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 11px;
      overflow: hidden;
      box-shadow: var(--shadow-card);

    .fav-card-header {
      background: var(--navy-header);
      border-bottom: 2px solid var(--agro-green);
      color: #ffffff;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .fav-card-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fav-card-title svg {
      width: 14.5px;
      height: 14.5px;
      color: #34d399;
    }
    .fav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 15px;
      border-bottom: 1px solid #edf3f0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: left;
      transition: background 0.12s ease;
    }
    .fav-row:last-child { border-bottom: none; }
    .fav-row:hover {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
    }
    .fav-row-hint {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--agro-green);
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .fav-row:hover .fav-row-hint { opacity: 1; }

      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .view-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--agro-green);
      border-radius: 11px;
      padding: 12px 16px;
      flex-wrap: wrap;

    .view-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .view-actions {
      display: flex;
      align-items: center;
      gap: 8px;

    }

    .subfilter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;

      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f0f5f2;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: all 0.14s ease;

    .subfilter-pill:hover {
      background: #e2ece7;
      color: var(--text-primary);
    }
    .subfilter-pill.active {
      background: var(--agro-green);
      color: #ffffff;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--agro-green);
      color: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      transition: background 0.14s ease;
    }
    .btn-primary:hover { background: var(--agro-green-dark); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      background: #f6faf8;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 12.5px;
      transition: all 0.14s ease;
    }
    .btn-secondary:hover { background: #e8f2ee; }

    .panel-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 11px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .panel-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 15px;
      border-bottom: 1px solid #edf3f0;
      flex-wrap: wrap;
    }
    .inline-filter-input {
      height: 33px;
      padding: 0 11px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      width: min(270px, 100%);
      background: #f8faf9;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .inline-filter-input:focus {
      background: #ffffff;
      border-color: var(--agro-green);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }
    .erp-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }
    .erp-table th {
      background: #f6faf8;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }
    .erp-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f6f4;
      font-size: 12.5px;
      color: var(--text-primary);
      vertical-align: middle;
    }
    .erp-table tr:hover td { background: #f3faf6; }
    .num-col {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red   { background: #fee2e2; color: #991b1b; }

    .scale-card-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;

    .scale-ticket-box {
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--agro-green);

      padding: 12px;
      background: #fbfdfc;
      display: flex;
      flex-direction: column;
      gap: 6px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--text-muted);
    }
    .scale-plate {
      font-size: 14px;
      font-weight: 800;
      color: #0b261e;
      letter-spacing: 0.5px;
    }

    /* MODAL & TOAST */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 24, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #ffffff;
      width: min(540px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 13px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-modal);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: linear-gradient(90deg, #074e3a 0%, #0b6e52 100%);
      color: #ffffff;

      color: #bbf7d0;
      font-size: 18px;
      width: 26px;
      height: 26px;
      border-radius: 6px;

    .modal-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .form-field input, .form-field select {
      height: 35px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      outline: none;
    }
    .form-field input:focus, .form-field select:focus { border-color: var(--agro-green); }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      background: #f8faf9;
      border-top: 1px solid #edf3f0;
    }

    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 110;
      pointer-events: none;
    }
    .toast-item {
      background: var(--agro-charcoal);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(10, 30, 24, 0.32);

    }

    @media print {
      .top-bar, .left-sidebar, .view-actions { display: none !important; }

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return Object.assign(createInitialState(), JSON.parse(raw));
      } catch (err) {}
      return createInitialState();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
    }

    function fmtTL(num) {
      return (Number(num) || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
    }

    function fmtKg(num) {
      return (Number(num) || 0).toLocaleString('tr-TR') + ' Kg';
    }

    function fmtInt(num) {
      return (Number(num) || 0).toLocaleString('tr-TR');
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getModuleById(id) {
      if (id === 'ana-ekran') return { id: 'ana-ekran', label: 'Masaüstü', icon: 'home', viewType: 'home' };
      return MODULES.find(m => m.id === id) || MODULES[0];
    }

    function showToast(msg) {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = 'toast-item';
      el.textContent = msg;
      stack.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 2600);
    }

    /* =========================================================================
       SIDEBAR & TAB CONTROLLERS (Açılır / Kapanır Menü)
       ========================================================================= */
    function syncSidebarDOM() {
      const sidebar = document.getElementById('leftSidebar');
      const overlay = document.getElementById('sidebarOverlay');
      const body = document.getElementById('erpBody');
      const pinBtn = document.getElementById('sidebarPinBtn');
      const menuBtn = document.getElementById('masterMenuBtn');

      if (state.sidebarPinned && window.innerWidth > 900) {
        body.classList.add('sidebar-pinned');
        sidebar.classList.add('open');
        overlay.classList.remove('open');
        pinBtn.classList.add('pinned');
        menuBtn.classList.add('is-open');
      } else {
        body.classList.remove('sidebar-pinned');
        pinBtn.classList.remove('pinned');
        sidebar.classList.toggle('open', !!state.sidebarOpen);
        overlay.classList.toggle('open', !!state.sidebarOpen);
        menuBtn.classList.toggle('is-open', !!state.sidebarOpen);
      }
    }

    function toggleSidebar() {
      if (state.sidebarPinned && window.innerWidth > 900) {
        state.sidebarPinned = false;
        state.sidebarOpen = false;
      } else {
        state.sidebarOpen = !state.sidebarOpen;
      }
      saveState();
      syncSidebarDOM();
    }

    function closeSidebarIfFloating() {
      if (!state.sidebarPinned || window.innerWidth <= 900) {
        state.sidebarOpen = false;
        saveState();
        syncSidebarDOM();
      }
    }

    function toggleSidebarGroup(groupName) {
      state.sidebarCollapsedGroups = state.sidebarCollapsedGroups || {};
      state.sidebarCollapsedGroups[groupName] = !state.sidebarCollapsedGroups[groupName];
      saveState();
      renderSidebar();
    }

    function openModule(moduleId) {
      const mod = getModuleById(moduleId);
      state.tableFilter = '';
      state.subFilter = 'Tümü';
      if (!state.openTabs.some(t => t.id === mod.id)) {
        state.openTabs.push({ id: mod.id, label: mod.label, icon: mod.icon || 'home' });
      }
      state.activeTabId = mod.id;
      closeSidebarIfFloating();
      saveState();
      renderAll();
    }

    function closeTab(tabId) {
      if (tabId === 'ana-ekran') return;
      const idx = state.openTabs.findIndex(t => t.id === tabId);
      if (idx === -1) return;
      state.openTabs.splice(idx, 1);
      if (state.activeTabId === tabId) {
        state.activeTabId = (state.openTabs[Math.max(0, idx - 1)] || state.openTabs[0]).id;
      }
      saveState();
      renderAll();
    }

    function toggleFavoriteActiveScreen() {
      const activeId = state.activeTabId;
      if (activeId === 'ana-ekran') {
        showToast('Favorilere eklemek için önce bir modül açın.');
        return;
      }
      const mod = getModuleById(activeId);
      const idx = state.favoriteScreens.findIndex(f => f.id === activeId);
      if (idx >= 0) {
        state.favoriteScreens.splice(idx, 1);
        showToast(mod.label + ' favorilerden çıkarıldı.');
      } else {
        state.favoriteScreens.unshift({ id: mod.id, label: mod.label });
        showToast(mod.label + ' favori ekranlara eklendi.');
      }
      saveState();
      renderAll();
    }

    /* =========================================================================
       SHELL RENDERERS
       ========================================================================= */
    function renderTopBar() {
      const wrap = document.getElementById('workspaceTabs');
      wrap.innerHTML = state.openTabs.map(tab => {
        const active = tab.id === state.activeTabId ? 'active' : '';
        const closeBtn = tab.id !== 'ana-ekran'
          ? `<span class="tab-close" data-action="close-tab" data-id="${tab.id}" title="Kapat">×</span>`
          : '';
        return `
          <div class="ws-tab ${active}" data-action="open-module" data-id="${tab.id}" role="tab" tabindex="0">
            ${ICONS[tab.icon] || ICONS.home}
            <span>${esc(tab.label)}</span>
            ${closeBtn}
          </div>
        `;
      }).join('');

      const starBtn = document.getElementById('starActiveBtn');
      starBtn.classList.toggle('is-favorited', state.favoriteScreens.some(f => f.id === state.activeTabId));
      document.getElementById('lastBackupText').textContent = state.lastBackup;
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      const sq = (state.sidebarQuery || '').trim().toLocaleLowerCase('tr-TR');

      const homeBtn = (!sq || 'masaüstü ana ekran dashboard'.includes(sq)) ? `
        <button type="button" class="nav-item ${state.activeTabId === 'ana-ekran' ? 'active' : ''}" data-action="open-module" data-id="ana-ekran">
          <span class="nav-item-left">
            ${ICONS.home}
            <span>Masaüstü (Genel Bakış)</span>
          </span>
          <span class="nav-item-badge">Ana Ekran</span>
        </button>
      ` : '';

      const groupsHtml = SIDEBAR_GROUPS.map(gName => {
        const items = MODULES.filter(m => m.group === gName && (!sq || `${m.label} ${m.keywords}`.toLocaleLowerCase('tr-TR').includes(sq)));
        if (items.length === 0) return '';
        const isCollapsed = !sq && !!(state.sidebarCollapsedGroups && state.sidebarCollapsedGroups[gName]);
        return `
          <div class="sidebar-group-header ${isCollapsed ? 'collapsed' : ''}" data-action="toggle-group" data-group="${esc(gName)}">
            <span>${esc(gName)}</span>
            ${ICONS.chevronDown}
          </div>
          <div class="sidebar-group-items ${isCollapsed ? 'collapsed' : ''}">
            ${items.map(m => `
              <button type="button" class="nav-item ${state.activeTabId === m.id ? 'active' : ''}" data-action="open-module" data-id="${m.id}">
                <span class="nav-item-left">
                  ${ICONS[m.icon]}
                  <span>${esc(m.label)}</span>
                </span>
                <span class="nav-item-badge">${esc(m.badge)}</span>
              </button>
            `).join('')}
          </div>
        `;
      }).join('');

      nav.innerHTML = homeBtn + groupsHtml;
      syncSidebarDOM();
    }

    function renderCenterStage() {
      const stage = document.getElementById('centerStage');
      if (state.activeTabId === 'ana-ekran') {
        stage.innerHTML = renderHomeStage();
        return;
      }
      const mod = getModuleById(state.activeTabId);
      switch (mod.viewType) {
        case 'purchases': stage.innerHTML = renderPurchasesView(mod); break;
        case 'sales': stage.innerHTML = renderSalesView(mod); break;
        case 'scale': stage.innerHTML = renderScaleView(mod); break;
        case 'parties': stage.innerHTML = renderPartiesView(mod); break;
        case 'inventory': stage.innerHTML = renderInventoryView(mod); break;
        case 'trades': stage.innerHTML = renderTradesView(mod); break;
        case 'cash': stage.innerHTML = renderCashView(mod); break;
        case 'instruments': stage.innerHTML = renderInstrumentsView(mod); break;
        case 'expenses': stage.innerHTML = renderExpensesView(mod); break;
        case 'due': stage.innerHTML = renderDueView(mod); break;
        case 'tools': stage.innerHTML = renderToolsView(mod); break;
        default: stage.innerHTML = renderAnalyticsView(mod); break;
      }
    }

    function renderAll() {
      renderTopBar();
      renderSidebar();
      renderCenterStage();

    /* =========================================================================
       MODALLAR
       ========================================================================= */
    function openModal(title, bodyHtml, footHtml) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      document.getElementById('modalFoot').innerHTML = footHtml || '';
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    function showShortcutPickerModal() {
      openModal(
        'Hızlı Modül ve İstasyon Aç (F10)',
        `
          <div class="form-field full">
            <input type="text" id="pickerFilterInput" placeholder="Köklü Agro modülü veya işlemi ara..." />
          </div>
          <div id="pickerList" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;">
            ${MODULES.map(m => `
              <button type="button" class="btn-secondary" style="justify-content:flex-start;" data-action="pick-module" data-id="${m.id}">
                <span style="color:var(--agro-green);display:inline-flex;">${ICONS[m.icon]}</span>
                <span>${esc(m.label)}</span>
              </button>
            `).join('')}
          </div>
        `,
        '<button type="button" class="btn-secondary" data-action="close-modal">Kapat</button>'
      );
      const inp = document.getElementById('pickerFilterInput');
      if (inp) {
        inp.focus();
        inp.addEventListener('input', () => {
          const val = inp.value.trim().toLocaleLowerCase('tr-TR');
          document.getElementById('pickerList').innerHTML = MODULES
            .filter(m => `${m.label} ${m.keywords}`.toLocaleLowerCase('tr-TR').includes(val))
            .map(m => `
              <button type="button" class="btn-secondary" style="justify-content:flex-start;" data-action="pick-module" data-id="${m.id}">
                <span style="color:var(--agro-green);display:inline-flex;">${ICONS[m.icon]}</span>
                <span>${esc(m.label)}</span>
              </button>
            `).join('');
        });
      }
    }

    function showBackupModal() {
      openModal(
        'Bulut Yedekleme & Zahire Veri Yönetimi',
        `<p style="color:var(--text-secondary);line-height:1.5;">Köklü Agro zahire veritabanı yedeğini JSON olarak indirebilir veya demo durumuna sıfırlayabilirsiniz.</p>`,
        `<button type="button" class="btn-secondary" data-action="reset-demo">Verileri Sıfırla</button>
         <button type="button" class="btn-primary" data-action="download-backup">JSON Yedek İndir</button>`
      );
    }

    /* =========================================================================
       EVENT LISTENERS
       ========================================================================= */
    document.getElementById('masterMenuBtn').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarCloseBtn').addEventListener('click', () => {
      state.sidebarPinned = false;
      state.sidebarOpen = false;
      saveState();
      syncSidebarDOM();
    });
    document.getElementById('sidebarPinBtn').addEventListener('click', () => {
      state.sidebarPinned = !state.sidebarPinned;
      state.sidebarOpen = state.sidebarPinned;
      saveState();
      syncSidebarDOM();
      showToast(state.sidebarPinned ? 'Sol menü ekrana sabitlendi.' : 'Sol menü açılır/kapanır moda alındı.');
    });
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarIfFloating);
    document.getElementById('sidebarFilterInput').addEventListener('input', (e) => {
      state.sidebarQuery = e.target.value;
      renderSidebar();
    });

    document.getElementById('starActiveBtn').addEventListener('click', toggleFavoriteActiveScreen);
    document.getElementById('cloudBackupBtn').addEventListener('click', showBackupModal);
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'F10') {
        e.preventDefault();
        showShortcutPickerModal();
      } else if (e.key === 'Escape') {
        closeModal();
        closeSidebarIfFloating();
      } else if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'homeModuleSearch') {
        const q = state.homeSearch.trim().toLocaleLowerCase('tr-TR');
        if (q) {
          const match = MODULES.find(m => `${m.label} ${m.keywords}`.toLocaleLowerCase('tr-TR').includes(q));
          if (match) openModule(match.id);
        }
      }
    });

    document.getElementById('centerStage').addEventListener('input', (e) => {
      if (e.target.id === 'homeModuleSearch') {
        const pos = e.target.selectionStart;
        state.homeSearch = e.target.value;
        renderCenterStage();
        const nextInp = document.getElementById('homeModuleSearch');
        if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
      } else if (e.target.id === 'moduleSearchInput') {
        const pos = e.target.selectionStart;
        state.tableFilter = e.target.value;
        renderCenterStage();
        const nextInp = document.getElementById('moduleSearchInput');
        if (nextInp) { nextInp.focus(); nextInp.setSelectionRange(pos, pos); }
      } else if (e.target.id === 'fxAmountInput') {
        state.fxAmount = e.target.value;
        renderCenterStage();
        const nextInp = document.getElementById('fxAmountInput');
        if (nextInp) nextInp.focus();
      }
    });

    document.getElementById('centerStage').addEventListener('change', (e) => {
      if (e.target.id === 'fxCurrencySelect') {
        state.fxCurrency = e.target.value;
        saveState();
        renderCenterStage();
      }
    });

    document.addEventListener('click', (e) => {
      const closeChip = e.target.closest('[data-action="close-tab"]');
      if (closeChip) {
        e.stopPropagation();
        closeTab(closeChip.dataset.id);
        return;
      }

      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'toggle-group') {
        toggleSidebarGroup(target.dataset.group);
      } else if (action === 'open-module') {
        openModule(target.dataset.id);
        if (target.dataset.sub) {
          state.subFilter = target.dataset.sub;
          renderCenterStage();
        }
      } else if (action === 'open-report') {
        openModule(target.dataset.id);
        showToast('Rapor açıldı.');
      } else if (action === 'pick-module') {
        closeModal();
        openModule(target.dataset.id);
      } else if (action === 'close-modal') {
        closeModal();
      } else if (action === 'set-subfilter') {
        state.subFilter = target.dataset.val;
        renderCenterStage();
      } else if (action === 'silo-giris') {
        const st = state.urunler.find(s => s.kod === target.dataset.sku);
        if (!st) return;
        st.miktar += 10000;
        saveState();
        renderCenterStage();
        showToast('+10.000 Kg ' + st.ad + ' silo girişi yapıldı.');
      } else if (action === 'cari-tahsilat') {
        const cari = state.cariler.find(c => c.kod === target.dataset.kod);
        if (!cari) return;
        if (cari.rol === 'Müstahsil') {
          cari.alacak = Math.max(0, cari.alacak - 25000);
          state.kasaHareketleri.unshift({
            id: 'ÖD-' + Math.floor(100 + Math.random() * 900),
            tarih: state.currentDate + ' 15:20',
            kanal: 'Banka',
            islem: 'Müstahsil Ödemesi',
            cari: cari.unvan,
            aciklama: cari.unvan + ' hasat ödemesi',
            giris: 0,
            cikis: 25000
          });
          showToast('25.000,00 ₺ çiftçi hasat ödemesi yapıldı.');
        } else {
          cari.borc = Math.max(0, cari.borc - 50000);
          state.kasaHareketleri.unshift({
            id: 'TH-' + Math.floor(100 + Math.random() * 900),
            tarih: state.currentDate + ' 15:25',
            kanal: 'Banka',
            islem: 'Tahsilat',
            cari: cari.unvan,
            aciklama: cari.unvan + ' tahsilatı',
            giris: 50000,
            cikis: 0
          });
          showToast('50.000,00 ₺ müşteri tahsilatı işlendi.');
        }
        saveState();
        renderCenterStage();
      } else if (action === 'modal-new-kantar') {
        openModal(
          'Yeni Kantar Fişi Kes',
          `<div class="form-grid">
             <div class="form-field"><label>Araç Plakası</label><input id="nkPlaka" placeholder="42 KNT 101" /></div>
             <div class="form-field"><label>Şoför Adı</label><input id="nkSofor" placeholder="Şoför adı" /></div>
             <div class="form-field"><label>Hububat Cinsi</label><select id="nkUrun">${state.urunler.map(u => `<option>${esc(u.ad)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Muhatap Cari</label><select id="nkCari">${state.cariler.map(c => `<option>${esc(c.unvan)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Brüt Tartım (Kg)</label><input type="number" id="nkBrut" value="36500" /></div>
             <div class="form-field"><label>Dara (Kg)</label><input type="number" id="nkDara" value="12500" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-kantar">Fişi Kaydet & Tartımı Onayla</button>`
        );
      } else if (action === 'save-new-kantar') {
        const plaka = (document.getElementById('nkPlaka').value || '').trim();
        if (!plaka) { showToast('Plaka girin.'); return; }
        const brut = Number(document.getElementById('nkBrut').value) || 0;
        const dara = Number(document.getElementById('nkDara').value) || 0;
        const net = Math.max(0, brut - dara);
        const urun = document.getElementById('nkUrun').value;
        state.kantarFisleri.unshift({
          no: 'KNT-2026-0' + (state.kantarFisleri.length + 5),

          sofor: document.getElementById('nkSofor').value || 'Saha Şoförü',
          urun,
          cari: document.getElementById('nkCari').value,
          brut,
          dara,
          net,
          tarih: state.currentDate + ' 16:00',
          durum: 'Boşaltıldı'
        });
        const st = state.urunler.find(u => u.ad === urun);
        if (st) st.miktar += net;
        saveState(); closeModal(); renderCenterStage(); showToast('Kantar fişi kesildi, +' + fmtKg(net) + ' stoğa eklendi.');
      } else if (action === 'modal-new-mustahsil') {
        openModal(
          'Yeni Müstahsil Makbuzu',
          `<div class="form-grid">
             <div class="form-field full"><label>Çiftçi / Müstahsil</label><select id="nmCari">${state.cariler.filter(c => c.rol === 'Müstahsil').map(c => `<option>${esc(c.unvan)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Hububat</label><select id="nmUrun">${state.urunler.map(u => `<option>${esc(u.ad)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Miktar (Kg)</label><input type="number" id="nmMiktar" value="20000" /></div>
             <div class="form-field"><label>Birim Fiyat (₺/Kg)</label><input type="number" step="0.10" id="nmFiyat" value="8.50" /></div>
             <div class="form-field"><label>Stopaj Oranı (%)</label><input type="number" id="nmStopaj" value="2" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-mustahsil">Makbuzu Kes & Onayla</button>`
        );
      } else if (action === 'save-new-mustahsil') {
        const cariUnvan = document.getElementById('nmCari').value;
        const urunAd = document.getElementById('nmUrun').value;
        const kg = Number(document.getElementById('nmMiktar').value) || 0;
        const birimFiyat = Number(document.getElementById('nmFiyat').value) || 0;
        const stopajPct = Number(document.getElementById('nmStopaj').value) || 2;
        const brut = kg * birimFiyat;
        const kesinti = brut * (stopajPct / 100);
        const netTutar = brut - kesinti;

        state.ticaretKayitlari.unshift({
          no: 'MS-2026-0' + (state.ticaretKayitlari.length + 3),
          tur: 'Müstahsil Alışı',
          cari: cariUnvan,
          urun: urunAd,
          miktarKg: kg,
          birimFiyat,
          tutar: brut,
          kesinti,
          netTutar,
          tarih: state.currentDate,
          durum: 'Onaylandı'
        });
        const cari = state.cariler.find(c => c.unvan === cariUnvan);
        if (cari) cari.alacak += netTutar;
        const st = state.urunler.find(u => u.ad === urunAd);
        if (st) st.miktar += kg;
        saveState(); closeModal(); renderCenterStage(); showToast('Müstahsil makbuzu kaydedildi.');
      } else if (action === 'modal-new-satis') {
        openModal(
          'Yeni Toptan Mal Satışı (Fatura)',
          `<div class="form-grid">
             <div class="form-field full"><label>Müşteri / Fabrika</label><select id="nsCari">${state.cariler.filter(c => c.rol === 'Müşteri').map(c => `<option>${esc(c.unvan)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Hububat</label><select id="nsUrun">${state.urunler.map(u => `<option>${esc(u.ad)}</option>`).join('')}</select></div>
             <div class="form-field"><label>Miktar (Kg)</label><input type="number" id="nsMiktar" value="25000" /></div>
             <div class="form-field"><label>Satış Fiyatı (₺/Kg)</label><input type="number" step="0.10" id="nsFiyat" value="11.50" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-satis">Satışı Faturalandır</button>`
        );
      } else if (action === 'save-new-satis') {
        const cariUnvan = document.getElementById('nsCari').value;
        const urunAd = document.getElementById('nsUrun').value;
        const kg = Number(document.getElementById('nsMiktar').value) || 0;
        const birimFiyat = Number(document.getElementById('nsFiyat').value) || 0;
        const brut = kg * birimFiyat;
        state.ticaretKayitlari.unshift({
          no: 'ST-2026-0' + (state.ticaretKayitlari.length + 3),
          tur: 'Mal Satışı',
          cari: cariUnvan,
          urun: urunAd,
          miktarKg: kg,
          birimFiyat,
          tutar: brut,
          kesinti: 0,
          netTutar: brut,
          tarih: state.currentDate,
          durum: 'Faturalandı'
        });
        const cari = state.cariler.find(c => c.unvan === cariUnvan);
        if (cari) cari.borc += brut;
        const st = state.urunler.find(u => u.ad === urunAd);
        if (st) st.miktar = Math.max(0, st.miktar - kg);
        saveState(); closeModal(); renderCenterStage(); showToast('Mal satışı faturalandırıldı.');
      } else if (action === 'modal-new-cari') {
        openModal(
          'Yeni Cari / Çiftçi Hesabı',
          `<div class="form-grid">
             <div class="form-field full"><label>Ünvan / Ad Soyad</label><input id="ncUnvan" placeholder="Örn: Hasan Yılmaz (Müstahsil Çiftçi)" /></div>
             <div class="form-field"><label>Rol</label><select id="ncRol"><option>Müstahsil</option><option>Müşteri</option><option>Tedarikçi</option></select></div>
             <div class="form-field"><label>Şehir / İlçe</label><input id="ncSehir" value="Konya" /></div>
             <div class="form-field full"><label>ÇKS No / VKN</label><input id="ncCks" placeholder="ÇKS-2026-XXXX veya VKN" /></div>
             <div class="form-field full"><label>Banka & IBAN</label><input id="ncBanka" placeholder="Ziraat Bankası TR..." /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-cari">Kaydet</button>`
        );
      } else if (action === 'save-new-cari') {
        const unvan = (document.getElementById('ncUnvan').value || '').trim();
        if (!unvan) { showToast('Cari ünvanı girin.'); return; }
        state.cariler.unshift({
          kod: 'CR-000' + (state.cariler.length + 1),
          unvan,
          rol: document.getElementById('ncRol').value,
          sehir: document.getElementById('ncSehir').value || 'Konya',
          cksNo: document.getElementById('ncCks').value || '-',
          banka: document.getElementById('ncBanka').value || 'T.C. Ziraat Bankası',
          borc: 0,
          alacak: 0,
          tel: '05XX XXX XX XX'
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Cari kaydedildi.');
      } else if (action === 'modal-new-kasa') {
        openModal(
          'Yeni Kasa / Banka Fişi',
          `<div class="form-grid">
             <div class="form-field"><label>Hesap / Kanal</label><select id="nkKanal"><option>Banka</option><option>Kasa</option></select></div>
             <div class="form-field"><label>İşlem Yönü</label><select id="nkYon"><option value="giris">Tahsilat (+ Giriş)</option><option value="cikis">Ödeme (- Çıkış)</option></select></div>
             <div class="form-field full"><label>Muhatap</label><select id="nkCari">${state.cariler.map(c => `<option>${esc(c.unvan)}</option>`).join('')}</select></div>
             <div class="form-field full"><label>Tutar (₺)</label><input type="number" id="nkTutar" value="45000" /></div>
             <div class="form-field full"><label>Açıklama</label><input id="nkAciklama" placeholder="Hububat tahsilat veya tediye fişi" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-kasa">Fişi Kaydet</button>`
        );
      } else if (action === 'save-new-kasa') {
        const kanal = document.getElementById('nkKanal').value;
        const yon = document.getElementById('nkYon').value;
        const tutar = Number(document.getElementById('nkTutar').value) || 0;
        state.kasaHareketleri.unshift({
          id: (yon === 'giris' ? 'TH-' : 'ÖD-') + Math.floor(100 + Math.random() * 900),
          tarih: state.currentDate + ' 16:15',
          kanal,
          islem: yon === 'giris' ? 'Tahsilat' : 'Tediye',
          cari: document.getElementById('nkCari').value,
          aciklama: (document.getElementById('nkAciklama').value || '').trim() || (kanal + ' işlemi'),
          giris: yon === 'giris' ? tutar : 0,
          cikis: yon === 'cikis' ? tutar : 0
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Fiş kaydedildi.');
      } else if (action === 'modal-new-ceksenet') {
        openModal(
          'Yeni Çek / Senet Kaydı',
          `<div class="form-grid">
             <div class="form-field"><label>Evrak Türü</label><select id="ncsTur"><option>Müşteri Çeki</option><option>Borç Senedi</option></select></div>
             <div class="form-field"><label>Vade Tarihi</label><input id="ncsVade" value="28.12.2026" /></div>
             <div class="form-field full"><label>Keşideci / Muhatap</label><input id="ncsKesideci" value="Bereket Un A.Ş." /></div>
             <div class="form-field full"><label>Tutar (₺)</label><input type="number" id="ncsTutar" value="75000" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-ceksenet">Kaydet</button>`
        );
      } else if (action === 'save-new-ceksenet') {
        const tur = document.getElementById('ncsTur').value;
        state.cekSenetler.unshift({
          no: (tur.includes('Çek') ? 'ÇK-' : 'SN-') + Math.floor(4000 + Math.random() * 5000),
          tur,
          vade: document.getElementById('ncsVade').value || '30.12.2026',
          kesideci: document.getElementById('ncsKesideci').value || 'Muhatap',
          banka: 'Ticari Portföy',
          tutar: Number(document.getElementById('ncsTutar').value) || 0,
          durum: tur.includes('Borç') ? 'Ödenecek' : 'Portföyde'
        });
        saveState(); closeModal(); renderCenterStage(); showToast(`${tur} kaydedildi.`);
      } else if (action === 'print-page') {
        window.print();
      } else if (action === 'download-backup') {
        state.lastBackup = 'Yedek İndirildi';
        saveState();
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'koklu_agro_erp_yedek.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        closeModal();
        renderTopBar();
        showToast('JSON yedeği indirildi.');
      } else if (action === 'reset-demo') {
        try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
        state = createInitialState();
        closeModal();
        renderAll();
        showToast('Tüm Köklü Agro demo verileri sıfırlandı.');
      }
    });

    renderAll();
  </script>
</body>
</html>
