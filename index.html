<!DOCTYPE html>
<html lang="tr">
<head>
  <meta name="robots" content="noindex,follow" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Köklü Agro Pro+ — Kurumsal Zahire & Tarım ERP</title>
  <style>
    :root {
      --agro-green: #0b6e52;
      --agro-green-dark: #074e3a;
      --agro-green-soft: #e5f6ef;
      --agro-green-border: #b5e4d2;
      --agro-amber: #b86e0c;
      --agro-amber-soft: #fef4e2;
      --agro-amber-dark: #8c5104;
      --agro-emerald: #059669;
      --agro-red: #dc2626;
      --agro-blue: #1e56c5;
      --agro-charcoal: #0d1e18;
      --agro-side: #0a1813;
      --agro-side-elev: #122820;
      --agro-tray-top: #c5d4ce;
      --agro-tray-bot: #b4c6be;
      --bg-canvas: #f2f6f4;
      --bg-card: #ffffff;
      --border-soft: #d8e4df;
      --border-strong: #bfd3cb;
      --text-primary: #10231c;
      --text-secondary: #425950;
      --text-muted: #60796f;
      --navy-header: #0d211a;
      --shadow-card: 0 2px 8px rgba(11, 38, 30, 0.05);
      --shadow-icon: 0 4px 10px rgba(7, 78, 58, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      --shadow-modal: 0 22px 54px rgba(10, 30, 24, 0.32);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
    }

    /* =======================================================================
       APP SHELL — SINGLE UNIFIED TOP BAR
       ======================================================================= */
    .erp-app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 46px;
      padding: 0 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-soft);
      flex-shrink: 0;
      z-index: 30;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-left::-webkit-scrollbar {
      display: none;
    }

    .menu-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 13px;
      border-radius: 7px;
      background: var(--agro-green);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      flex-shrink: 0;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px rgba(11, 110, 82, 0.25);
    }
    .menu-toggle-btn:hover {
      background: var(--agro-green-dark);
      transform: translateY(-1px);
    }
    .menu-toggle-btn.is-open {
      background: var(--agro-green-dark);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }
    .menu-toggle-btn svg {
      width: 15px;
      height: 15px;
    }

    .bar-divider {
      width: 1px;
      height: 20px;
      background: var(--border-soft);
      flex-shrink: 0;
    }

    /* Workspace Tabs */
    .tabs-strip {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .ws-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 31px;
      padding: 0 11px;
      border-radius: 7px;
      background: #f0f5f2;
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .ws-tab:hover {
      background: #e2ede8;
      color: var(--text-primary);
    }
    .ws-tab.active {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
      border-color: var(--agro-green-border);
      font-weight: 700;
    }
    .ws-tab svg {
      width: 13.5px;
      height: 13.5px;
      flex-shrink: 0;
    }
    .tab-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 4px;
      font-size: 13px;
      color: #60796f;
    }
    .tab-close:hover {
      background: rgba(11, 110, 82, 0.15);
      color: var(--agro-green-dark);
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 31px;
      padding: 0 10px;
      border-radius: 7px;
      background: #f6faf8;
      border: 1px solid var(--border-soft);
      color: #2b3d35;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.14s ease;
    }
    .icon-action-btn:hover {
      background: #e8f2ee;
    }
    .icon-action-btn.is-favorited {
      color: #b45309;
      border-color: #fcd34d;
      background: #fffbeb;
    }
    .icon-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      flex-shrink: 0;
    }

    .company-pill {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-primary);
      padding-left: 4px;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .company-badge-tag {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
      border: 1px solid var(--agro-green-border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }
    .company-pill span {
      color: var(--text-muted);
      font-weight: 500;
    }

    /* =======================================================================
       COLLAPSIBLE / ACCORDION LEFT SIDEBAR (OPEN / CLOSED / PINNED)
       ======================================================================= */
    .erp-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 24, 0.45);
      z-index: 45;
      backdrop-filter: blur(2px);
      transition: opacity 0.2s ease;
    }
    .sidebar-overlay.open {
      display: block;
    }

    .left-sidebar {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 268px;
      background: var(--agro-side);
      color: #dcece5;
      display: flex;
      flex-direction: column;
      z-index: 55;
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1), width 0.2s ease;
      box-shadow: 10px 0 32px rgba(6, 24, 18, 0.4);
      user-select: none;
    }
    .left-sidebar.open {
      transform: translateX(0);
    }
    .erp-body.sidebar-pinned .left-sidebar {
      position: relative;
      transform: translateX(0);
      box-shadow: none;
      border-right: 1px solid #143226;
      flex-shrink: 0;
    }
    .erp-body.sidebar-pinned .sidebar-overlay {
      display: none !important;
    }

    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: linear-gradient(90deg, #074e3a 0%, #0b6e52 100%);
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }
    .sidebar-head-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .sidebar-head-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sidebar-icon-btn {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      color: rgba(255, 255, 255, 0.85);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: background 0.12s ease;
    }
    .sidebar-icon-btn:hover, .sidebar-icon-btn.pinned {
      background: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }

    .sidebar-search-wrap {
      padding: 10px 12px 6px;
    }
    .sidebar-search-input {
      width: 100%;
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      border: 1px solid #1c3e30;
      background: #11261e;
      color: #e8f5f0;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .sidebar-search-input::placeholder {
      color: #729688;
    }
    .sidebar-search-input:focus {
      border-color: #10b981;
      background: #142e24;
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 14px;
      scrollbar-width: thin;
      scrollbar-color: #1c3e30 transparent;
    }
    .sidebar-nav::-webkit-scrollbar {
      width: 5px;
    }
    .sidebar-nav::-webkit-scrollbar-thumb {
      background: #1c3e30;
      border-radius: 4px;
    }

    /* Accordion groups in sidebar */
    .sidebar-group-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #8cb3a3;
      padding: 12px 8px 6px;
      cursor: pointer;
      border-radius: 5px;
      transition: color 0.12s ease;
    }
    .sidebar-group-header:hover {
      color: #dcece5;
    }
    .sidebar-group-header svg {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease;
      color: #608878;
    }
    .sidebar-group-header.collapsed svg {
      transform: rotate(-90deg);
    }
    .sidebar-group-items {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sidebar-group-items.collapsed {
      display: none;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      padding: 7px 10px;
      border-radius: 7px;
      color: #c9ded5;
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      margin-bottom: 2px;
      transition: all 0.12s ease;
    }
    .nav-item-left {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .nav-item:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      transform: translateX(2px);
    }
    .nav-item.active {
      background: var(--agro-green);
      color: #ffffff;
      font-weight: 700;
    }
    .nav-item svg {
      width: 15px;
      height: 15px;
      color: #4ade80;
      flex-shrink: 0;
    }
    .nav-item.active svg {
      color: #ffffff;
    }
    .nav-item-badge {
      font-size: 9.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #dcece5;
    }
    .nav-item.active .nav-item-badge {
      background: rgba(0, 0, 0, 0.2);
      color: #ffffff;
    }

    .sidebar-foot {
      padding: 10px 12px;
      border-top: 1px solid #143226;
      background: #081510;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: #729688;
    }
    .sidebar-foot strong {
      color: #c9ded5;
      font-weight: 700;
    }

    /* =======================================================================
       MAIN SCROLLABLE STAGE
       ======================================================================= */
    .center-stage {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 14px 20px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .center-stage > * {
      flex-shrink: 0;
    }

    /* =========================================================================
       1. TOP EXECUTIVE KÖKLÜ AGRO KPI CARDS (Enterprise Standard - Silicon Valley Grade)
       ========================================================================= */
    .netsis-kpi-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 14px;
    }

    .netsis-kpi-card {
      position: relative;
      background: #ffffff;
      border: 1px solid rgba(203, 213, 225, 0.85);
      border-radius: 14px;
      padding: 16px 18px 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04), 0 6px 18px -4px rgba(15, 23, 42, 0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      text-align: left;
      overflow: hidden;
      text-decoration: none;
      user-select: none;
      animation: kpiStaggerIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }
    .netsis-kpi-card:nth-child(1) { animation-delay: 0.04s; }
    .netsis-kpi-card:nth-child(2) { animation-delay: 0.10s; }
    .netsis-kpi-card:nth-child(3) { animation-delay: 0.16s; }
    .netsis-kpi-card:nth-child(4) { animation-delay: 0.22s; }

    @keyframes kpiStaggerIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Top Accent Gradient Border Strip */
    .netsis-kpi-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3.5px;
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
      transition: height 0.2s ease;
    }

    .netsis-kpi-card.kpi-emerald::before {
      background: linear-gradient(90deg, #10b981 0%, #059669 100%);
    }
    .netsis-kpi-card.kpi-amber::before {
      background: linear-gradient(90deg, #f59e0b 0%, #d97706 100%);
    }
    .netsis-kpi-card.kpi-blue::before {
      background: linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);
    }
    .netsis-kpi-card.kpi-purple::before {
      background: linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%);
    }
    .netsis-kpi-card.kpi-red::before {
      background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
    }

    .netsis-kpi-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(16, 185, 129, 0.25);
      border-color: rgba(16, 185, 129, 0.45);
    }
    .netsis-kpi-card.kpi-amber:hover {
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(245, 158, 11, 0.25);
      border-color: rgba(245, 158, 11, 0.45);
    }
    .netsis-kpi-card.kpi-blue:hover {
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(59, 130, 246, 0.25);
      border-color: rgba(59, 130, 246, 0.45);
    }
    .netsis-kpi-card.kpi-purple:hover {
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(139, 92, 246, 0.25);
      border-color: rgba(139, 92, 246, 0.45);
    }
    .netsis-kpi-card.kpi-red:hover {
      box-shadow: 0 14px 30px -6px rgba(15, 23, 42, 0.10), 0 0 0 1px rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.45);
    }

    .netsis-kpi-card:hover::before {
      height: 4.5px;
    }

    /* Top Row: Meta + Icon */
    .kpi-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
    }

    .kpi-meta {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .kpi-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #64748b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin: 0;
    }

    .kpi-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2.5px 8px;
      border-radius: 9999px;
      font-size: 10.5px;
      font-weight: 700;
      width: fit-content;
      white-space: nowrap;
      letter-spacing: -0.1px;
    }

    .kpi-badge.badge-emerald {
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }
    .kpi-badge.badge-amber {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }
    .kpi-badge.badge-blue {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }
    .kpi-badge.badge-purple {
      background: #f5f3ff;
      color: #6d28d9;
      border: 1px solid #ddd6fe;
    }
    .kpi-badge.badge-red {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .kpi-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }
    .badge-emerald .kpi-pulse {
      background: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }
    .badge-amber .kpi-pulse {
      background: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.25);
    }
    .badge-blue .kpi-pulse {
      background: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    .badge-purple .kpi-pulse {
      background: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
    }
    .badge-red .kpi-pulse {
      background: #ef4444;
      box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.25);
    }

    .kpi-icon-wrap {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }
    .netsis-kpi-card:hover .kpi-icon-wrap {
      transform: scale(1.08);
    }
    .kpi-icon-wrap svg {
      width: 19px;
      height: 19px;
    }
    .icon-emerald { background: #d1fae5; color: #059669; }
    .icon-amber   { background: #fef3c7; color: #d97706; }
    .icon-blue    { background: #dbeafe; color: #2563eb; }
    .icon-purple  { background: #ede9fe; color: #7c3aed; }
    .icon-red     { background: #fee2e2; color: #dc2626; }

    /* Number & Unit */
    .kpi-value {
      font-size: 21px;
      font-weight: 850;
      letter-spacing: -0.4px;
      font-variant-numeric: tabular-nums;
      color: #0f172a;
      line-height: 1.2;
      margin: 2px 0;
    }

    /* Progress bar */
    .kpi-progress {
      width: 100%;
      height: 4px;
      background: #f1f5f9;
      border-radius: 9999px;
      overflow: hidden;
      margin: 1px 0 2px;
    }
    .kpi-progress-bar {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bar-emerald { background: linear-gradient(90deg, #10b981, #059669); }
    .bar-amber   { background: linear-gradient(90deg, #f59e0b, #d97706); }
    .bar-blue    { background: linear-gradient(90deg, #3b82f6, #2563eb); }
    .bar-purple  { background: linear-gradient(90deg, #8b5cf6, #6366f1); }
    .bar-red     { background: linear-gradient(90deg, #ef4444, #dc2626); }

    /* Footer: Description + Action Arrow */
    .kpi-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 5px;
      border-top: 1px solid #f8fafc;
    }
    .kpi-desc {
      font-size: 11.5px;
      color: #64748b;
      font-weight: 500;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .kpi-arrow {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: transform 0.18s ease, color 0.18s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .netsis-kpi-card:hover .kpi-arrow {
      transform: translateX(3px);
      color: var(--agro-green);
    }

    /* Fallback / Direct rules for unnested cards */
    .netsis-kpi-card > .kpi-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 2px;
    }
    .netsis-kpi-card > .kpi-desc {
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
      margin-top: 2px;
    }

    /* 2. NETSİS SHORTCUT LAUNCHER TRAY */
    .netsis-launcher-tray {
      position: relative;
      background: linear-gradient(155deg, var(--agro-tray-top) 0%, var(--agro-tray-bot) 100%);
      border: 1px solid #9cb1a7;
      border-radius: 15px;
      padding: 16px 20px 20px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 4px 14px rgba(11, 38, 30, 0.06);
      overflow: hidden;
    }
    .netsis-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 7px;
      color: rgba(11, 38, 30, 0.04);
      transform: rotate(-8deg);
      pointer-events: none;
      user-select: none;
    }

    .netsis-search-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }
    .netsis-search-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(540px, 100%);
      height: 38px;
      padding: 0 14px;
      background: #ffffff;
      border: 1px solid rgba(11, 38, 30, 0.15);
      border-radius: 999px;
      box-shadow: 0 2px 8px rgba(11, 38, 30, 0.08);
      transition: all 0.15s ease;
    }
    .netsis-search-pill:focus-within {
      border-color: var(--agro-green);
      box-shadow: 0 0 0 3px rgba(11, 110, 82, 0.18);
    }
    .netsis-search-pill svg {
      width: 15px;
      height: 15px;
      color: var(--agro-green);
      flex-shrink: 0;
    }
    .netsis-search-pill input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 12.5px;
      color: var(--text-primary);
    }
    .netsis-search-pill input::placeholder {
      color: var(--text-muted);
    }
    .kbd-badge {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--agro-green-dark);
      background: var(--agro-green-soft);
      border: 1px solid var(--agro-green-border);
      border-radius: 999px;
      padding: 1px 7px;
      flex-shrink: 0;
    }

    /* Symmetrical 6x2 Grid */
    .modules-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px 12px;
    }

    .module-tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      padding: 8px 4px 6px;
      border-radius: 10px;
      text-align: center;
      transition: transform 0.14s ease, background 0.14s ease;
      cursor: pointer;
    }
    .module-tile:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.38);
    }

    .netsis-app-icon {
      position: relative;
      width: 54px;
      height: 54px;
      border-radius: 13px;
      background: linear-gradient(180deg, #0e8563 0%, #074e3a 100%);
      box-shadow: var(--shadow-icon);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .module-tile:hover .netsis-app-icon {
      transform: scale(1.04);
    }
    .netsis-app-icon svg {
      width: 26px;
      height: 26px;
      color: #ffffff;
    }
    .netsis-app-icon.icon-amber {
      background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
      box-shadow: 0 4px 10px rgba(184, 110, 12, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }
    .netsis-app-icon.icon-blue {
      background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
      box-shadow: 0 4px 10px rgba(30, 86, 197, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .tile-label {
      font-size: 12px;
      font-weight: 700;
      color: #0d1e18;
      line-height: 1.24;
    }

    .netsis-tile-badge {
      position: absolute;
      top: -6px;
      right: -10px;
      background: #ffffff;
      color: var(--agro-green-dark);
      border: 1.5px solid var(--agro-green);
      border-radius: 999px;
      padding: 0.5px 6px;
      font-size: 9.5px;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
      box-shadow: 0 1px 3px rgba(11, 38, 30, 0.16);
    }
    .netsis-tile-badge.badge-ok {
      color: #059669;
      border-color: #059669;
      background: #f0fdf4;
    }

    /* 3. CHARTS ROW */
    .netsis-charts-grid {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 14px;
    }
    .netsis-chart-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-top: 3px solid var(--agro-green);
      border-radius: 11px;
      padding: 13px 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chart-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chart-card-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .chart-legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 4px;
    }

    .donut-wrap {
      display: grid;
      grid-template-columns: 128px 1fr;
      gap: 14px;
      align-items: center;
    }
    .aging-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .aging-row-top {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
      font-weight: 600;
      margin-bottom: 3px;
    }
    .aging-track {
      height: 7px;
      border-radius: 999px;
      background: #eef2f0;
      overflow: hidden;
    }
    .aging-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* 4. FAVORİLER GRİDİ */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .fav-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 11px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .fav-card-header {
      background: var(--navy-header);
      border-bottom: 2px solid var(--agro-green);
      color: #ffffff;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .fav-card-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fav-card-title svg {
      width: 14.5px;
      height: 14.5px;
      color: #34d399;
    }
    .fav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 15px;
      border-bottom: 1px solid #edf3f0;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      text-align: left;
      transition: background 0.12s ease;
    }
    .fav-row:last-child { border-bottom: none; }
    .fav-row:hover {
      background: var(--agro-green-soft);
      color: var(--agro-green-dark);
    }
    .fav-row-hint {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--agro-green);
      opacity: 0;
      transition: opacity 0.12s ease;
    }
    .fav-row:hover .fav-row-hint { opacity: 1; }

    /* =======================================================================
       MODULE SUB-SCREENS
       ======================================================================= */
    .module-view {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .view-topbar, .view-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-left: 4px solid var(--agro-green);
      border-radius: 11px;
      padding: 12px 16px;
      flex-wrap: wrap;
    }
    .view-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .view-title-wrap h2 {
      font-size: 16.5px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .view-title-wrap svg,
    .view-header svg,
    .view-topbar svg {
      width: 22px;
      height: 22px;
      max-width: 24px;
      max-height: 24px;
    }
    .view-topbar .netsis-app-icon svg {
      width: 24px;
      height: 24px;
    }
    .view-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .subfilter-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .subfilter-pill {
      height: 29px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f0f5f2;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: all 0.14s ease;
    }
    .subfilter-pill:hover {
      background: #e2ece7;
      color: var(--text-primary);
    }
    .subfilter-pill.active {
      background: var(--agro-green);
      color: #ffffff;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 14px;
      border-radius: 8px;
      background: var(--agro-green);
      color: #ffffff;
      font-weight: 700;
      font-size: 12.5px;
      transition: background 0.14s ease;
    }
    .btn-primary:hover { background: var(--agro-green-dark); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 34px;
      padding: 0 13px;
      border-radius: 8px;
      background: #f6faf8;
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 12.5px;
      transition: all 0.14s ease;
    }
    .btn-secondary:hover { background: #e8f2ee; }

    .panel-card {
      background: #ffffff;
      border: 1px solid var(--border-soft);
      border-radius: 11px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }
    .panel-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 15px;
      border-bottom: 1px solid #edf3f0;
      flex-wrap: wrap;
    }
    .inline-filter-input {
      height: 33px;
      padding: 0 11px;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      width: min(270px, 100%);
      background: #f8faf9;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .inline-filter-input:focus {
      background: #ffffff;
      border-color: var(--agro-green);
    }

    .table-scroll {
      width: 100%;
      overflow-x: auto;
    }
    .erp-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }
    .erp-table th {
      background: #f6faf8;
      color: var(--text-secondary);
      font-size: 11.5px;
      font-weight: 700;
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }
    .erp-table td {
      padding: 10px 14px;
      border-bottom: 1px solid #f1f6f4;
      font-size: 12.5px;
      color: var(--text-primary);
      vertical-align: middle;
    }
    .erp-table tr:hover td { background: #f3faf6; }
    .num-col {
      text-align: right !important;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-amber { background: #fef3c7; color: #92400e; }
    .badge-red   { background: #fee2e2; color: #991b1b; }
    .badge-blue  { background: #e0f2fe; color: #075985; }
    .badge-agro  { background: var(--agro-green-soft); color: var(--agro-green-dark); }
    .badge-slate { background: #e2e8f0; color: #334155; }

    /* MODAL & TOAST */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 30, 24, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 90;
      backdrop-filter: blur(2px);
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #ffffff;
      width: min(540px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 13px;
      border: 1px solid var(--border-soft);
      box-shadow: var(--shadow-modal);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      background: linear-gradient(90deg, #074e3a 0%, #0b6e52 100%);
      color: #ffffff;
    }
    .modal-head h3 { font-size: 14px; font-weight: 700; }
    .modal-close-btn {
      color: #bbf7d0;
      font-size: 18px;
      width: 26px;
      height: 26px;
      border-radius: 6px;
    }
    .modal-close-btn:hover { background: rgba(255, 255, 255, 0.18); color: #ffffff; }
    .modal-body {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .form-field input, .form-field select {
      height: 35px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: #ffffff;
      outline: none;
    }
    .form-field input:focus, .form-field select:focus { border-color: var(--agro-green); }
    .modal-foot {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 18px;
      background: #f8faf9;
      border-top: 1px solid #edf3f0;
    }

    .toast-stack {
      position: fixed;
      right: 18px;
      bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 110;
      pointer-events: none;
    }
    .toast-item {
      background: var(--agro-charcoal);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 12.5px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(10, 30, 24, 0.32);
      border-left: 4px solid var(--agro-green);
    }

    @media (max-width: 1040px) {
      .modules-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .netsis-kpi-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .netsis-charts-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .modules-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .netsis-kpi-row, .favorites-grid, .donut-wrap, .form-grid { grid-template-columns: 1fr; }
      .company-pill { display: none; }
    }

    @media print {
      .top-bar, .left-sidebar, .view-actions { display: none !important; }
      html, body, .erp-app, .erp-body, .center-stage { height: auto; overflow: visible; background: #fff !important; }
    }
  
    /* ROW COMPACT ACTIONS (Zero Layout Breaking) */
    .row-actions {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      white-space: nowrap;
    }
    .btn-row-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 25px;
      height: 25px;
      border-radius: 6px;
      border: 1px solid #dce5e0;
      background: #ffffff;
      color: #64748b;
      cursor: pointer;
      transition: all 0.12s ease;
      padding: 0;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      flex-shrink: 0;
    }
    .btn-row-action:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #0f172a;
      transform: translateY(-1px);
    }
    .btn-row-action.action-edit:hover {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
    }
    .btn-row-action.action-delete:hover {
      background: #fef2f2;
      border-color: #fecaca;
      color: #b91c1c;
    }

    /* 5-SECOND QUICK USAGE GUIDE BANNER (Clean Professional Design) */
    .page-quick-guide {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 3.5px solid var(--agro-green);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
    }
    .guide-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .guide-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.5px;
      flex-shrink: 0;
      line-height: 1;
    }
    .guide-badge svg {
      width: 14px !important;
      height: 14px !important;
      max-width: 14px !important;
      max-height: 14px !important;
      color: #047857;
      flex-shrink: 0;
    }
    .guide-title {
      font-size: 12.5px;
      font-weight: 700;
      color: #0f172a;
    }
    .guide-steps {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    @media (max-width: 900px) {
      .guide-steps { grid-template-columns: 1fr; gap: 8px; }
    }
    .guide-step-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid #e2ece6;
      border-radius: 7px;
      padding: 7px 10px;
    }
    .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #dcfce7;
      color: #065f46;
      font-size: 11px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .step-content {
      font-size: 11.5px;
      color: #1e293b;
      line-height: 1.35;
    }
    .step-content strong {
      display: block;
      color: #0f172a;
      font-weight: 700;
      margin-bottom: 2px;
    }

    /* USER SWITCHER PILL IN TOPBAR */
    .user-pill-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 31px;
      padding: 0 10px;
      border-radius: 999px;
      background: #f6faf8;
      border: 1px solid var(--border-soft);
      color: #1b2e26;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .user-pill-btn:hover {
      background: #eef7f2;
      border-color: #b8d4c5;
    }
    .user-avatar-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #dcfce7;
      font-size: 11px;
    }
    .user-pill-name {
      font-weight: 700;
      color: #0b261e;
    }
    .user-pill-role {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
      background: #e2ece6;
      color: #2b4237;
    }

    /* WORKFLOW PIPELINE & GUIDE STYLES */
    .workflow-pipeline {
      display: flex;
      align-items: stretch;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 2px 12px;
      scrollbar-width: thin;
    }
    .workflow-node {
      flex: 1;
      min-width: 130px;
      background: #ffffff;
      border: 1.5px solid #dce5e0;
      border-radius: 9px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      transition: all 0.14s ease;
      position: relative;
    }
    .workflow-node:hover {
      border-color: var(--agro-green);
      box-shadow: 0 4px 12px rgba(11, 110, 82, 0.12);
      transform: translateY(-2px);
    }
    .workflow-node.active-step {
      border-color: var(--agro-green);
      background: #f6faf8;
    }
    .node-step-tag {

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return Object.assign(createInitialState(), JSON.parse(raw));
      } catch (err) {}
      return createInitialState();
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
    }

    function fmtTL(num) {
      return (Number(num) || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
    }

    function fmtKg(num) {
      return (Number(num) || 0).toLocaleString('tr-TR') + ' Kg';
    }

    function fmtInt(num) {
      return (Number(num) || 0).toLocaleString('tr-TR');
    }

    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getCurrentUser() {
      if (!state.users || state.users.length === 0) {
        return { id: 'u_admin', username: 'admin', fullName: 'Süleyman Köklü', role: 'Ana Yönetici', isAdmin: true, modules: ['all'] };
      }
      return state.users.find(u => u.id === state.currentUserId) || state.users[0];
    }

    function isModuleAllowed(modId) {
      if (modId === 'ana-ekran') return true;
      const cu = getCurrentUser();
      if (!cu) return true;
      if (cu.isAdmin || (cu.modules && cu.modules.includes('all'))) return true;
      return Array.isArray(cu.modules) && cu.modules.includes(modId);
    }

    function getModuleById(id) {
      if (id === 'ana-ekran') return { id: 'ana-ekran', label: 'Masaüstü', icon: 'home', viewType: 'home' };
      return MODULES.find(m => m.id === id) || MODULES[0];
    }

    function showToast(msg) {
      const stack = document.getElementById('toastStack');
      const el = document.createElement('div');
      el.className = 'toast-item';
      el.textContent = msg;
      stack.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 200);
      }, 3000);
    }

    }

    /* =========================================================================
       SIDEBAR & TAB YÖNETİMİ
       ========================================================================= */
    function syncSidebarDOM() {
      const sb = document.getElementById('leftSidebar');
      const ov = document.getElementById('sidebarOverlay');
      const pinBtn = document.getElementById('sidebarPinBtn');
      sb.classList.toggle('open', state.sidebarOpen);
      sb.classList.toggle('pinned', state.sidebarPinned);
      ov.classList.toggle('active', state.sidebarOpen && !state.sidebarPinned);
      if (pinBtn) pinBtn.classList.toggle('active', state.sidebarPinned);
    }

    function toggleSidebar() {
      state.sidebarOpen = !state.sidebarOpen;
      saveState();
      syncSidebarDOM();
    }

    function closeSidebarIfFloating() {
      if (state.sidebarOpen && !state.sidebarPinned) {
        state.sidebarOpen = false;
        saveState();
        syncSidebarDOM();
      }
    }

    function toggleSidebarGroup(gName) {
      if (!state.sidebarCollapsedGroups) state.sidebarCollapsedGroups = {};
      state.sidebarCollapsedGroups[gName] = !state.sidebarCollapsedGroups[gName];
      saveState();
      renderSidebar();
    }

    function openModule(id, filterVal) {
      if (id !== 'ana-ekran' && !isModuleAllowed(id)) {
        showToast('Bu modüle erişim yetkiniz bulunmamaktadır.');
        return;
      }
      const mod = getModuleById(id);
      if (!state.openTabs.some(t => t.id === id)) {
        state.openTabs.push({ id: mod.id, label: mod.label, icon: mod.icon });
      }
      state.activeTabId = id;
      state.tableFilter = '';
      state.subFilter = filterVal || 'Tümü';
      closeSidebarIfFloating();
      saveState();
      renderTopBar();
      renderSidebar();
      renderCenterStage();
    }

    function closeTab(id) {
      if (id === 'ana-ekran') return;
      const idx = state.openTabs.findIndex(t => t.id === id);
      if (idx === -1) return;
      state.openTabs.splice(idx, 1);
      if (state.activeTabId === id) {
        const next = state.openTabs[Math.max(0, idx - 1)] || state.openTabs[0];
        state.activeTabId = next ? next.id : 'ana-ekran';
      }
      saveState();
      renderTopBar();
      renderSidebar();
      renderCenterStage();
    }

    function toggleFavoriteActiveScreen() {
      const cur = state.activeTabId;
      const exists = state.favoriteScreens.some(f => f.id === cur);
      if (exists) {
        state.favoriteScreens = state.favoriteScreens.filter(f => f.id !== cur);
        showToast('Favorilerden çıkarıldı.');
      } else {
        const mod = getModuleById(cur);
        state.favoriteScreens.push({ id: cur, sub: state.subFilter || 'Tümü', label: mod.label });
        showToast('Favorilere eklendi.');
      }
      saveState();
      renderTopBar();
      if (state.activeTabId === 'ana-ekran') renderCenterStage();
    }

    function renderTopBar() {
      const wrap = document.getElementById('workspaceTabs');
      wrap.innerHTML = state.openTabs.map(tab => {
        const active = tab.id === state.activeTabId ? 'active' : '';
        const closeBtn = tab.id !== 'ana-ekran'
          ? `<span class="tab-close" data-action="close-tab" data-id="${tab.id}" title="Kapat">×</span>`
          : '';
        return `
          <div class="ws-tab ${active}" data-action="open-module" data-id="${tab.id}" role="tab" tabindex="0">
            ${ICONS[tab.icon] || ICONS.home}
            <span>${esc(tab.label)}</span>
            ${closeBtn}
          </div>
        `;
      }).join('');

      const starBtn = document.getElementById('starActiveBtn');
      starBtn.classList.toggle('is-favorited', state.favoriteScreens.some(f => f.id === state.activeTabId));
      document.getElementById('lastBackupText').textContent = state.lastBackup || 'Yedekli';

      // Update User Pill
      const cu = getCurrentUser();
      const uName = document.getElementById('topActiveUserName');
      const uRole = document.getElementById('topActiveUserRole');
      const uAv = document.getElementById('topAvatarIcon');
      if (uName) uName.textContent = cu.fullName;
      if (uRole) uRole.textContent = cu.role;
      if (uAv) uAv.textContent = cu.isAdmin ? '👑' : '👤';
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      const sq = (state.sidebarQuery || '').trim().toLocaleLowerCase('tr-TR');

      const homeBtn = (!sq || 'masaüstü ana ekran dashboard'.includes(sq)) ? `
        <button type="button" class="nav-item ${state.activeTabId === 'ana-ekran' ? 'active' : ''}" data-action="open-module" data-id="ana-ekran">
          <span class="nav-item-left">
            ${ICONS.home}
            <span>Masaüstü (Genel Bakış)</span>
          </span>
          <span class="nav-item-badge">Ana Ekran</span>
        </button>
      ` : '';

    /* =========================================================================
       CHARTS
       ========================================================================= */
    function buildAgroChartsSection() {
      const monthly = [
        { m: 'Haz', alis: 520, satis: 590 },
        { m: 'Tem', alis: 860, satis: 940 },
        { m: 'Ağu', alis: 1240, satis: 1380 },
        { m: 'Eyl', alis: 1680, satis: 1910 },
        { m: 'Eki', alis: 2150, satis: 2460 },
        { m: 'Kas', alis: 2845, satis: 3420 }
      ];
      const maxVal = 3600;
      const trendPts = [];
      const barsSvg = monthly.map((d, idx) => {
        const xBase = 46 + idx * 74;
        const h1 = Math.round((d.alis / maxVal) * 110);
        const h2 = Math.round((d.satis / maxVal) * 110);
        const y1 = 136 - h1;
        const y2 = 136 - h2;
        trendPts.push(`${xBase + 28},${y2 - 4}`);
        return `
          <rect x="${xBase}" y="${y1}" width="14" height="${h1}" rx="3" fill="#b86e0c" />
          <rect x="${xBase + 17}" y="${y2}" width="14" height="${h2}" rx="3" fill="#0b6e52" />
          <text x="${xBase + 15}" y="153" text-anchor="middle" font-size="10.5" font-weight="600" fill="#425950">${d.m}</text>
          <text x="${xBase + 24}" y="${y2 - 6}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#0b6e52">${Math.round(d.satis / 1000 * 10) / 10}M</text>
        `;
      }).join('');

      const C = 289.03;
      const p1 = 44, p2 = 28, p3 = 18, p4 = 10;
      const s1 = (p1 / 100) * C, s2 = (p2 / 100) * C, s3 = (p3 / 100) * C, s4 = (p4 / 100) * C;

      return `
        <section class="netsis-charts-grid">
          <div class="netsis-chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title">
                <span style="color:var(--agro-green);display:inline-flex;">${ICONS.analiz}</span>
                <span>Aylık Zahire Alım & Sevk Seyri (Bin ₺)</span>
              </div>
              <div class="chart-legend">
                <span><i class="legend-dot" style="background:#b86e0c;"></i>Müstahsil Alım</span>
                <span><i class="legend-dot" style="background:#0b6e52;"></i>Fabrika Satış</span>
              </div>
            </div>
            <svg viewBox="0 0 495 162" style="width:100%;height:154px;display:block;">
              <line x1="36" y1="24" x2="482" y2="24" stroke="#e0ece6" stroke-dasharray="3 3"/>
              <line x1="36" y1="62" x2="482" y2="62" stroke="#e0ece6" stroke-dasharray="3 3"/>
              <line x1="36" y1="100" x2="482" y2="100" stroke="#e0ece6" stroke-dasharray="3 3"/>
              <line x1="36" y1="136" x2="482" y2="136" stroke="#b5cebe" stroke-width="1.2"/>
              ${barsSvg}
              <polyline points="${trendPts.join(' ')}" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>

          <div class="netsis-chart-card">
            <div class="chart-card-head">
              <div class="chart-card-title">
                <span style="color:var(--agro-green);display:inline-flex;">${ICONS.silo}</span>
                <span>Silo Doluluk & Hububat Dağılımı</span>
              </div>
              <span class="badge badge-green">1.122 Ton</span>
            </div>
            <div class="donut-wrap">
              <div class="donut-svg-box">
                <svg viewBox="0 0 120 120" style="width:110px;height:110px;transform:rotate(-90deg);display:block;">
                  <circle cx="60" cy="60" r="46" fill="none" stroke="#d5e3dc" stroke-width="15" />
                  <circle cx="60" cy="60" r="46" fill="none" stroke="#0b6e52" stroke-width="15" stroke-dasharray="${s1} ${C - s1}" stroke-dashoffset="0" />
                  <circle cx="60" cy="60" r="46" fill="none" stroke="#b86e0c" stroke-width="15" stroke-dasharray="${s2} ${C - s2}" stroke-dashoffset="${-s1}" />
                  <circle cx="60" cy="60" r="46" fill="none" stroke="#059669" stroke-width="15" stroke-dasharray="${s3} ${C - s3}" stroke-dashoffset="${-(s1 + s2)}" />
                  <circle cx="60" cy="60" r="46" fill="none" stroke="#ca8a04" stroke-width="15" stroke-dasharray="${s4} ${C - s4}" stroke-dashoffset="${-(s1 + s2 + s3)}" />
                </svg>
                <div class="donut-center-label">
                  <strong>%78</strong>
                  <span>Doluluk</span>
                </div>
              </div>
              <div class="donut-legend">
                <div class="donut-item">
                  <div class="donut-item-left"><i class="legend-dot" style="background:#0b6e52;"></i><span>Mısır (Çelik Silo 1)</span></div>
                  <strong>%44</strong>
                </div>
                <div class="donut-item">
                  <div class="donut-item-left"><i class="legend-dot" style="background:#b86e0c;"></i><span>Ekmeklik Buğday</span></div>
                  <strong>%28</strong>
                </div>
                <div class="donut-item">
                  <div class="donut-item-left"><i class="legend-dot" style="background:#059669;"></i><span>Arpa (Merkez Depo)</span></div>
                  <strong>%18</strong>
                </div>
                <div class="donut-item">
                  <div class="donut-item-left"><i class="legend-dot" style="background:#ca8a04;"></i><span>Ayçiçeği (Emanet)</span></div>
                  <strong>%10</strong>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;
    }

    /* =========================================================================
       STAGE VE MODAL YÖNETİMİ
       ========================================================================= */
    function renderCenterStage() {
      const stage = document.getElementById('centerStage');
      if (state.activeTabId === 'ana-ekran') {
        stage.innerHTML = renderHomeStage();
        return;
      }
      if (!isModuleAllowed(state.activeTabId)) {
        stage.innerHTML = renderAccessDenied();
        return;
      }
      const mod = getModuleById(state.activeTabId);
      switch (mod.viewType) {
        case 'purchases': stage.innerHTML = renderPurchasesView(mod); break;
        case 'sales': stage.innerHTML = renderSalesView(mod); break;
        case 'scale': stage.innerHTML = renderScaleView(mod); break;
        case 'parties': stage.innerHTML = renderPartiesView(mod); break;
        case 'inventory': stage.innerHTML = renderInventoryView(mod); break;
        case 'trades': stage.innerHTML = renderTradesView(mod); break;
        case 'cash': stage.innerHTML = renderCashView(mod); break;
        case 'instruments': stage.innerHTML = renderInstrumentsView(mod); break;
        case 'expenses': stage.innerHTML = renderExpensesView(mod); break;
        case 'due': stage.innerHTML = renderDueView(mod); break;
        case 'tools': stage.innerHTML = renderToolsView(mod); break;
        case 'guide': stage.innerHTML = renderGuideView(mod); break;
        case 'settings': stage.innerHTML = renderSettingsView(mod); break;
        default: stage.innerHTML = renderAnalyticsView(mod); break;
      }
    }

    function renderAll() {
      renderTopBar();
      renderSidebar();
      renderCenterStage();
    }

    /* =========================================================================
       EVENT DİNLENMESİ (CLICK & CHANGE)
       ========================================================================= */
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'toggle-sidebar') {
        toggleSidebar();
      } else if (action === 'close-sidebar') {
        state.sidebarOpen = false;
        saveState();
        syncSidebarDOM();
      } else if (action === 'pin-sidebar') {
        state.sidebarPinned = !state.sidebarPinned;
        if (state.sidebarPinned) state.sidebarOpen = true;
        saveState();
        syncSidebarDOM();
      } else if (action === 'toggle-group') {
        toggleSidebarGroup(target.dataset.group);
      } else if (action === 'open-module') {
        openModule(target.dataset.id, target.dataset.sub);
      } else if (action === 'pick-module') {
        closeModal();
        openModule(target.dataset.id);
      } else if (action === 'close-tab') {
        e.stopPropagation();
        closeTab(target.dataset.id);
      } else if (action === 'close-modal') {
        closeModal();
      } else if (action === 'toggle-favorite') {
        toggleFavoriteActiveScreen();
      } else if (action === 'set-subfilter') {
        state.subFilter = target.dataset.val;
        saveState();
        renderCenterStage();
      } else if (action === 'silo-giris') {
        const sku = target.dataset.sku;
        const item = state.urunler.find(u => u.kod === sku);
        if (item) {
          item.miktar += 10000;
          saveState();
          renderCenterStage();
          showToast(item.ad + ' stoğuna 10.000 Kg alım işlendi.');
        }
      } else if (action === 'kantar-detay') {
        const fiş = state.kantarFisleri.find(k => k.no === target.dataset.no);

      } else if (action === 'modal-new-urun') {
        openModal(
          'Yeni Hububat & Alt Kırılım Tanımla',
          `<div class="form-grid">
             <div class="form-field"><label>Hububat Ana Kategorisi</label><select id="nuKategori"><option>Buğday Grubu</option><option>Mısır Grubu</option><option>Arpa Grubu</option><option>Yağlı Tohumlar</option><option>Bakliyat Grubu</option><option>Yem & Yan Ürün</option></select></div>
             <div class="form-field"><label>Hububat Cinsi / Tanımı</label><input id="nuAd" placeholder="Örn: Ekmeklik Kırmızı Yarı Sert" /></div>
             <div class="form-field full"><label>Alt Kırılım / Kalite Spesifikasyonu</label><input id="nuAltKirilim" placeholder="Örn: Protein %12.5, Hektolitre 77, Rutubet %12" /></div>
             <div class="form-field"><label>Depolama / Silo</label><select id="nuSilo"><option>Çelik Silo 1</option><option>Merkez Depo</option><option>Emanet Silo</option></select></div>
             <div class="form-field"><label>Birim</label><select id="nuBirim"><option>Kg</option><option>Ton</option></select></div>
             <div class="form-field"><label>Mevcut Stok Miktarı (Kg)</label><input type="number" id="nuMiktar" value="50000" /></div>
             <div class="form-field"><label>Alış Maliyet Fiyatı (₺/Kg)</label><input type="number" step="0.10" id="nuAlis" value="8.40" /></div>
             <div class="form-field"><label>Belirlenen Satış Fiyatı (₺/Kg)</label><input type="number" step="0.10" id="nuSatis" value="9.90" /></div>
             <div class="form-field"><label>Standart Fire Oranı</label><input id="nuFire" value="%1.0" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-urun">Ürünü Kaydet</button>`
        );
      } else if (action === 'save-new-urun') {
        const ad = (document.getElementById('nuAd').value || '').trim();
        if (!ad) { showToast('Ürün adı girin.'); return; }
        const altKirilim = (document.getElementById('nuAltKirilim').value || '').trim() || ad;
        const kategori = document.getElementById('nuKategori').value || 'Hububat';
        const alis = Number(document.getElementById('nuAlis').value) || 8.00;
        const satis = Number(document.getElementById('nuSatis').value) || 9.50;
        state.urunler.unshift({
          kod: 'HB-0' + (state.urunler.length + 10),
          kategori,
          altKirilim,
          ad,
          silo: document.getElementById('nuSilo').value,
          birim: document.getElementById('nuBirim').value,
          miktar: Number(document.getElementById('nuMiktar').value) || 0,
          kritik: 20000,
          alis,
          satis,
          fire: document.getElementById('nuFire').value || '%1.0'
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Hububat alt kırılımı ile stoğa kaydedildi.');
      } else if (action === 'modal-new-kasa') {
        openModal(
          'Yeni Kasa / Banka Fişi',
          `<div class="form-grid">
             <div class="form-field"><label>İşlem Kanalı</label><select id="nkKanal"><option>Banka</option><option>Kasa</option></select></div>
             <div class="form-field"><label>İşlem Türü</label><select id="nkIslem"><option>Tahsilat</option><option>Tediye (Ödeme)</option><option>Banka Virman</option></select></div>
             <div class="form-field"><label>Tutar (₺)</label><input type="number" id="nkTutar" value="45000" /></div>
             <div class="form-field"><label>Muhatap</label><input id="nkCari" value="Merkez Çiftçi Ödemesi" /></div>
             <div class="form-field full"><label>Açıklama</label><input id="nkAciklama" value="Nakit müstahsil avans ödemesi" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-kasa">Fişi Kaydet</button>`
        );
      } else if (action === 'save-new-kasa') {
        const kanal = document.getElementById('nkKanal').value;
        const islem = document.getElementById('nkIslem').value;
        const tutar = Number(document.getElementById('nkTutar').value) || 0;
        const cari = document.getElementById('nkCari').value;
        const aciklama = document.getElementById('nkAciklama').value;
        const isTahsilat = islem.includes('Tahsilat');

        state.kasaHareketleri.unshift({
          id: 'TR-' + Math.floor(100 + Math.random() * 900),
          tarih: state.currentDate + ' 14:20',
          kanal,
          islem,
          cari,
          aciklama,
          giris: isTahsilat ? tutar : 0,
          cikis: isTahsilat ? 0 : tutar
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Fiş kaydedildi.');
      } else if (action === 'modal-new-gider') {
        openModal(
          'Yeni Masraf & Gider Fişi İşle',
          `<div class="form-grid">
             <div class="form-field full"><label>Masraf Açıklaması</label><input id="ngAciklama" placeholder="Örn: Silo kurutma doğalgazı & elektrik bedeli" /></div>
             <div class="form-field"><label>Ödeme Kanalı</label><select id="ngKanal"><option>Banka</option><option>Kasa</option></select></div>
             <div class="form-field"><label>Tutar (₺)</label><input type="number" id="ngTutar" value="18500" /></div>
             <div class="form-field full"><label>Muhatap Firma / Kurum</label><input id="ngCari" value="Konya Gaz / MEDAŞ Elektrik Dağıtım" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-gider">Gideri Kaydet</button>`
        );
      } else if (action === 'save-new-gider') {
        const aciklama = (document.getElementById('ngAciklama').value || '').trim() || 'İşletme gider fişi';
        const tutar = Number(document.getElementById('ngTutar').value) || 0;
        state.kasaHareketleri.unshift({
          id: 'MS-' + Math.floor(100 + Math.random() * 900),
          tarih: state.currentDate + ' 16:40',
          kanal: 'Masraf',
          islem: 'Gider Fişi',
          cari: document.getElementById('ngCari').value || 'Muhtelif Masraf',
          aciklama,
          giris: 0,
          cikis: tutar
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Masraf fişi kaydedildi.');
      } else if (action === 'modal-new-ceksenet') {
        openModal(
          'Yeni Çek / Senet Kaydı',
          `<div class="form-grid">
             <div class="form-field"><label>Evrak Türü</label><select id="ncsTur"><option>Müşteri Çeki</option><option>Borç Senedi</option></select></div>
             <div class="form-field"><label>Portföy No</label><input id="ncsNo" value="ÇK-${Math.floor(1000 + Math.random() * 9000)}" /></div>
             <div class="form-field full"><label>Borçlu / Keşideci</label><input id="ncsBorclu" placeholder="Örn: Selçuklu Un Sanayi Ltd." /></div>
             <div class="form-field"><label>Vade Tarihi</label><input id="ncsVade" value="28.12.2026" /></div>
             <div class="form-field"><label>Tutar (₺)</label><input type="number" id="ncsTutar" value="125000" /></div>
             <div class="form-field full"><label>Banka & Şube</label><input id="ncsBanka" value="Vakıfbank Konya Sanayi Şubesi" /></div>
           </div>`,
          `<button type="button" class="btn-secondary" data-action="close-modal">Vazgeç</button>
           <button type="button" class="btn-primary" data-action="save-new-ceksenet">Evrakı Portföye Kaydet</button>`
        );
      } else if (action === 'save-new-ceksenet') {
        const borclu = (document.getElementById('ncsBorclu').value || '').trim();
        if (!borclu) { showToast('Borçlu ünvanı girin.'); return; }
        state.ceksenet.unshift({
          no: document.getElementById('ncsNo').value || 'ÇK-9999',
          tur: document.getElementById('ncsTur').value,
          borclu,
          vade: document.getElementById('ncsVade').value,
          tutar: Number(document.getElementById('ncsTutar').value) || 0,
          banka: document.getElementById('ncsBanka').value,
          durum: 'Portföyde'
        });
        saveState(); closeModal(); renderCenterStage(); showToast('Çek/Senet portföye kaydedildi.');
      } else if (action === 'trigger-backup') {
        state.lastBackup = 'Bugün ' + new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        saveState();
        document.getElementById('lastBackupText').textContent = state.lastBackup;
        closeModal();
        showToast('Veriler bulut veri tabanına başarıyla yedeklendi.');
      } else if (action === 'print-page') {
        window.print();
      }
    });

    /* =========================================================================
       DEĞİŞİKLİK VE OTOMATİK FİYAT SEÇİMLERİ
       ========================================================================= */
    document.addEventListener('change', (e) => {
      if (e.target.id === 'nsUrun') {
        const opt = e.target.selectedOptions[0];
        if (opt && opt.dataset.satis) {
          const inp = document.getElementById('nsFiyat');
          if (inp) inp.value = opt.dataset.satis;
        }
      } else if (e.target.id === 'nmUrun') {
        const opt = e.target.selectedOptions[0];
        if (opt && opt.dataset.alis) {
          const inp = document.getElementById('nmFiyat');
          if (inp) inp.value = opt.dataset.alis;
        }
      }
    });

    /* =========================================================================
       INPUT VE ARAMA DİNLENMESİ
       ========================================================================= */
    document.addEventListener('input', (e) => {
      if (e.target.id === 'homeModuleSearch') {
        state.homeSearch = e.target.value;
        const grid = document.querySelector('.modules-grid');
        if (grid) {
          const q = state.homeSearch.trim().toLocaleLowerCase('tr-TR');
          const filtered = MODULES.filter(m => isModuleAllowed(m.id) && (!q || `${m.label} ${m.keywords}`.toLocaleLowerCase('tr-TR').includes(q)));
          grid.innerHTML = filtered.length > 0
            ? filtered.map(m => `
                <button type="button" class="module-tile" data-action="open-module" data-id="${m.id}">
                  <div class="netsis-app-icon ${m.id === 'mustahsil-alis' ? 'icon-amber' : m.id === 'kantar' ? 'icon-blue' : ''}">
                    ${ICONS[m.icon]}
                    <span class="netsis-tile-badge ${m.badgeOk ? 'badge-ok' : ''}">${esc(m.badge)}</span>
                  </div>
                  <div class="module-tile-title">${esc(m.label)}</div>
                </button>
              `).join('')
            : `<div style="grid-column:1/-1;text-align:center;padding:24px;color:#64748b;font-weight:600;">Eşleşen modül bulunamadı.</div>`;
        }
      } else if (e.target.id === 'sidebarFilterInput') {
        state.sidebarQuery = e.target.value;
        renderSidebar();
      } else if (e.target.id === 'moduleSearchInput') {
        state.tableFilter = e.target.value;
        renderCenterStage();
      } else if (e.target.id === 'fxAmountInput') {
        state.fxAmount = Number(e.target.value) || 0;
        renderCenterStage();
      } else if (e.target.id === 'fxCurrencySelect') {
        state.fxCurrency = e.target.value;
        renderCenterStage();
      }
    });

    /* =========================================================================
       BAŞLATMA VE KLAVYE KISAYOLLARI
       ========================================================================= */
    document.getElementById('masterMenuBtn').addEventListener('click', toggleSidebar);
    document.getElementById('sidebarCloseBtn').addEventListener('click', () => {
      state.sidebarOpen = false;
      saveState();
      syncSidebarDOM();
    });
    document.getElementById('sidebarPinBtn').addEventListener('click', () => {
      state.sidebarPinned = !state.sidebarPinned;
      if (state.sidebarPinned) state.sidebarOpen = true;
      saveState();
      syncSidebarDOM();
    });
    document.getElementById('sidebarOverlay').addEventListener('click', closeSidebarIfFloating);
    document.getElementById('starActiveBtn').addEventListener('click', toggleFavoriteActiveScreen);
    document.getElementById('cloudBackupBtn').addEventListener('click', showCloudBackupModal);
    document.getElementById('userSwitchBtn').addEventListener('click', () => {
      document.querySelector('[data-action="user-switch-modal"]') || document.body.dispatchEvent(new CustomEvent('open-user-modal'));
      const trigger = document.createElement('button');
      trigger.dataset.action = 'user-switch-modal';
      document.body.appendChild(trigger);
      trigger.click();
      trigger.remove();
    });
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modalBackdrop') closeModal();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'F10') {
        e.preventDefault();
        showShortcutPickerModal();
      } else if (e.key === 'Escape') {
        closeModal();
      } else if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'homeModuleSearch') {
        const q = state.homeSearch.trim().toLocaleLowerCase('tr-TR');
        if (q) {
          const match = MODULES.find(m => isModuleAllowed(m.id) && `${m.label} ${m.keywords}`.toLocaleLowerCase('tr-TR').includes(q));
          if (match) openModule(match.id);
        }
      }
    });

    // UYGULAMAYI BAŞLAT
    state = loadState();
    renderAll();
  </script>
</body>
</html>
