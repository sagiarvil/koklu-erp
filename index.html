  <style>/* KÖKLÜ AGRO PRO+ — V10.3 GENİŞLETİLMİŞ ZAHİRE & PREMIUM KURUMSAL TASARIM SİSTEMİ */
:root,
html[data-theme="emerald"] {
  --bg: #f1f6f4;
  --paper: #ffffff;
  --paper-alt: #f7fbf9;
  --ink: #10231c;
  --muted: #4e665c;
  --line: #d7e5de;
  --line-soft: #e7f0ec;
  --brand: #0b6e52;
  --brand-hover: #085640;
  --brand-soft: #e2f4ed;
  --brand-border: #b3decb;
  --side: #0b261e;
  --side-elev: #12362b;
  --side-active-a: #0d7a5b;
  --side-active-b: #169a74;
  --side-text: #dcece5;
  --side-muted: #8cb3a3;
  --side-line: #1c4438;
  --next-bg: #e6f4ef;
  --next-border: #b7dfd0;
  --next-ink: #0c3b2d;
  --ui-blue: #1e56c5;
  --ui-blue-b: #3676eb;
  --ui-blue-soft: #e7effe;
  --ui-red: #bf2249;
  --ui-red-b: #e24467;
  --ui-red-soft: #fde9ee;
  --ui-green: #087f63;
  --ui-green-b: #15a884;
  --ui-green-soft: #e1f6f0;
  --ui-yellow: #b86e0c;
  --ui-yellow-b: #eea429;
  --ui-yellow-soft: #fef3dc;
  --shadow: 0 8px 24px rgba(11, 38, 30, 0.055);
  --shadow-hover: 0 14px 32px rgba(11, 38, 30, 0.11);
  --shadow-modal: 0 24px 56px rgba(8, 28, 22, 0.28);
  --radius: 13px;
  --radius-lg: 17px;
}

html[data-theme="sapphire"] {
  --bg: #f2f5fb;
  --paper: #ffffff;
  --paper-alt: #f7f9fd;
  --ink: #131c31;
  --muted: #526079;
  --line: #dbe2f0;
  --line-soft: #eaeff8;
  --brand: #1f53be;
  --brand-hover: #173f96;
  --brand-soft: #e7efff;
  --brand-border: #bfd2fb;
  --side: #111930;
  --side-elev: #1a2544;
  --side-active-a: #2255c2;
  --side-active-b: #3b76e6;
  --side-text: #dfe6f6;
  --side-muted: #93a3c4;
  --side-line: #253359;
  --next-bg: #e8f1ff;
  --next-border: #c3d9fb;
  --next-ink: #163770;
  --shadow: 0 8px 24px rgba(17, 25, 48, 0.06);
  --shadow-hover: 0 14px 32px rgba(17, 25, 48, 0.12);
}

html[data-theme="noir"] {
  --bg: #0e1422;
  --paper: #161f33;
  --paper-alt: #1b263e;
  --ink: #ecf2ff;
  --muted: #9fb0cf;
  --line: #2a3856;
  --line-soft: #222f49;
  --brand: #26b48e;
  --brand-hover: #1e9675;
  --brand-soft: #173835;
  --brand-border: #255d55;
  --side: #080d18;
  --side-elev: #11192c;
  --side-active-a: #0f7f63;
  --side-active-b: #1da683;
  --side-text: #dce6fa;
  --side-muted: #8496b8;
  --side-line: #1c2740;
  --next-bg: #162e36;
  --next-border: #255459;
  --next-ink: #d9f7ee;
  --ui-blue-soft: #1b2c4d;
  --ui-red-soft: #3a1d2b;
  --ui-green-soft: #163832;
  --ui-yellow-soft: #392c17;
  --shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
  --shadow-hover: 0 16px 36px rgba(0, 0, 0, 0.42);
}

* {
  box-sizing: border-box;
}

html {
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--ink);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--ink);
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}

.layout {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
}

.side {
  background: var(--side);
  color: var(--side-text);
  height: 100vh;
  position: sticky;
  top: 0;
  overflow-y: auto;
  padding: 16px 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 11px;
  border-right: 1px solid var(--side-line);
  z-index: 20;
}

.brand-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 2px 6px 12px;
  border-bottom: 1px solid var(--side-line);
}

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--side-active-a), var(--side-active-b));
  color: #ffffff;
  display: grid;
  place-items: center;
  font-weight: 900;
  font-size: 15px;
  letter-spacing: -0.5px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.24);
  flex-shrink: 0;
}

.brand-copy {
  min-width: 0;
}

.brand-title {
  font-size: 15px;
  font-weight: 850;
  color: #ffffff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brand-sub {
  display: block;
  font-size: 9px;
  letter-spacing: 1.2px;
  color: var(--side-muted);
  margin-top: 2px;
  font-weight: 800;
}

.flow-launcher {
  width: 100%;
  border: 1px solid var(--side-line);
  background: var(--side-elev);
  color: #ffffff;
  border-radius: 11px;
  padding: 10px 11px;
  display: flex;
  align-items: center;
  gap: 9px;
  text-align: left;
  transition: border-color 0.15s ease, transform 0.15s ease;
}

.flow-launcher:hover {
  border-color: #3cc89f;
  transform: translateY(-1px);
}

.flow-launcher-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2ce0ae;
  box-shadow: 0 0 0 4px rgba(44, 224, 174, 0.18);
  flex-shrink: 0;
}

.flow-launcher-copy {
  flex: 1;
  min-width: 0;
}

.flow-launcher-copy strong {
  display: block;
  font-size: 11.5px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-launcher-copy small {
  display: block;
  font-size: 10px;
  color: var(--side-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.flow-launcher-arrow {
  color: var(--side-muted);
  font-weight: 800;
}

.nav-group-title {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 1.3px;
  color: var(--side-muted);
  padding: 2px 10px 3px;
  text-transform: uppercase;
}

.nav-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-btn {
  width: 100%;
  min-height: 40px;
  border: 0;
  background: transparent;
  color: var(--side-text);
  padding: 8px 11px;
  border-radius: 9px;
  text-align: left;
  font-size: 12.5px;
  font-weight: 650;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.14s ease, color 0.14s ease;
}

.nav-btn svg {
  width: 17px;
  height: 17px;
  color: var(--side-muted);
}

.nav-btn:hover {
  background: rgba(255, 255, 255, 0.08);
  color: #ffffff;
}

.nav-btn.active {
  background: linear-gradient(115deg, var(--side-active-a), var(--side-active-b));
  color: #ffffff;
  font-weight: 800;
  box-shadow: inset 3px 0 0 #ffffff, 0 6px 16px rgba(0, 0, 0, 0.22);
}

.nav-btn.active svg {
  color: #ffffff;
}

.nav-badge {
  margin-left: auto;
  font-size: 10px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.18);
  color: #ffffff;
  font-variant-numeric: tabular-nums;
}

.side-foot {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.side-help-card {
  background: var(--side-elev);
  border: 1px solid var(--side-line);
  border-radius: 10px;
  padding: 9px 11px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.side-help-card strong {
  font-size: 11px;
  color: #ffffff;
}

.side-help-btn {
  border: 0;
  border-radius: 7px;
  padding: 5px 9px;
  background: #ffffff;
  color: #0d2b22;
  font-size: 10.5px;
  font-weight: 800;
  white-space: nowrap;
}

.side-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 5px 6px 0;
  border-top: 1px solid var(--side-line);
  font-size: 10px;
  color: var(--side-muted);
}

.side-meta strong {
  color: #ffffff;
}

.main-col {
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 64px;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 14;
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.crumb {
  font-size: 13px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.crumb strong {
  color: var(--ink);
  font-weight: 800;
}

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 800;
  background: var(--ui-green-soft);
  color: var(--ui-green);
  white-space: nowrap;
}

.status-pill.warn { background: var(--ui-yellow-soft); color: var(--ui-yellow); }
.status-pill.err { background: var(--ui-red-soft); color: var(--ui-red); }

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.theme-select-wrap {
  height: 38px;
  padding: 0 9px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--paper-alt);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--brand);
}

.theme-select-wrap select {
  border: 0;
  background: transparent;
  font-size: 12px;
  font-weight: 750;
  color: var(--ink);
  outline: 0;
  cursor: pointer;
}

.theme-select-wrap option {
  background: #ffffff;
  color: #10231c;
}

.kbd-hint {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 5px;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--muted);
}

.mobile-toggle {
  display: none;
  width: 40px;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper-alt);
  place-items: center;
}

.backdrop { display: none; }

.content-wrap {
  width: 100%;
  min-width: 0;
  max-width: min(1620px, 100%);
  margin: 0 auto;
  padding: 20px 24px 52px;
  flex: 1;
}

.print-letterhead { display: none; }

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.page-head h1 {
  font-size: 23px;
  font-weight: 850;
  letter-spacing: -0.5px;
  margin: 0;
}

.page-head p {
  margin: 2px 0 0;
  font-size: 12px;
  color: var(--muted);
}

.head-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.btn {
  min-height: 39px;
  padding: 8px 13px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--ink);
  font-size: 12px;
  font-weight: 750;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
  transition: transform 0.14s ease, box-shadow 0.14s ease, border-color 0.14s ease;
}

.btn svg { width: 15px; height: 15px; }

.btn:hover {
  transform: translateY(-1px);
  border-color: var(--brand);
  box-shadow: 0 5px 12px rgba(0, 0, 0, 0.06);
}

.btn.primary {
  background: linear-gradient(115deg, var(--brand), var(--ui-green-b));
  border-color: transparent;
  color: #ffffff;
}

.btn.blue {
  background: linear-gradient(115deg, var(--ui-blue), var(--ui-blue-b));
  border-color: transparent;
  color: #ffffff;
}

.btn.secondary {
  background: var(--brand-soft);
  border-color: var(--brand-border);
  color: var(--brand);
}

.btn.amber {
  background: var(--ui-yellow-soft);
  border-color: #eed199;
  color: var(--ui-yellow);
}

.btn.danger {
  background: var(--ui-red-soft);
  border-color: #f3c1cc;
  color: var(--ui-red);
}

.btn.sm {
  min-height: 31px;
  padding: 5px 9px;
  font-size: 11px;
  border-radius: 7px;
}

.next-step {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  background: var(--next-bg);
  border: 1px solid var(--next-border);
  border-radius: var(--radius-lg);
  color: var(--next-ink);
  margin-bottom: 16px;
}

.next-symbol {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  background: var(--paper);
  color: var(--brand);
  display: grid;
  place-items: center;
  flex-shrink: 0;
  box-shadow: var(--shadow);
}

.next-label { flex: 1; min-width: 0; }
.next-label strong { display: block; font-size: 13px; font-weight: 850; }
.next-label p { margin: 2px 0 0; font-size: 11.5px; opacity: 0.88; }
.next-button { min-height: 42px; padding: 9px 16px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 14px;
}

.kpi-action {
  border: 0;
  border-radius: var(--radius-lg);
  padding: 15px 16px;
  min-height: 128px;
  color: #ffffff;
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 7px;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button.kpi-action:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-hover);
}

.kpi-action::before {
  content: "";
  position: absolute;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.14);
  right: -28px;
  top: -38px;
  z-index: -1;
}

.kpi-blue { background: linear-gradient(122deg, var(--ui-blue), var(--ui-blue-b)); }
.kpi-red { background: linear-gradient(122deg, var(--ui-red), var(--ui-red-b)); }
.kpi-green { background: linear-gradient(122deg, var(--ui-green), var(--ui-green-b)); }
.kpi-yellow { background: linear-gradient(122deg, #c97a10, #f3b238); color: #162030; }

.kpi-head { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; }
.kpi-icon { width: 30px; height: 30px; border-radius: 8px; background: rgba(255, 255, 255, 0.24); display: grid; place-items: center; }
.kpi-yellow .kpi-icon { background: rgba(22, 32, 48, 0.12); }
.kpi-number { font-size: clamp(17px, 1.8vw, 23px); font-weight: 850; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi-caption { font-size: 11px; font-weight: 650; opacity: 0.92; }

.stat-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 13px 15px;
  box-shadow: var(--shadow);
  min-width: 0;
}

.stat-card span { display: block; font-size: 11px; font-weight: 750; color: var(--muted); }
.stat-card strong { display: block; font-size: 18.5px; font-weight: 850; margin-top: 4px; letter-spacing: -0.4px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-card small { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; }

.action-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
  margin-bottom: 16px;
}

.action-tile {
  min-height: 66px;

  gap: 11px;
  text-align: left;
  font-weight: 800;

  min-width: 0;
}

.action-tile:hover { transform: translateY(-2px); border-color: var(--brand); }
.action-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.action-tile.green .action-icon { background: var(--ui-green-soft); color: var(--ui-green); }
.action-tile.blue .action-icon { background: var(--ui-blue-soft); color: var(--ui-blue); }
.action-tile.yellow .action-icon { background: var(--ui-yellow-soft); color: var(--ui-yellow); }
.action-tile.red .action-icon { background: var(--ui-red-soft); color: var(--ui-red); }
.action-tile-label { flex: 1; min-width: 0; }
.action-tile-label strong { display: block; font-size: 12.5px; }
.action-tile-label small { display: block; font-size: 10.5px; font-weight: 600; color: var(--muted); margin-top: 1px; }
.action-arrow { font-size: 16px; color: var(--muted); font-weight: 800; }

.dashboard-slim {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.95fr);
  gap: 14px;
  margin-bottom: 16px;
}

.equal-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 16px;
}

.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
  min-width: 0;
}

.dashboard-slim > .card,
.equal-2 > .card { margin-bottom: 0; }

.card-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.card-head h2 { margin: 0; font-size: 14.5px; font-weight: 850; }

.toolbar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 12px;
}

.input,
.select {
  min-height: 38px;
  padding: 7px 11px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--paper);
  font-size: 12.5px;
  min-width: 165px;
}

.filter-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.tab-chip {
  min-height: 34px;
  padding: 6px 12px;
  border-radius: 30px;
  border: 1px solid var(--line);
  background: var(--paper);
  font-size: 11.5px;
  font-weight: 750;
  color: var(--muted);
}

.tab-chip.active {
  background: var(--brand);
  border-color: var(--brand);
  color: #ffffff;
}

/* MASAÜSTÜNDE TAM SÜTUNLU TABLO (İÇ KAYDIRMALI, SAYFA TAŞMASIZ), MOBİLDE KART */
.table-wrap {
  width: 100%;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--paper);
  overflow-x: auto;
}

.tbl {
  width: 100%;

  font-variant-numeric: tabular-nums;
}

.tbl th {
  background: var(--paper-alt);

  text-align: left;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.4px;
  padding: 10px 10px;

}

.tbl td {

.tbl tbody tr:last-child td { border-bottom: 0; }

.row-actions {

}

.badge {

}

.badge.green { background: var(--ui-green-soft); color: var(--ui-green); }
.badge.red { background: var(--ui-red-soft); color: var(--ui-red); }
.badge.amber { background: var(--ui-yellow-soft); color: var(--ui-yellow); }
.badge.blue { background: var(--ui-blue-soft); color: var(--ui-blue); }
.badge.neutral { background: var(--paper-alt); color: var(--muted); border: 1px solid var(--line); }

.text-good { color: var(--ui-green); font-weight: 800; }
.text-bad { color: var(--ui-red); font-weight: 800; }
.text-muted { color: var(--muted); }

.empty-box {
  padding: 24px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 12.5px;
  border: 1px dashed var(--line);
  border-radius: 11px;
  background: var(--paper-alt);
}

.empty-box strong { display: block; color: var(--ink); font-size: 13.5px; margin-bottom: 6px; }

.status-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--ui-green-soft);
  color: var(--ui-green);
  font-size: 12px;
  font-weight: 750;
  margin-bottom: 14px;

}

.status-strip.warn { background: var(--ui-yellow-soft); color: var(--ui-yellow); }

.context-help {

  border: 1px solid var(--line);
  border-left: 4px solid var(--ui-blue);
  border-radius: var(--radius);

  margin-top: 14px;
}

.context-help summary {
  cursor: pointer;
  min-height: 34px;
  font-weight: 800;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  list-style: none;
}

.context-help summary::-webkit-details-marker { display: none; }

.help-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line-soft);
}

.help-grid b { display: block; font-size: 11.5px; color: var(--brand); margin-bottom: 3px; }
.help-grid p { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.48; }

.guide-cards {

  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.guide-tile {
  background: var(--paper);

  border-radius: var(--radius);

}

.guide-tile-head { display: flex; align-items: center; gap: 9px; }
.guide-num { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); color: #ffffff; display: grid; place-items: center; font-weight: 850; font-size: 12.5px; }

.pager-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 9px 12px;
  border-top: 1px solid var(--line);

  color: var(--muted);

/* GENİŞLETİLMİŞ KURUMSAL MODAL */
.modal-overlay {

.modal-card {

.modal-head {

.modal-head h2 { margin: 0; font-size: 17px; font-weight: 850; }

.mode-switch {

.mode-btn {

.mode-btn.active.green { background: linear-gradient(115deg, var(--ui-green), var(--ui-green-b)); border-color: transparent; color: #ffffff; }
.mode-btn.active.blue { background: linear-gradient(115deg, var(--ui-blue), var(--ui-blue-b)); border-color: transparent; color: #ffffff; }
.mode-btn.active.red { background: linear-gradient(115deg, var(--ui-red), var(--ui-red-b)); border-color: transparent; color: #ffffff; }

.form-section-title {
  grid-column: 1 / -1;
  font-size: 11px;
  font-weight: 850;
  text-transform: uppercase;
  letter-spacing: 0.8px;

}

.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

}

.form-grid {

  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 11px;
}

.form-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.form-field.full { grid-column: 1 / -1; }
.form-field.span-2 { grid-column: span 2; }

.form-field label {
  font-size: 11.5px;

.form-field input,
.form-field select,
.form-field textarea {

}

.form-field input[readonly] {

}

.inline-party-box {

}

.quick-chips {

}

.chip-btn {

}

.chip-btn:hover {

}

.calc-preview-6 {

.modal-foot {

.cmd-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; max-height: 340px; overflow-y: auto; }

}

function assert(cond, code, msg) {

function cleanText(val, label = 'Alan', min = 1, max = 160) {
  assert(typeof val === 'string', 'METIN_TIPI', `${label} metin olmalıdır.`);
  const s = val.trim().replace(/\s+/g, ' ');
  assert(s.length >= min && s.length <= max, 'METIN_UZUNLUK', `${label} ${min}–${max} karakter arasında olmalıdır.`);
  return s;
}

function optionalText(val, max = 240) {
  if (val === undefined || val === null) return '';
  assert(typeof val === 'string', 'METIN_TIPI', 'Açıklama metin olmalıdır.');
  const s = val.trim().replace(/\s+/g, ' ');
  assert(s.length <= max, 'METIN_UZUNLUK', `Metin en fazla ${max} karakter olabilir.`);
  return s;
}

function validId(id) {
  return typeof id === 'string' && /^[A-Za-z0-9_-]{3,96}$/.test(id);
}

function strictIsoDate(s, label = 'Tarih') {
  assert(typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s), 'TARIH_FORMAT', `${label} YYYY-AA-GG biçiminde olmalıdır.`);
  const [y, m, d] = s.split('-').map((part) => Number(part));
  const dt = new Date(Date.UTC(y, m - 1, d));
  assert(
    Number.isFinite(dt.getTime()) &&
      dt.getUTCFullYear() === y &&
      dt.getUTCMonth() + 1 === m &&
      dt.getUTCDate() === d,
    'TARIH_GECERSIZ',
    `${label} takvimde geçerli bir gün değil: ${s}`
  );
  return s;
}

function optionalIsoDate(s, label = 'Vade tarihi') {
  if (s === undefined || s === null || String(s).trim() === '') return '';
  return strictIsoDate(String(s).trim(), label);
}

function parseTrScaled(rawInput, decimals, maxAbs = MAX_MINOR, allowNegative = false, label = 'Tutar') {
  if (typeof rawInput === 'bigint') {
    assert(allowNegative || rawInput >= 0n, 'NEGATIF_YASAK', `${label} negatif olamaz.`);
    const abs = rawInput < 0n ? -rawInput : rawInput;
    assert(abs <= maxAbs, 'ARALIK_ASIMI', `${label} izin verilen üst sınırı aşıyor.`);
    return rawInput;
  }
  assert(typeof rawInput === 'string', 'SAYI_METIN_OLMALI', `${label} metin olarak girilmelidir.`);
  const trimmed = rawInput.trim().replace(/\s+/g, '');
  assert(trimmed.length > 0, 'BOS_DEGER', `${label} boş bırakılamaz.`);

  const neg = trimmed.startsWith('-');
  if (neg) assert(allowNegative, 'NEGATIF_YASAK', `${label} negatif olamaz.`);
  const unsigned = trimmed.replace(/^[+-]/, '');

  assert(
    /^(?:\d+|\d{1,3}(?:\.\d{3})+)(?:,\d+)?$/.test(unsigned),
    'SAYI_BICIMI',
    `${label} için Türkçe sayı biçimi kullanın (örn. 1.250,50).`
  );

  const [wholeRaw, fracRaw = ''] = unsigned.split(',');
  assert(fracRaw.length <= decimals, 'FAZLA_ONDALIK', `${label} en fazla ${decimals} ondalık basamak içerebilir.`);

  const wholeDigits = wholeRaw.replace(/\./g, '');
  const scale = 10n ** BigInt(decimals);
  const paddedFrac = fracRaw.padEnd(decimals, '0');
  const val = BigInt(wholeDigits) * scale + BigInt(paddedFrac || '0');
  assert(val <= maxAbs, 'ARALIK_ASIMI', `${label} izin verilen üst sınırı aşıyor.`);
  return neg ? -val : val;
}

function parseMoneyMinor(s, label = 'Tutar', allowZero = false, allowNegative = false) {
  const v = parseTrScaled(s, 2, MAX_MINOR, allowNegative, label);
  if (!allowZero && !allowNegative) assert(v > 0n, 'SIFIR_YASAK', `${label} sıfırdan büyük olmalıdır.`);
  return v.toString();
}

function parseOptionalMoneyMinor(s, label = 'Tutar') {
  if (s === undefined || s === null || String(s).trim() === '' || String(s).trim() === '0' || String(s).trim() === '0,00') return '0';

function divRoundHalfAway(numerator, denominator) {
  const num = BigInt(numerator);
  const den = BigInt(denominator);
  assert(den !== 0n, 'SIFIRA_BOLME', 'Payda sıfır olamaz.');
  const neg = (num < 0n) !== (den < 0n);
  const a = num < 0n ? -num : num;
  const b = den < 0n ? -den : den;
  const q = a / b;
  const r = a % b;
  const rounded = r * 2n >= b ? q + 1n : q;
  return neg ? -rounded : rounded;
}

  return `${neg}${whole},${kurus}${withSymbol ? ' ₺' : ''}`;
